/* =========================================================
   AI 记录：一句话建待办 / 改期 / 标完成
   本地语义解析，不联网、不花钱、断网也能用
   ========================================================= */
var _aiPending = null;

function aiPad(n){ return (n<10?'0':'')+n; }
function aiWeekdayMap(ch){ return { '一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0 }[ch]; }

/* 归一化：全角标点/字母数字 → 半角，压缩空白。所有解析都在归一化文本上做 */
function aiNorm(src){
  var s=String(src==null?'':src);
  s=s.replace(/[\uFF01-\uFF5E]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); });
  s=s.replace(/\u3000/g,' ');
  s=s.replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"');
  s=s.replace(/\s+/g,' ');
  return s.trim();
}
function aiCnNum(s){
  var map={ '零':0,'〇':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9 };
  if(/^\d+$/.test(s)) return Number(s);
  var m=s.match(/^([一二两三四五六七八九])?十([一二三四五六七八九])?$/);
  if(m){ var a=m[1]?map[m[1]]:1, b=m[2]?map[m[2]]:0; return a*10+b; }
  if(s.length===1 && map[s]!==undefined) return map[s];
  return null;
}

/* ---------- 日期推演：把"N天/N周/N个月后"算成具体日期 ---------- */
var AI_NUM='([0-9]{1,3}|[一二两三四五六七八九十]{1,3})';
/* 数字解析：阿拉伯数字 or 中文（一 ~ 九十九） */
function aiNum(s){
  s=String(s==null?'':s).trim();
  if(/^[0-9]{1,3}$/.test(s)) return Number(s);
  var v=aiCnNum(s);
  return v===null ? null : v;
}
/* 加月份：1月31日 + 1个月 → 2月28/29日，不溢出 */
function aiAddMonths(s, n){
  var d=new Date(s+'T00:00:00');
  var y=d.getFullYear(), mo=d.getMonth()+n, day=d.getDate();
  var last=new Date(y, mo+1, 0).getDate();
  if(day>last) day=last;
  return fmtD(new Date(y, mo, day));
}
/* 某月的最后一天，n 为月份偏移 */
function aiMonthEnd(s, n){
  var d=new Date(s+'T00:00:00');
  var y=d.getFullYear(), mo=d.getMonth()+(n||0);
  return fmtD(new Date(y, mo, new Date(y, mo+1, 0).getDate()));
}
/* 加工作日：跳过周六日 */
function aiAddWorkdays(s, n){
  var d=new Date(s+'T00:00:00'), left=Math.abs(n)||0, step=n<0?-1:1;
  while(left>0){ d.setDate(d.getDate()+step); var w=d.getDay(); if(w!==0 && w!==6) left--; }
  return fmtD(d);
}

/* ---------- 日期 ---------- */
function aiFindDate(text){
  var t0=todayStr(), m, wd, diff, pre, n, y, mo, last, dd;
  function mk(r, ds){ return { date:ds, hit:r[0], s:r.index, e:r.index+r[0].length }; }
  function tail(sp){ return aiTailSpan(text, sp); }

  /* ===== 0) 数字推演（放在"后天/明天"之前，先吃数字）===== */

  /* 0.1 N 个工作日 */
  m=new RegExp(AI_NUM+'\\s*个?\\s*工作日\\s*(?:之?后|以?后|之内|以内)').exec(text);
  if(m){ n=aiNum(m[1]); if(n!==null && n>=0 && n<=365) return tail(mk(m, aiAddWorkdays(t0, n))); }

  /* 0.2 过/隔 N 天（排除"超过N天"这类期限描述） */
  m=/(?:过|隔)\s*([0-9]{1,3}|[一二两三四五六七八九十]{1,3})\s*天/.exec(text);
  if(m && !/[超经通越]/.test(text.charAt(m.index-1))){
    n=aiNum(m[1]);
    if(n!==null && n>=1 && n<=365) return tail(mk(m, addDays(t0, n)));
  }

  /* 0.3 N 个月 / 半个月（含"3个月内"这类截止） */
  m=new RegExp(AI_NUM+'\\s*个?\\s*月\\s*(?:之?后|以?后|之内|以内|内(?![容部存衣需]))').exec(text);
  if(m){ n=aiNum(m[1]); if(n!==null && n>=1 && n<=24) return tail(mk(m, aiAddMonths(t0, n))); }
  if((m=/半\s*个?\s*月\s*(?:之?后|以?后|之内|以内)/.exec(text))) return tail(mk(m, addDays(t0,15)));

  /* 0.4 N 周 / N 个星期 / N 个礼拜 */
  m=new RegExp(AI_NUM+'\\s*个?\\s*(?:周|星期|礼拜)\\s*(?:之?后|以?后|之内|以内)').exec(text);
  if(m){ n=aiNum(m[1]); if(n!==null && n>=1 && n<=52) return tail(mk(m, addDays(t0, n*7))); }

  /* 0.5 N 天 / N 天之后 / N 天以内（含 3天内 这类截止） */
  m=new RegExp(AI_NUM+'\\s*天\\s*(?:之?后|以?后|之内|以内|内(?![容部存衣需]))').exec(text);
  if(m){ n=aiNum(m[1]); if(n!==null && n>=1 && n<=365) return tail(mk(m, addDays(t0, n))); }

  if((m=/大后天/.exec(text))) return tail(mk(m, addDays(t0,3)));
  if((m=/后天/.exec(text)))   return tail(mk(m, addDays(t0,2)));
  if((m=/(明天|明日|明儿)/.exec(text))) return tail(mk(m, addDays(t0,1)));
  if((m=/(今天|今日)/.exec(text))) return tail(mk(m, t0));
  /* 这/本/下/下下 个月 N 号 */
  if((m=/(下下|下|这|本)\s*个?\s*月\s*([0-9]{1,2}|[一二三四五六七八九十]{1,2})\s*[日号]/.exec(text))){
    n=aiNum(m[2]);
    if(n!==null && n>=1 && n<=31){
      var base0=new Date(t0+'T00:00:00');
      var off=(m[1]==='下')?1:(m[1]==='下下')?2:0;
      y=base0.getFullYear(); mo=base0.getMonth()+off;
      last=new Date(y, mo+1, 0).getDate();
      var ds2=fmtD(new Date(y, mo, Math.min(n, last)));
      /* "这个月5号"已经过去 → 顺延到下个月，别建个过期待办 */
      if(off===0 && ds2<t0){
        last=new Date(y, mo+2, 0).getDate();
        ds2=fmtD(new Date(y, mo+1, Math.min(n, last)));
      }
      return tail(mk(m, ds2));
    }
  }

  /* N 月底 / 这个月底 / 下个月底 */
  if((m=/([0-9]{1,2})\s*月\s*底/.exec(text))){
    n=Number(m[1]);
    if(n>=1 && n<=12){
      var curM=new Date(t0+'T00:00:00').getMonth();
      return tail(mk(m, aiMonthEnd(t0, ((n-1)-curM+12)%12)));
    }
  }
  if((m=/(这个|本|下个|下)?\s*月\s*底/.exec(text)) && !/[0-9]/.test(text.charAt(m.index-1))){
    return tail(mk(m, aiMonthEnd(t0, (m[1]==='下'||m[1]==='下个')?1:0)));
  }

  if((m=/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]/.exec(text))){
    y=new Date(t0+'T00:00:00').getFullYear();
    var ds=y+'-'+aiPad(Number(m[1]))+'-'+aiPad(Number(m[2]));
    if(ds<t0) ds=(y+1)+'-'+aiPad(Number(m[1]))+'-'+aiPad(Number(m[2]));
    return tail(mk(m, ds));
  }
  if((m=/(下下|下|这|本)?\s*周([一二三四五六日天])/.exec(text))){
    var target=aiWeekdayMap(m[2]);
    if(target!==undefined){
      wd=new Date(t0+'T00:00:00').getDay();
      diff=(target-wd+7)%7;
      pre=m[1]||'';
      if(pre==='下') diff+=7;
      else if(pre==='下下') diff+=14;
      return tail(mk(m, addDays(t0,diff)));
    }
  }
  /* 只有「这周 / 本周 / 下周」没有星期几 → 落到该周周日 */
  if((m=/(下下|下|这|本)\s*周(?:内|以内|之内|前|之前|底|末)?/.exec(text))){
    wd=new Date(t0+'T00:00:00').getDay();
    var toSun=(7-wd)%7;
    pre=m[1]||'';
    diff = pre==='下' ? toSun+7 : pre==='下下' ? toSun+14 : toSun;
    return tail(mk(m, addDays(t0,diff)));
  }
  return null;
}

/* 把日期/时间后面紧邻的"前/之前/以内/底"一并吃掉，避免标题里残留一个字 */
function aiTailSpan(text, sp){
  if(!sp) return sp;
  var m=/^(之前|以前|之内|以内|前|后|底|末|整|钟|左右)/.exec(text.slice(sp.e));
  if(m) sp.e += m[0].length;
  return sp;
}

/* ---------- 时间（比原版严格得多，避免"第3点""3点档期"被误吃） ---------- */
var AI_TIME_TAIL_BAD=/^(要点|要求|意见|说明|问题|建议|内容|条款|理由|原因|事项|任务|细节|档期|以后|之前|以为|重点|难点|节点|观点|疑点)/;
function aiFindTime(text){
  var m, h, mm, ap;

  /* A. 带时段前缀：下午三点 / 晚上8:30 / 中午12点 */
  m=/(上午|早上|早晨|凌晨|中午|下午|傍晚|晚上|夜里)\s*(\d{1,2}|[一二两三四五六七八九十]{1,3})\s*(?:点|时|:|：)\s*(\d{1,2}|[一二两三四五六七八九十]{1,3})?\s*(半|整)?/.exec(text);
  if(m){
    h=aiCnNum(m[2]);
    if(h!==null && h<=23){
      mm = m[4]==='半' ? 30 : (m[3] ? aiCnNum(m[3]) : 0);
      if(mm===null) mm=0;
      ap=m[1];
      if((ap==='下午'||ap==='傍晚'||ap==='晚上'||ap==='夜里') && h<12) h+=12;
      if(ap==='中午' && h<12) h+=12;
      if(ap==='凌晨' && h===12) h=0;
      if(h>23) h=23;
      return aiTailSpan(text, { time:aiPad(h)+':'+aiPad(mm), hit:m[0], s:m.index, e:m.index+m[0].length });
    }
  }

  /* B. 带冒号：8:30 / 8：30 */
  m=/(\d{1,2})\s*[:：]\s*(\d{2})/.exec(text);
  if(m){
    var h1=Number(m[1]), m1=Number(m[2]);
    if(h1<=23 && m1<=59) return aiTailSpan(text, { time:aiPad(h1)+':'+aiPad(m1), hit:m[0], s:m.index, e:m.index+m[0].length });
  }

  /* C. 裸「N点」：排除"第N点""以上N点"，且后面不能跟非时间词 */
  var re=/(\d{1,2}|[一二两三四五六七八九十]{1,3})\s*(?:点|时)\s*(半|整)?/g, r2;
  while((r2=re.exec(text))){
    var before=text.slice(Math.max(0,r2.index-8), r2.index);
    var after=text.slice(r2.index+r2[0].length, r2.index+r2[0].length+2);
    if(/(第|以上|以下|这|那|前|后|哪|几)\s*$/.test(before)) continue;
    if(after && AI_TIME_TAIL_BAD.test(after)) continue;
    var hh=aiCnNum(r2[1]);
    if(hh===null || hh>23) continue;
    var mm2 = r2[2]==='半' ? 30 : 0;
    return aiTailSpan(text, { time:aiPad(hh)+':'+aiPad(mm2), hit:r2[0], s:r2.index, e:r2.index+r2[0].length });
  }
  return null;
}

/* ---------- 优先级（hit 返回真实命中文本，修掉原来硬编码"紧急"导致 P0 残留） ---------- */
function aiFindPrio(text){
  var m;
  if((m=/(不重要|不着急|不紧急|不急|有空|随便|低优)/.exec(text))) return { prio:'P2', hit:m[0], s:m.index, e:m.index+m[0].length };
  if((m=/(P0|p0|紧急|加急|急件|特急|马上|立刻|赶紧|很急|特别急|火急)/i.exec(text))) return { prio:'P0', hit:m[0], s:m.index, e:m.index+m[0].length };
  if((m=/(P1|p1|重要|优先|高优|重点跟进)/i.exec(text))) return { prio:'P1', hit:m[0], s:m.index, e:m.index+m[0].length };
  if((m=/(P2|p2|一般)/i.exec(text))) return { prio:'P2', hit:m[0], s:m.index, e:m.index+m[0].length };
  return null;
}

/* 收集句中所有优先级词位置：主词可能是"有空"，但"P2"也必须一起清掉 */
function aiPrioSpans(text){
  var re=/(P0|P1|P2|紧急|加急|急件|特急|马上|立刻|赶紧|很急|特别急|不重要|不着急|不紧急|不急|有空|随便|低优|重要|优先|高优)/gi;
  var out=[], m;
  while((m=re.exec(text))) out.push({ s:m.index, e:m.index+m[0].length });
  return out;
}

/* ---------- 项目 / 线路（带位置，供区间删除） ---------- */
function aiFindProj(text){
  var best=null, len=0, pos=-1;
  S.projects.forEach(function(p){
    var n=String(p.name||'');
    if(!n) return;
    var keys=[n], shortN=n.split(/[·\-—\s（(]+/)[0];
    if(shortN && shortN!==n && shortN.length>=2) keys.push(shortN);
    keys.forEach(function(k){
      if(!k || k.length<2) return;
      var idx=text.indexOf(k);
      if(idx>=0 && k.length>len){ best=p; len=k.length; pos=idx; }
    });
  });
  return best ? { proj:best, hit:text.slice(pos,pos+len), s:pos, e:pos+len } : null;
}
function aiFindTrack(p, text){
  if(!p) return null;
  var best=null, len=0, pos=-1;
  tracksOf(p).forEach(function(t){
    var n=String(t.name||'');
    if(n && n.length>=2){
      var idx=text.indexOf(n);
      if(idx>=0 && n.length>len){ best=t; len=n.length; pos=idx; }
    }
  });
  return best ? { track:best, hit:text.slice(pos,pos+len), s:pos, e:pos+len } : null;
}

/* ---------- 相似度：找已有待办（提高阈值，避免"完成报告初稿"误标别的任务） ---------- */
function aiLCS(a,b){
  a=String(a); b=String(b);
  if(!a||!b) return 0;
  var best=0, prev=new Array(b.length+1);
  for(var k=0;k<=b.length;k++) prev[k]=0;
  for(var i=1;i<=a.length;i++){
    var cur=new Array(b.length+1); cur[0]=0;
    for(var j=1;j<=b.length;j++){
      cur[j]=(a[i-1]===b[j-1]) ? (prev[j-1]||0)+1 : 0;
      if(cur[j]>best) best=cur[j];
    }
    prev=cur;
  }
  return best;
}
function aiFindTask(text, pool){
  var best=null, sc=0, ratio=0;
  pool.forEach(function(t){
    var title=String(t.title||'');
    if(title.length<2) return;
    var v=aiLCS(text, title);
    var r=v/title.length;
    if(v>=3 && r>=0.5 && (v>sc || (v===sc && r>ratio))){ sc=v; ratio=r; best=t; }
  });
  return best;
}

/* ---------- 区间删除：把已识别的日期/时间/优先级/项目从原文挖掉 ---------- */
function aiStamp(text, spans){
  var arr=spans.filter(Boolean).sort(function(a,b){ return a.s-b.s; });
  var out='', cur=0;
  arr.forEach(function(sp){
    if(sp.s<cur) return;
    out+=text.slice(cur, sp.s)+' ';
    cur=Math.max(cur, sp.e);
  });
  out+=text.slice(cur);
  return out;
}

/* ---------- 标题清洗 ---------- */
function aiCleanTitle(text){
  var s=' '+String(text||'')+' ';
  s=s.replace(/[·\-—–|｜\/\\]/g,' ');
  s=s.replace(/[，,。.！!？?、；;：:…~～"'\u201c\u201d\u2018\u2019()（）\[\]【】<>《》]/g,' ');
  s=s.replace(/\s+/g,' ').trim();

  var PRE=[
    /^(帮我|帮我个忙|帮个忙|帮忙|请|麻烦你|麻烦|给我|替我|劳驾)\s*/,
    /^(提醒我一下|提醒我|提醒一下|提醒|记得|别忘记|别忘了|不要忘了)\s*/,
    /^(新建一个?待办|添加一个?待办|新建一个?任务|添加一个?任务|新建一个?事项)\s*/,
    /^(待办|任务|事项)\s*/,
    /^(新建|添加|新增|创建|增加|记录一下|记录|记一下|安排|建一个|加个|加一个|加一条|加)\s*/,
    /^(把)\s*/
  ];
  for(var i=0;i<4;i++){
    var before=s;
    PRE.forEach(function(re){ s=s.replace(re,''); });
    s=s.replace(/\s+/g,' ').trim();
    if(before===s) break;
  }
  s=s.replace(/^(的|了|和|与|及)\s*/,'');
  s=s.replace(/\s*(待办|任务|事项|这件事|一下|吧|啊|哦|呢)\s*$/,'');
  return s.replace(/\s+/g,' ').trim();
}

/* ---------- 单段解析 ---------- */
function aiParseOne(src, skipQuery){
  var text=aiNorm(src);
  if(!text) return { kind:'none', msg:'先说一句话' };

  /* 1) 查询：必须短句 + 查询词开头，且不含明确动作 */
  if(!skipQuery){
    var qHead=/^(查一下|查查|查下|看看|看下|今天有什么|今天有哪些|有什么|有哪些|还有什么|多少条|进度如何|还差什么|今天要做什么)/;
    if(qHead.test(text) && text.length<=18 && !/(完成|改到|推迟|删除|新建|添加|加个|加一个)/.test(text)){
      var od=overdue(), td=dueToday();
      var msg='逾期 <b>'+od.length+'</b> 条，今天到期 <b>'+td.length+'</b> 条';
      if(od.length) msg+='<br>'+od.slice(0,5).map(function(t){ return '· '+esc(t.title); }).join('<br>');
      return { kind:'query', msg:msg };
    }
  }

  /* 2) 命令式判定：只有句首动词才算，正文里出现"完成/删除"不影响新建 */
  var head=text.replace(/^\s*(帮我|请|麻烦|给我|替我|劳驾)\s*/,'');
  var isDone=/^(完成|做完|搞完|搞定|办完|干完|标记完成|标记为完成)|^把[^，,。]{0,30}(完成|做完|标记完成|标记为完成)/.test(head);
  var isMove=/^(改到|改成|推迟到|推迟|延后|延期|顺延|挪到|调到|改期|改时间)|^把[^，,。]{0,30}(改到|改成|推迟|延后|顺延|挪到)/.test(head);
  var isDel =/^(删除|删掉|去掉|移除)|^把[^，,。]{0,30}(删除|删掉|去掉|移除)/.test(head);

  if(isDone||isMove||isDel){
    var pool=S.tasks.filter(function(t){ return isDone ? !t.done : true; });
    var hitT=aiFindTask(text, pool);
    if(hitT){
      if(isDone) return { kind:'done', taskId:hitT.id, title:hitT.title, label:'标记完成', prio:hitT.prio, due:hitT.due };
      if(isDel)  return { kind:'del',  taskId:hitT.id, title:hitT.title, label:'删除待办', prio:hitT.prio, due:hitT.due };
      var dm=aiFindDate(text), dmt=aiFindTime(text);
      return { kind:'move', taskId:hitT.id, title:hitT.title, label:'修改日期',
               due:dm?dm.date:'', time:dmt?dmt.time:'', oldDue:hitT.due||'', prio:hitT.prio };
    }
    /* 找不到目标 → 不死路，给出「仍然新建」出口 */
    var fb=aiCleanTitle(text);
    return { kind:'none',
      msg:(isDel?'没找到要删除的待办':isMove?'没找到要改期的待办':'没找到要标记完成的待办'),
      hint:'原句：'+text,
      fallbackTitle: fb || text };
  }

  /* 3) 新建：先提取锚点，再区间删除，最后清洗标题 */
  var d=aiFindDate(text), tm=aiFindTime(text), pr=aiFindPrio(text), pj=aiFindProj(text);
  var tr=pj ? aiFindTrack(pj.proj, text) : null;
  var spans=[d, tm, pr,
    pj ? { s:pj.s, e:pj.e } : null,
    tr ? { s:tr.s, e:tr.e } : null];
  if(pr) spans=spans.concat(aiPrioSpans(text));
  var rest=aiStamp(text, spans);
  var title=aiCleanTitle(rest);
  if(!title) return { kind:'none', msg:'没识别出具体要做的事，换个说法试试', hint:'试试：明天下午三点交资料' };
  if(title.length>90) title=title.slice(0,90);

  return { kind:'add', label:'新建待办', title:title,
    due: d ? d.date : todayStr(), dateGuess: !d,
    time: tm ? tm.time : '',
    prio: pr ? pr.prio : 'P1',
    pid: pj ? pj.proj.id : '', tid: tr ? tr.track.id : '',
    pname: pj ? pj.proj.name : '', tname: tr ? tr.track.name : '',
    hitPrio: pr ? pr.hit : '' };
}

/* ---------- 多句拆分：一句话里的多条待办 ---------- */
function aiParseMulti(src){
  var norm=aiNorm(src);
  if(!norm) return null;
  var parts=norm.split(/[，,;；。\n]+/).map(function(x){ return x.trim(); })
                .filter(function(x){ return x.length>0; });
  if(parts.length<2 || parts.length>5) return null;
  /* 每段都要足够长、且带锚点，才认为是"多条"，否则整句当一条处理 */
  var allOk=true;
  parts.forEach(function(p){
    if(p.length<4) allOk=false;
    else if(!(aiFindDate(p)||aiFindPrio(p)||aiFindTime(p)||aiFindProj(p))) allOk=false;
  });
  if(!allOk) return null;
  var rs=[];
  parts.forEach(function(p){
    var r=aiParseOne(p, true);
    if(r.kind==='add') { r.kind='add'; rs.push(r); }
  });
  return rs.length>=2 ? rs : null;
}

function aiParse(src, force){
  var norm=aiNorm(src);
  if(!norm) return { kind:'none', msg:'先说一句话' };
  if(!force){
    var batch=aiParseMulti(src);
    if(batch) return { kind:'batch', items:batch, label:'新建 '+batch.length+' 条待办' };
  }
  return aiParseOne(src, force);
}

/* ---------- 面板 ---------- */
function openAiSheet(){
  openModal(
    '<h3>AI 记录</h3>'+
    '<p>说一句话就行：建待办、改日期、标完成。识别在本地完成，不联网。识别完可以先改再存。</p>'+
    '<form id="aiForm"><div class="form">'+
      '<div class="f"><textarea name="cmd" id="aiInput" rows="3" placeholder="例如：&#10;三天后提醒我交资料&#10;明天下午三点提醒我交资料，一周后回款（一句多条）&#10;把复检模具改到后天"></textarea></div>'+
    '</div></form>'+
    '<div class="ai-bar">'+
      '<button class="btn ai-mic" id="aiMic" type="button">'+ic('mic')+'<span>按住说话</span></button>'+
      '<button class="btn btn-primary" id="aiGo" type="button">'+ic('sparkle')+'识别</button>'+
    '</div>'+
    '<div class="ai-tip">日期支持：今天 / 明天 / 后天 / <b>三天后</b> / 半个月后 / 一周后 / 下周三 / 5月20日 / 下月5号 / 月底<br>时间：下午三点 / 8:30 · 优先级：P0 紧急 · 也认项目简称 · 一句话可以多条</div>'+
    '<div id="aiOut" class="ai-out"></div>', false);

  var inp=$('aiInput');
  var go=$('aiGo');
  if(go) go.addEventListener('click', function(){
    var v=inp?inp.value:'';
    if(!v.trim()){ toast('先说一句'); return; }
    aiPreview(v);
  });
  if(inp && !('ontouchstart' in window)){ try{ inp.focus(); }catch(e){} }
  aiBindMic();
}
/* ---------- 语音：能用网页识别就用，不能用就降级到输入法麦克风 ----------
   华为/荣耀/小米/UC/QQ/微信 等国内内核没有可用的语音识别后端，
   webkitSpeechRecognition 即使存在也会立刻 network/service-not-allowed 失败，
   所以先按 UA 判死，避免"按下去没反应"，直接引导用户用键盘上的麦克风键。 */
var _aiRec=null, _aiMicTimer=null, _aiMicMode='sr', _aiDownAt=0;

function aiMicSrOk(){
  if(!(window.SpeechRecognition||window.webkitSpeechRecognition)) return false;
  try{ if(localStorage.getItem('wb_ai_mic_v1')==='ime') return false; }catch(e){}
  var ua=String(navigator.userAgent||'');
  if(/HuaweiBrowser|HeyTapBrowser|HonorBrowser|ArkWeb|MiuiBrowser|Quark|UCBrowser|QQBrowser|MicroMessenger|baidubrowser|VivoBrowser|OppoBrowser|SamsungBrowser/i.test(ua)) return false;
  if(!/Chrome|CriOS|Edg|Firefox|Safari/i.test(ua)) return false;
  return true;
}
function aiMicTip(show){
  var exist=document.getElementById('aiMicTip');
  if(!show){ if(exist&&exist.parentNode) exist.parentNode.removeChild(exist); return; }
  if(exist) return;
  var host=$('aiOut'); if(!host||!host.parentNode) return;
  var el=document.createElement('div');
  el.id='aiMicTip';
  el.className='ai-mic-tip';
  el.innerHTML='这个浏览器不支持网页录音。点<b>键盘上的麦克风键</b>说话，说完点下面「识别」。';
  host.parentNode.insertBefore(el, host);
}
function aiMicFallback(reason){
  _aiMicMode='ime';
  try{ localStorage.setItem('wb_ai_mic_v1','ime'); }catch(e){}
  aiMicState(false);
  var mic=$('aiMic');
  if(mic){
    mic.classList.add('ime');
    var sp=mic.querySelector('span'); if(sp) sp.textContent='语音输入';
  }
  aiMicTip(true);
  var inp=$('aiInput');
  if(inp){ try{ inp.focus(); }catch(e){} }
  if(reason) toast(reason);
}

function aiBindMic(){
  var mic=$('aiMic'); if(!mic) return;
  _aiMicMode = aiMicSrOk() ? 'sr' : 'ime';
  if(_aiMicMode==='ime'){
    mic.classList.add('ime');
    var sp0=mic.querySelector('span'); if(sp0) sp0.textContent='语音输入';
    aiMicTip(true);
  }

  /* ime 模式：按钮不录音，只负责把光标送进输入框，让用户用键盘麦克风 */
  mic.addEventListener('click', function(e){
    if(_aiMicMode!=='ime') return;
    e.preventDefault();
    var inp=$('aiInput');
    if(inp){
      try{ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }catch(err){}
      try{ inp.scrollIntoView({ block:'center', behavior:'smooth' }); }catch(err2){}
    }
    toast('点键盘上的麦克风键说话');
  });

  mic.addEventListener('pointerdown', function(e){
    if(_aiMicMode==='ime') return;
    e.preventDefault();
    /* 已在录音 → 这一下是"点一下结束" */
    if(_aiRec){ aiMicState(false); return; }
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    var inp=$('aiInput'), base=inp?inp.value:'';
    var rec;
    try{ rec=new SR(); }catch(err){ aiMicFallback('语音启动失败，改用键盘麦克风'); return; }
    _aiDownAt=Date.now();
    try{ mic.setPointerCapture(e.pointerId); }catch(err2){}
    rec.lang='zh-CN';
    rec.interimResults=true;
    rec.continuous=false;
    rec.maxAlternatives=1;
    var started=false;
    rec.onstart=function(){ started=true; if(_aiMicTimer){ clearTimeout(_aiMicTimer); _aiMicTimer=null; } };
    rec.onresult=function(ev){
      var txt='';
      for(var i=ev.resultIndex;i<ev.results.length;i++) txt+=ev.results[i][0].transcript;
      if(inp) inp.value=(base?base+' ':'')+txt;
    };
    rec.onerror=function(ev){
      var er=ev&&ev.error;
      if(er==='aborted'){ aiMicState(false); return; }
      if(er==='no-speech'){ aiMicState(false); toast('没听到声音，再说一次'); return; }
      if(er==='not-allowed'||er==='service-not-allowed'){ aiMicFallback('麦克风被拒绝，请在浏览器设置里允许'); return; }
      aiMicFallback('语音服务不可用，改用键盘麦克风');
    };
    rec.onend=function(){ aiMicState(false); };
    _aiRec=rec;
    try{ rec.start(); }catch(err3){ _aiRec=null; aiMicFallback('语音启动失败，改用键盘麦克风'); return; }
    aiMicState(true);
    /* 3 秒还没真正开始 → 判定这个内核没有语音后端 */
    _aiMicTimer=setTimeout(function(){
      if(!started && _aiRec===rec) aiMicFallback('语音服务没响应，改用键盘麦克风');
    }, 3000);
  });

  /* 长按松手结束；轻点则保持录音，再点一下结束 */
  mic.addEventListener('pointerup', function(){
    if(_aiMicMode!=='sr' || !_aiRec) return;
    if(Date.now()-_aiDownAt >= 600) aiMicState(false);
  });
  mic.addEventListener('pointercancel', function(){
    if(_aiMicMode==='sr' && _aiRec) aiMicState(false);
  });
  mic.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

function aiMicState(on){
  var mic=$('aiMic');
  if(on){
    if(mic) mic.classList.add('listening');
    var sp=mic&&mic.querySelector('span'); if(sp) sp.textContent='松开结束';
    return;
  }
  if(mic) mic.classList.remove('listening');
  var sp2=mic&&mic.querySelector('span');
  if(sp2) sp2.textContent = (_aiMicMode==='ime') ? '语音输入' : '按住说话';
  if(_aiMicTimer){ clearTimeout(_aiMicTimer); _aiMicTimer=null; }
  var rec=_aiRec;
  _aiRec=null;
  if(rec){
    try{ rec.onresult=null; rec.onerror=null; rec.onend=null; rec.onstart=null; rec.stop(); }catch(e){}
  }
}
function aiRenderItems(items){
  var h='';
  if(items.length>1) h+='<div class="ai-hint">识别到 '+items.length+' 条，可逐条修改后再一起添加</div>';
  items.forEach(function(it, i){
    h+='<div class="ai-item" data-idx="'+i+'">'+
        '<div class="ai-row"><span>内容</span><input class="ai-in" data-k="title" type="text" value="'+esc(it.title||'')+'" maxlength="120" placeholder="要做的事"></div>'+
        '<div class="ai-row"><span>日期</span><input class="ai-in" data-k="due" type="date" value="'+esc(it.due||todayStr())+'">'+
          (it.dateGuess?'<em class="ai-flag">默认今天</em>':'')+'</div>'+
        '<div class="ai-row"><span>时间</span><input class="ai-in" data-k="time" type="time" value="'+esc(it.time||'')+'"></div>'+
        '<div class="ai-row"><span>优先级</span><select class="ai-in" data-k="prio">'+
          ['P0','P1','P2'].map(function(k){
            return '<option value="'+k+'"'+((it.prio||'P1')===k?' selected':'')+'>'+esc(prioOf(k).label)+'</option>';
          }).join('')+'</select></div>'+
        (it.pname?'<div class="ai-row"><span>项目</span><b>'+esc(it.pname+(it.tname?' / '+it.tname:''))+'</b></div>':'')+
      '</div>';
  });
  h+='<div class="ai-acts"><button class="btn" data-act="aiCancel" type="button">取消</button>'+
     '<button class="btn btn-primary" data-act="aiApply" type="button">'+ic('check')+(items.length>1?'全部添加':'确定添加')+'</button></div>';
  return h;
}

function aiPreview(text, force){
  var r=aiParse(text, force);
  var out=$('aiOut'); if(!out) return;
  var raw=String(text||'');

  if(r.kind==='none'){
    /* 命令没找到目标 → 保留"仍然新建"出口，不让人卡死 */
    if(r.fallbackTitle){
      _aiPending={ kind:'add', items:[{ kind:'add', title:r.fallbackTitle, due:todayStr(), dateGuess:true, time:'', prio:'P1', pid:'', tid:'' }] };
      out.innerHTML='<div class="ai-msg">'+esc(r.msg)+
        '<div class="ai-hint">也可以直接当作一条新待办</div>'+
        '<div class="ai-fb"><button class="btn btn-sm btn-primary" data-act="aiFallback" type="button">'+ic('plus')+'新建为待办</button></div></div>';
    }else{
      _aiPending=null;
      out.innerHTML='<div class="ai-msg">'+esc(r.msg||'没听懂')+
        (r.hint?'<div class="ai-hint">'+esc(r.hint)+'</div>':'')+'</div>';
    }
    return;
  }

  if(r.kind==='query'){
    _aiPending=null;
    out.innerHTML='<div class="ai-msg">'+r.msg+
      '<div class="ai-hint">这句被当成查询了。如果本来是要建待办，点下面：</div>'+
      '<div class="ai-fb"><button class="btn btn-sm" data-act="aiAsAdd" data-t="'+esc(raw)+'" type="button">'+ic('plus')+'其实是要新建待办</button></div></div>';
    return;
  }

  if(r.kind==='done'||r.kind==='del'||r.kind==='move'){
    _aiPending={ kind:r.kind, items:[{ kind:r.kind, taskId:r.taskId, title:r.title, due:r.due, time:r.time, prio:r.prio, label:r.label, oldDue:r.oldDue }] };
    var rows=[['动作', r.label], ['目标', r.title]];
    if(r.kind==='move') rows.push(['原日期', r.oldDue||'未设置']);
    if(r.kind==='move') rows.push(['新日期', (r.due||'未变')+(r.time?' '+r.time:'')]);
    out.innerHTML='<div class="ai-card">'+rows.map(function(x){
      return '<div class="ai-row"><span>'+x[0]+'</span><b>'+esc(x[1])+'</b></div>';
    }).join('')+'</div>'+
    '<div class="ai-acts"><button class="btn" data-act="aiCancel" type="button">取消</button>'+
    '<button class="btn btn-primary" data-act="aiApply" type="button">'+ic('check')+'确定</button></div>';
    return;
  }

  /* add / batch */
  var items = (r.kind==='batch') ? r.items : [r];
  items.forEach(function(it){ it.kind='add'; });
  _aiPending={ kind:'add', items:items };
  out.innerHTML=aiRenderItems(items);
}

function aiApply(){
  var pend=_aiPending; if(!pend || !pend.items) return;
  var nodes=document.querySelectorAll('.ai-item');
  var ok=0, miss=0, firstTitle='', batch=pend.items.length>1;

  pend.items.forEach(function(it, i){
    var node=nodes[i];
    function val(k, def){
      var el=node ? node.querySelector('[data-k="'+k+'"]') : null;
      return el ? String(el.value||'').trim() : (def||'');
    }
    if(it.kind==='done'){
      var t=findTask(it.taskId);
      if(!t){ miss++; return; }
      t.done=true; t.doneAt=todayStr(); ok++; firstTitle=t.title; return;
    }
    if(it.kind==='move'){
      var t2=findTask(it.taskId);
      if(!t2){ miss++; return; }
      var nd=val('due', it.due), nt=val('time', it.time);
      if(nd) t2.due=nd;
      if(nt) t2.time=nt;
      ok++; firstTitle=t2.title; return;
    }
    if(it.kind==='del'){
      var t3=findTask(it.taskId);
      if(!t3){ miss++; return; }
      S.tasks=S.tasks.filter(function(x){ return x.id!==it.taskId; });
      ok++; firstTitle=t3.title; return;
    }
    /* 新建 */
    var title=val('title', it.title);
    if(!title){ miss++; return; }
    S.tasks.push({ id:uid(), title:title, prio:val('prio', it.prio)||'P1',
      due:val('due', it.due)||todayStr(), time:val('time', it.time)||'',
      pid:it.pid||'', tid:it.tid||'', done:false, createdAt:todayStr(), doneAt:null });
    ok++; if(!firstTitle) firstTitle=title;
  });

  _aiPending=null;
  if(!ok){ toast('没有可保存的内容'); return; }
  var msg;
  if(batch) msg='已添加 '+ok+' 条待办';
  else if(pend.kind==='done') msg='已完成：'+firstTitle;
  else if(pend.kind==='del') msg='已删除：'+firstTitle;
  else if(pend.kind==='move'){
    var dn=nodes[0]?nodes[0].querySelector('[data-k="due"]'):null;
    msg='已改到 '+(dn?dn.value:'');
  }else msg='已添加：'+firstTitle;
  closeModal();
  save();
  renderAll();
  toast(msg + (miss?('，'+miss+' 条没找到目标'):''));
}

function boot(){
  load();
  bindEvents();
  renderAll();
  try{ initSync(); }catch(e){ setSyncState('off','本地模式'); }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
