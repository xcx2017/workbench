function byDateAsc(a,b){ return (a.date||'')<(b.date||'')?-1:((a.date||'')>(b.date||'')?1:0); }
function rateOf(s){
  if(!s) return null;
  var raw=s.score;
  if(raw==='' || raw===null || raw===undefined) return null;
  var f=Number(s.full)||0, v=Number(raw);
  if(!f || !isFinite(v)) return null;
  return Math.round(v/f*1000)/10;
}
function rateLabel(r){ if(r===null||r===undefined) return '—'; if(r>=90) return '优秀'; if(r>=80) return '良好'; if(r>=60) return '合格'; return '待提高'; }
function rateCls(r){ if(r===null||r===undefined) return 'gray'; if(r>=90) return 'teal'; if(r>=80) return 'cyan'; if(r>=60) return 'amber'; return 'red'; }
function scoreList(subj, range){
  var from=rangeFrom(range);
  return (S.study.scores||[]).filter(function(s){
    if(subj && subj!=='all' && s.subj!==subj) return false;
    if(from && (s.date||'')<from) return false;
    return true;
  }).sort(byDateAsc);
}
function rangeFrom(k){
  var t=todayStr();
  if(k==='m1') return addDays(t,-30);
  if(k==='m3') return addDays(t,-92);
  if(k==='term'){
    var d=parseD(t), m=d.getMonth()+1, y=d.getFullYear();
    if(m>=9) return y+'-09-01';
    if(m>=2) return y+'-02-01';
    return (y-1)+'-09-01';
  }
  return '';
}

/* ---------- 图片：IndexedDB ---------- */
var IMG_DB='xcx_study_img_v1', _idb=null, _objUrls={};
function idbOpen(){
  return new Promise(function(res,rej){
    if(!window.indexedDB) return rej(new Error('no-idb'));
    if(_idb) return res(_idb);
    var r=indexedDB.open(IMG_DB,1);
    r.onupgradeneeded=function(){ var db=r.result; if(!db.objectStoreNames.contains('pages')) db.createObjectStore('pages'); };
    r.onsuccess=function(){ _idb=r.result; res(_idb); };
    r.onerror=function(){ rej(r.error||new Error('idb-open')); };
  });
}
function idbPut(id, blob){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction('pages','readwrite');
      tx.objectStore('pages').put(blob,id);
      tx.oncomplete=function(){ res(true); };
      tx.onerror=function(){ rej(tx.error); };
    });
  });
}
function idbGet(id){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction('pages','readonly');
      var rq=tx.objectStore('pages').get(id);
      rq.onsuccess=function(){ res(rq.result||null); };
      rq.onerror=function(){ rej(rq.error); };
    });
  });
}
function idbDel(id){
  return idbOpen().then(function(db){
    return new Promise(function(res){
      try{
        var tx=db.transaction('pages','readwrite');
        tx.objectStore('pages').delete(id);
        tx.oncomplete=function(){ res(true); };
        tx.onerror=function(){ res(false); };
      }catch(e){ res(false); }
    });
  });
}
function imgUrl(id, cb){
  if(!id) return cb('');
  if(_objUrls[id]) return cb(_objUrls[id]);
  idbGet(id).then(function(b){
    if(!b) return cb('');
    var u=URL.createObjectURL(b);
    _objUrls[id]=u;
    cb(u);
  }).catch(function(){ cb(''); });
}
function hydrateImgs(){
  var nodes=document.querySelectorAll('[data-page-img]');
  for(var i=0;i<nodes.length;i++){
    (function(n){
      var id=n.getAttribute('data-page-img');
      if(!id || n.getAttribute('data-loaded')==='1') return;
      n.setAttribute('data-loaded','1');
      imgUrl(id, function(u){
        if(u){ n.src=u; }
        else if(!n.getAttribute('src')){
          /* 原图不在本机：能显示缩略图就显示，别涂黑 */
          n.classList.add('noimg');
          if(n.parentNode && n.parentNode.classList) n.parentNode.classList.add('noimg');
        }
      });
    })(nodes[i]);
  }
}

/* ---------- 试卷缩略图：随云同步的轻量副本 ----------
   一页原图压缩后还有几百 KB，全塞进快照会把 Gist 撑爆、同步也慢。
   这里只同步「首页缩略图」，跨设备能看到有哪些卷子、长什么样；
   要原图就用「试卷包」整体搬迁。 */
var _thumbBusy=false, _thumbTried={}, _thumbTimer=null, THUMB_MAX=60;
function blobToDataURL(b){
  if(!b) return Promise.resolve('');
  return new Promise(function(res){
    var fr=new FileReader();
    fr.onload=function(){ res(String(fr.result||'')); };
    fr.onerror=function(){ res(''); };
    fr.readAsDataURL(b);
  });
}
function dataURLtoBlob(u){
  try{
    var m=/^data:([^;,]*);base64,/i.exec(String(u||''));
    if(!m) return null;
    var bin=atob(u.slice(m[0].length));
    var arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return new Blob([arr], { type:m[1]||'image/jpeg' });
  }catch(e){ return null; }
}
function readTextFile(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ res(String(fr.result||'')); };
    fr.onerror=function(){ rej(fr.error||new Error('read fail')); };
    fr.readAsText(file);
  });
}
function ensureThumbs(limit){
  if(_thumbBusy) return;
  /* 只同步最近 60 份的缩略图：再老的留本机，快照体积不至于失控 */
  var need=(S.study.papers||[]).slice()
    .sort(function(a,b){ return (b.date||'')<(a.date||'')?-1:1; })
    .filter(function(p){ return (p.pages||[]).length && !p.thumb && !_thumbTried[p.id]; })
    .slice(0, Math.max(0, THUMB_MAX - thumbStat().n));
  if(!need.length) return;
  _thumbBusy=true;
  var i=0, made=0, lim=Math.min(need.length, limit||need.length);
  function step(){
    if(i>=lim){
      _thumbBusy=false;
      if(made){ save(); if(S.ui.view==='papers') renderAll(); }
      return;
    }
    var p=need[i++];
    _thumbTried[p.id]=1;
    idbGet(p.pages[0]).then(function(b){
      if(!b) return null;
      return shrinkImage(b,320,0.55).then(blobToDataURL).then(function(d){
        if(d){ p.thumb=d; made++; }
      });
    }).catch(function(){}).then(step);
  }
  step();
}
function scheduleThumbs(){
  if(_thumbTimer) return;
  _thumbTimer=setTimeout(function(){ _thumbTimer=null; ensureThumbs(4); }, 900);
}
function thumbStat(){
  var n=0, b=0;
  (S.study.papers||[]).forEach(function(p){ if(p.thumb){ n++; b+=p.thumb.length; } });
  return { n:n, kb:Math.round(b/1024) };
}

/* 图片解码（iPhone 的 EXIF 方向由 createImageBitmap 自动校正） */
function decodeImg(file){
  if(window.createImageBitmap){
    return createImageBitmap(file, { imageOrientation:'from-image' }).catch(function(){ return decodeImgEl(file); });
  }
  return decodeImgEl(file);
}
function decodeImgEl(file){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){ URL.revokeObjectURL(url); res(img); };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('decode fail')); };
    img.src=url;
  });
}
/* 压到长边 maxSide，JPEG 质量 q；试卷文字要清楚，别压太狠 */
function shrinkImage(file, maxSide, q){
  return decodeImg(file).then(function(img){
    var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
    var sc=Math.min(1, (maxSide||2000)/Math.max(w,h));
    var cw=Math.max(1, Math.round(w*sc)), ch=Math.max(1, Math.round(h*sc));
    var cv=document.createElement('canvas');
    cv.width=cw; cv.height=ch;
    var g=cv.getContext('2d');
    g.fillStyle='#fff'; g.fillRect(0,0,cw,ch);
    g.drawImage(img,0,0,cw,ch);
    return new Promise(function(res,rej){
      cv.toBlob(function(b){ b?res(b):rej(new Error('toBlob fail')); }, 'image/jpeg', q||0.78);
    });
  });
}

/* ---------- PDF（纯前端生成，直接把 JPEG 塞进 PDF，不重新编码） ---------- */
function jpegDim(b){
  var i=2;
  while(i<b.length-9){
    if(b[i]!==0xFF){ i++; continue; }
    var m=b[i+1];
    if(m===0xD8 || m===0xD9 || (m>=0xD0 && m<=0xD7)){ i+=2; continue; }
    if(m===0x01 || (m>=0xDA && m<=0xDA)) break;
    var len=(b[i+2]<<8)|b[i+3];
    if(m>=0xC0 && m<=0xC3) return { h:(b[i+5]<<8)|b[i+6], w:(b[i+7]<<8)|b[i+8], nf:b[i+9]||3 };
    if(len<2) break;
    i+=2+len;
  }
  return null;
}
function buildPdf(items, footer){
  var enc=new TextEncoder();
  var parts=[], total=0, offs={};
  function put(x){
    var b=(typeof x==='string')?enc.encode(x):x;
    parts.push(b); total+=b.length; return b.length;
  }
  function obj(n, head, stream){
    offs[n]=total;
    put(n+' 0 obj\n');
    put(head);
    if(stream){
      put('\nstream\n');
      put(stream);
      put('\nendstream');
    }
    put('\nendobj\n');
  }
  var PW=595.28, PH=841.89, M=20;
  var N=items.length;

  put('%PDF-1.4\n');
  put(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));

  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  var kids=[];
  for(var i=0;i<N;i++) kids.push((4+i*3)+' 0 R');
  obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+N+' >>');
  obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');

  for(var k=0;k<N;k++){
    var it=items[k];
    var pid=4+k*3, iid=5+k*3, cid=6+k*3;
    obj(pid,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im0 '+iid+' 0 R >> /Font << /F1 3 0 R >> >> /Contents '+cid+' 0 R >>');

    var dim=jpegDim(it.bytes) || { w:it.w||1240, h:it.h||1754, nf:3 };
    var cs = dim.nf===1 ? '/DeviceGray' : (dim.nf===4 ? '/DeviceCMYK' : '/DeviceRGB');
    offs[iid]=total;
    put(iid+' 0 obj\n');
    put('<< /Type /XObject /Subtype /Image /Width '+dim.w+' /Height '+dim.h+
        ' /ColorSpace '+cs+' /BitsPerComponent 8 /Filter /DCTDecode /Length '+it.bytes.length+' >>\nstream\n');
    put(it.bytes);
    put('\nendstream\nendobj\n');

    var aw=PW-M*2, ah=PH-M*2;
    var sc=Math.min(aw/dim.w, ah/dim.h);
    var dw=dim.w*sc, dh=dim.h*sc;
    var x=(PW-dw)/2, y=(PH-dh)/2;
    var c='q\n'+dw.toFixed(2)+' 0 0 '+dh.toFixed(2)+' '+x.toFixed(2)+' '+y.toFixed(2)+' cm\n/Im0 Do\nQ\n';
    var label=(k+1)+' / '+N;
    c+='BT /F1 8 Tf 0.55 0.62 0.62 rg '+(PW/2-42).toFixed(2)+' 9 Td ('+label+') Tj ET';
    var cb=enc.encode(c);
    obj(cid,'<< /Length '+cb.length+' >>', cb);
  }

  var maxObj=3+N*3;
  var xref=total;
  var x='xref\n0 '+(maxObj+1)+'\n0000000000 65535 f \n';
  for(var o=1;o<=maxObj;o++){
    var off=(offs[o]||0).toString();
    while(off.length<10) off='0'+off;
    x+=off+' 00000 n \n';
  }
  put(x);
  put('trailer\n<< /Size '+(maxObj+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  return new Blob(parts, { type:'application/pdf' });
}

function dlBlob(blob, name){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.rel='noopener';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); if(a.parentNode) a.parentNode.removeChild(a); }, 1200);
}

/* 分隔页：canvas 画中文标题，转成 JPEG 当成一页 PDF */
function dividerPage(title, sub, meta, color){
  return new Promise(function(res){
    try{
      var W=1240, H=1754;
      var cv=document.createElement('canvas');
      cv.width=W; cv.height=H;
      var g=cv.getContext('2d');
      g.fillStyle='#ffffff'; g.fillRect(0,0,W,H);
      g.fillStyle=color || '#0d9488';
      g.fillRect(0,0,W,14); g.fillRect(0,H-14,W,14);
      g.textAlign='center';
      g.fillStyle=color || '#0d9488';
      g.font='600 44px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
      g.fillText(title||'', W/2, H/2-170);
      g.fillStyle='#0e2b29';
      g.font='700 86px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
      var lines=String(sub||'').split('\n');
      lines.slice(0,3).forEach(function(ln,i){ g.fillText(ln, W/2, H/2+((i-lines.length/2)*104)); });
      g.strokeStyle='#e2ebeb'; g.lineWidth=2;
      g.beginPath(); g.moveTo(W*0.22, H/2+150); g.lineTo(W*0.78, H/2+150); g.stroke();
      g.fillStyle='#8aa3a1';
      g.font='500 34px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
      String(meta||'').split('|').forEach(function(ln,i){ g.fillText(ln, W/2, H/2+216+i*54); });
      cv.toBlob(function(b){
        if(!b) return res(null);
        b.arrayBuffer().then(function(ab){ res(new Uint8Array(ab)); }).catch(function(){ res(null); });
      }, 'image/jpeg', 0.86);
    }catch(e){ res(null); }
  });
}

/* ---------- 图表 ---------- */
function tsOf(d){ try{ return parseD(d).getTime(); }catch(e){ return 0; } }
function mdShort(d){ if(!d) return ''; var x=parseD(d); return (x.getMonth()+1)+'/'+x.getDate(); }
function avgRate(arr){
  var v=arr.map(rateOf).filter(function(x){ return x!==null; });
  if(!v.length) return null;
  return Math.round(v.reduce(function(a,b){ return a+b; },0)/v.length*10)/10;
}
function svgScoreChart(list, opt){
  opt=opt||{};
  var W=720, H=opt.h||230, padL=32, padR=14, padT=16, padB=28;
  var iw=W-padL-padR, ih=H-padT-padB;
  if(!list.length){
    return '<div class="chart-empty">'+ic('chart')+'<span>还没有成绩记录，录一条就能看到曲线</span></div>';
  }
  var subs=(opt.subj && opt.subj!=='all') ? [opt.subj] : ['cn','ma','en'];
  var ds=list.map(function(s){ return s.date; }).filter(Boolean).sort();
  var tMin=tsOf(ds[0]), tMax=Math.max(tsOf(ds[ds.length-1]), tsOf(todayStr()));
  if(opt.from && tsOf(opt.from)<tMin) tMin=tsOf(opt.from);
  if(tMax-tMin < 86400000*4){ tMin-=86400000*2; tMax+=86400000*2; }
  var span=tMax-tMin || 1;
  function X(d){ return padL + (tsOf(d)-tMin)/span*iw; }
  function Y(r){ r=Math.max(0,Math.min(100,Number(r)||0)); return padT + (1-r/100)*ih; }

  var grid='';
  [0,25,50,75,100].forEach(function(v){
    var y=Y(v);
    grid+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="#eef4f4" stroke-width="1"/>';
    grid+='<text x="'+(padL-6)+'" y="'+(y+3.4).toFixed(1)+'" text-anchor="end" font-size="9" fill="#a9bebd">'+v+'</text>';
  });
  /* 及格线 60 / 优秀线 90 */
  grid+='<line x1="'+padL+'" y1="'+Y(60).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+Y(60).toFixed(1)+'" stroke="#f0c9c8" stroke-width="1.2" stroke-dasharray="4 4"/>';
  grid+='<line x1="'+padL+'" y1="'+Y(90).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+Y(90).toFixed(1)+'" stroke="#bfe3dd" stroke-width="1.2" stroke-dasharray="4 4"/>';

  var body='';
  subs.forEach(function(k){
    var sb=subjOf(k);
    var pts=list.filter(function(s){ return s.subj===k; });
    if(!pts.length) return;
    var d=pts.map(function(s,i){ return (i?'L':'M')+X(s.date).toFixed(1)+' '+Y(rateOf(s)).toFixed(1); }).join(' ');
    if(pts.length>1){
      body+='<path d="'+d+'" fill="none" stroke="'+sb.c+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity=".92"/>';
    }
    pts.forEach(function(s){
      var r=rateOf(s);
      body+='<circle cx="'+X(s.date).toFixed(1)+'" cy="'+Y(r).toFixed(1)+'" r="3.6" fill="#fff" stroke="'+sb.c+'" stroke-width="2">'+
        '<title>'+esc(sb.n+' · '+(s.name||'')+' · '+(s.date||'')+' · '+r+'%')+'</title></circle>';
    });
  });

  /* X 轴 3 个刻度 */
  var xl='';
  [0,0.5,1].forEach(function(p){
    var t=tMin+span*p, dt=new Date(t);
    xl+='<text x="'+(padL+iw*p).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(p===0?'start':p===1?'end':'middle')+'" font-size="9" fill="#a9bebd">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</text>';
  });

  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+grid+body+xl+'</svg>';
}

  }else{

      var qText = w.q || (wps.length ? '（题目见照片）' : (wfs.length ? '（题目见文件）' : '（未填题干）'));
      var media='';
      if(wps.length || wfs.length){
        media='<div class="wq-media">';
        if(wps.length){
          media+='<div class="wq-thumbs">'+wps.slice(0,4).map(function(pid,i){
            return '<button class="wq-p" data-act="wqViewPage" data-id="'+w.id+'" data-i="'+i+'" type="button" aria-label="看第 '+(i+1)+' 张照片">'+
              '<img data-page-img="'+esc(pid)+'" alt=""></button>';
          }).join('')+(wps.length>4?('<button class="wq-more" data-act="wqViewPage" data-id="'+w.id+'" data-i="4" type="button" title="接着看后面的照片">+'+(wps.length-4)+'</button>'):'')+'</div>';
        }
        if(wfs.length){
          wfs.slice(0,2).forEach(function(wf){
            media+='<button class="wq-file-c" data-act="wqViewFile" data-id="'+w.id+'" data-fid="'+esc(wf.id)+'" type="button" title="打开 '+esc(wf.name||'PDF')+'">'+
              ic('doc')+'<span>'+esc(wf.name||'题目.pdf')+'</span><em>'+fileSize(wf.size)+'</em></button>';

    segSubj+segState+

/* =========================================================
   模块六：总结（把工作 + 学习自动汇总成一段可改的文字）
   思路：不让人从零写总结，先按区间把两块的数据算成事实，
        再生成一版草稿，人只需要改语气、补上下文。
   ========================================================= */
var _reviewDraft=null;   /* { key, text, edited } */

var RV_SPANS=[['d7','近 7 天'],['week','本周'],['last','上周'],['m30','近 30 天'],['month','本月']];

/* 区间：本周按周一起算，与工作日直觉一致 */
function rvSpan(key){
  var t0=todayStr(), d=parseD(t0), wd=(d.getDay()+6)%7, sp;
  if(key==='d7'){
    /* 默认用滚动 7 天：周一打开也有内容，比“本周”只有一天实用 */
    sp={ key:'d7', label:'近 7 天', from:addDays(t0,-6), to:t0 };
    sp.prev={ from:addDays(t0,-13), to:addDays(t0,-7) };
  }else if(key==='last'){
    var mon=addDays(t0,-(wd+7));
    sp={ key:'last', label:'上周', from:mon, to:addDays(mon,6) };
    sp.prev={ from:addDays(sp.from,-7), to:addDays(sp.from,-1) };
  }else if(key==='m30'){
    sp={ key:'m30', label:'近 30 天', from:addDays(t0,-29), to:t0 };
    sp.prev={ from:addDays(t0,-59), to:addDays(t0,-30) };
  }else if(key==='month'){
    var first=t0.slice(0,8)+'01', lastEnd=aiMonthEnd(first,-1);
    sp={ key:'month', label:'本月', from:first, to:t0 };
    sp.prev={ from:lastEnd.slice(0,8)+'01', to:lastEnd };
  }else{
    var mon2=addDays(t0,-wd);
    sp={ key:'week', label:'本周', from:mon2, to:t0 };
    sp.prev={ from:addDays(mon2,-7), to:addDays(mon2,-1) };
  }
  sp.days=dayDiff(sp.to,sp.from)+1;
  sp.title=mdShort(sp.from)+' – '+mdShort(sp.to);
  sp.full=sp.from+' ~ '+sp.to;
  return sp;
}
function rvIn(d,f,t){ return !!d && String(d).slice(0,10)>=f && String(d).slice(0,10)<=t; }

function rvStats(sp){
  var f=sp.from, t=sp.to;
  var doneT=S.tasks.filter(function(x){ return x.done && rvIn(x.doneAt,f,t); })
    .sort(function(a,b){ return (a.doneAt||'')<(b.doneAt||'')?-1:1; });
  var newT=S.tasks.filter(function(x){ return rvIn(x.createdAt,f,t); });
  var newOpen=newT.filter(function(x){ return !x.done; });
  var lateOpen=overdue().sort(function(a,b){ return (a.due||'')<(b.due||'')?-1:1; });
  var meets=S.meetings.filter(function(m){ return rvIn(m.date,f,t); })
    .sort(function(a,b){ return (a.date||'')<(b.date||'')?-1:1; });
  var sc=(S.study.scores||[]).filter(function(x){ return rvIn(x.date,f,t); }).sort(byDateAsc);
  var ppr=(S.study.papers||[]).filter(function(x){ return rvIn(x.date,f,t); });
  var wNew=(S.study.wrongs||[]).filter(function(x){ return rvIn(x.date,f,t); });
  var wOpen=(S.study.wrongs||[]).filter(function(x){ return !x.mastered; });

  var bySubj=SUBJ.map(function(sb){
    var arr=sc.filter(function(x){ return x.subj===sb.k; });
    return { k:sb.k, n:sb.n, c:sb.c, cnt:arr.length, avg:avgRate(arr) };
  });

  var tcnt={};
  wOpen.forEach(function(w){ var k=(w.topic||'未归类'); tcnt[k]=(tcnt[k]||0)+1; });
  var weak=Object.keys(tcnt).map(function(k){ return { k:k, n:tcnt[k] }; })
    .sort(function(a,b){ return b.n-a.n; }).slice(0,5);

  var den=doneT.length+newOpen.length;
  return {
    from:f, to:t,
    doneN:doneT.length, newN:newT.length,
    rate: den ? Math.min(100, Math.round(doneT.length/den*100)) : null,
    doneList:doneT, lateOpen:lateOpen,
    meets:meets, meetN:meets.length,
    meetMin:meets.reduce(function(a,m){ return a+(Number(m.duration)||0); },0),
    projAct:activeProj().length, projBlk:blockedProj().length,
    projDone:S.projects.filter(function(p){ return p.status==='done'; }).length,
    scN:sc.length, scAvg:avgRate(sc), bySubj:bySubj, scList:sc,
    paperN:ppr.length, wrongNew:wNew.length, wrongOpen:wOpen.length, weak:weak
  };
}

/* 对比文案 */
function rvDelta(cur, prev, unit, isPct){
  if(prev===null || prev===undefined || cur===null || cur===undefined) return '';
  if(!prev && !cur) return '';
  var d=Math.round((cur-prev)*10)/10;
  if(!d) return '，与上期持平';
  return '，比上期'+(d>0?'多':'少')+' '+Math.abs(d)+(isPct?' 个百分点':(unit||''));
}

function rvProjLine(p){
  var pg=projProgress(p), stt=statOf(p.status);
  var bits=[catOf(p.cat).label];
  if(p.status==='done') bits.push('已完成');
  else bits.push(phaseOf(p.phase).label + (pg?' · 进度 '+pg.pct+'%':''));
  return '- '+p.name+'（'+bits.join(' · ')+'）'+(p.next?'：下一步 '+p.next:(p.blocker?'：卡在 '+p.blocker:''));
}

/* 生成正文（Markdown，复制到腾讯文档/邮件都能用） */
function rvDraft(sp, st, pv){
  var L=[];
  L.push('# '+sp.title+' '+sp.label+'总结');
  L.push('');
  L.push('> 统计区间 '+sp.full+'（'+sp.days+' 天）· 生成于 '+todayStr());
  L.push('');

  /* ---- 工作 ---- */
  L.push('## 一、工作');
  var w=[];
  if(st.doneN || st.newN){
    var t1='- 完成 '+st.doneN+' 项任务，新增 '+st.newN+' 项';
    if(st.rate!==null) t1+='，完成率 '+st.rate+'%';
    t1+=rvDelta(st.doneN, pv.doneN, ' 条')+'。';
    w.push(t1);
  }
  st.doneList.slice(0,6).forEach(function(x){
    var pj=x.pid?projById(x.pid):null;
    w.push('  - '+x.title+(pj?'（'+pj.name+'）':'')+(x.doneAt&&x.doneAt!==sp.to?'　'+mdShort(x.doneAt):''));
  });
  if(st.doneList.length>6) w.push('  - 其余 '+(st.doneList.length-6)+' 项略');
  if(st.lateOpen.length){
    w.push('- 逾期未处理 '+st.lateOpen.length+' 项：'+st.lateOpen.slice(0,4).map(function(x){ return x.title+'（'+x.due+'）'; }).join('、')+'。');
  }
  if(st.meetN){
    w.push('- 会议 '+st.meetN+' 场，共 '+(Math.round(st.meetMin/6)/10)+' 小时。');
    st.meets.slice(-3).forEach(function(m){
      var key=String(m.conclusion||m.notes||'').replace(/\s+/g,' ').slice(0,60);
      w.push('  - '+mdShort(m.date)+' '+m.title+(key?'：'+key:''));
    });
  }
  var hotProj=S.projects.filter(function(p){ return p.status!=='done'; }).slice(0,5);
  if(hotProj.length){
    w.push('- 在跟的项目 '+hotProj.length+' 个：');
    hotProj.forEach(function(p){ w.push('  '+rvProjLine(p)); });
  }
  if(!w.length) w.push('- 这段时间工作和会议都没有留下记录。');
  L=L.concat(w);
  L.push('');

  /* ---- 学习 ---- */
  L.push('## 二、学习');
  var s=[];
  if(st.scN){
    var t2='- 练习 '+st.scN+' 次，平均得分率 '+(st.scAvg===null?'—':st.scAvg+'%')+'（'+rateLabel(st.scAvg)+'）';
    t2+=rvDelta(st.scAvg, pv.scAvg, '', true)+'。';
    s.push(t2);
    var sub=st.bySubj.filter(function(x){ return x.cnt; }).map(function(x){
      return x.n+' '+x.cnt+' 次（'+(x.avg===null?'—':x.avg+'%')+'）';
    });
    if(sub.length) s.push('- '+sub.join(' · ')+'。');
  }
  if(st.paperN) s.push('- 新增试卷 '+st.paperN+' 份，已归档可随时导出 PDF。');
  if(st.wrongNew) s.push('- 新增错题 '+st.wrongNew+' 道。');
  if(st.wrongOpen){
    var wk=st.weak.filter(function(x){ return x.n>1; });
    s.push('- 目前仍有 '+st.wrongOpen+' 道待巩固'+(wk.length?'，最集中的是 '+wk.map(function(x){ return x.k+'（'+x.n+'）'; }).join('、'):'')+'。');
  }
  if(!s.length) s.push('- 这段时间没有录入练习和成绩。');
  L=L.concat(s);
  L.push('');

  /* ---- 下一步 ---- */
  L.push('## 三、下一步');
  var n=[];
  if(st.lateOpen.length){
    n.push('- 先把逾期的 '+st.lateOpen.length+' 项清掉：'+st.lateOpen.slice(0,3).map(function(x){ return x.title; }).join('、')+(st.lateOpen.length>3?' 等':'')+'。');
  }
  var blocked=S.projects.filter(function(p){ return p.status==='blocked'; });
  if(blocked.length){
    n.push('- 推一把卡住的项目：'+blocked.slice(0,3).map(function(p){ return p.name+(p.blocker?'（'+p.blocker+'）':''); }).join('、')+'。');
  }
  var nextProj=S.projects.filter(function(p){ return p.status==='active' && p.next; }).slice(0,2);
  nextProj.forEach(function(p){ n.push('- '+p.name+'：'+p.next+'。'); });
  if(st.weak.length) n.push('- 学习上巩固「'+st.weak[0].k+'」（'+st.weak[0].n+' 道错题），下次练习前重做一遍。');
  if(!n.length) n.push('- 暂无待办，保持当前节奏。');
  L=L.concat(n);
  return L.join('\n');
}

/* 自动观察：从数据里挑几句真正有用的话，不写套话 */
function rvInsights(st, pv){
  var out=[];
  if(st.lateOpen.length){
    var old=st.lateOpen[0];
    out.push('还有 <b>'+st.lateOpen.length+' 项</b>逾期没清，最早的是「'+esc(old.title)+'」，已经拖了 '+Math.abs(dayDiff(old.due,todayStr()))+' 天。');
  }else if(st.doneN){
    out.push('这段时间<b>没有逾期</b>，手头节奏是稳的。');
  }
  var best=null;
  st.bySubj.forEach(function(x){
    if(!x.cnt || x.avg===null) return;
    var p=pv.bySubj.filter(function(y){ return y.k===x.k; })[0];
    if(!p || p.avg===null) return;
    var d=Math.round((x.avg-p.avg)*10)/10;
    if(!best || Math.abs(d)>Math.abs(best.d)) best={ n:x.n, d:d };
  });
  if(best && best.d>0) out.push(best.n+'比上期<b>高了 '+best.d+' 个百分点</b>，是这段时间最明显的变化。');
  else if(best && best.d<0) out.push(best.n+'比上期<b>掉了 '+Math.abs(best.d)+' 个百分点</b>，值得盯一下。');
  if(st.weak.length && st.weak[0].n>=2) out.push('「'+esc(st.weak[0].k)+'」累计 <b>'+st.weak[0].n+' 道</b>待巩固，建议专门练一组再往下走。');
  if(st.meetN && !st.doneN) out.push('开了 '+st.meetN+' 场会，但任务表里没有落地记录，会议结论可能没转成待办。');
  if(!out.length) out.push('数据还不多，再记两周就能看出趋势了。');
  return out.slice(0,3);
}

/* ---------- 周期总结页 ---------- */
function vReview(){
  var key=S.ui.reviewRange||'week';
  var sp=rvSpan(key), st=rvStats(sp), pv=rvStats(sp.prev);
  var rk=key+'|'+sp.from+'|'+sp.to;
  if(!_reviewDraft || _reviewDraft.key!==rk) _reviewDraft={ key:rk, text:'', edited:false };
  if(!_reviewDraft.edited) _reviewDraft.text=rvDraft(sp,st,pv);

  var seg='<div class="seg wrap" style="margin-bottom:14px">'+RV_SPANS.map(function(x){
    return '<button class="'+(key===x[0]?'on':'')+'" data-act="reviewRange" data-v="'+x[0]+'" type="button">'+x[1]+'</button>';
  }).join('')+'</div>';

  var dDone=(pv.doneN||st.doneN)?st.doneN-pv.doneN:null;
  var statCards='<div class="stats">'+
    '<div class="stat teal"><div class="lb">'+ic('check')+'完成任务</div><div class="n">'+st.doneN+'<small>条</small></div><div class="d">'+
      (dDone===null?'上期没有完成记录':(dDone>0?'比上期多 '+dDone+' 条':dDone<0?'比上期少 '+(-dDone)+' 条':'与上期持平'))+'</div></div>'+

/* ---------- 错题附件：照片 / PDF ----------
   和试卷一样存在 IndexedDB：照片压到 1800px，PDF 原样存；
   扫描版 PDF 还能把里面的 JPEG 页面抽出来当照片，手机上直接翻。 */
var _wqBuf=null, WQ_MAX_PAGES=12, WQ_PDF_MAX=24*1024*1024;
function wqPagesOf(w){ return (w && Array.isArray(w.pages)) ? w.pages : []; }
function wqFilesOf(w){ return (w && Array.isArray(w.files)) ? w.files : []; }
function fileSize(n){
  n=Number(n)||0;
  if(n>=1048576) return (n/1048576).toFixed(1)+' MB';
  if(n>=1024) return Math.round(n/1024)+' KB';
  return n+' B';
}

/* 从 PDF 字节里捞出内嵌的 JPEG（扫描件基本都是 /DCTDecode），
   捞不到就只在系统阅读器里看，不影响保存 */
function pdfScanJpegs(b){
  var out=[], n=b.length, i=0;
  while(i<n-3 && out.length<WQ_MAX_PAGES){
    if(b[i]===0xFF && b[i+1]===0xD8 && b[i+2]===0xFF){
      var j=i+2, end=-1, lim=Math.min(n-1, i+14000000);
      while(j<lim){
        if(b[j]===0xFF && b[j+1]===0xD9){ end=j+2; break; }
        j++;
      }
      if(end>i+4000){ out.push(b.subarray(i,end)); i=end; continue; }
      i+=3;
    }else i++;
  }
  return out;
}
async function addWqFiles(files){
  var arr=Array.prototype.slice.call(files||[]);
  if(!arr.length) return;
  if(!_wqBuf) _wqBuf={ id:null, pages:[], files:[], dropped:[], dropOnClose:true };
  if(!_wqBuf.dropped) _wqBuf.dropped=[];
  var nImg=0, nPdf=0, nPage=0, bad=0;
  toast('正在处理 '+arr.length+' 个文件…');
  for(var i=0;i<arr.length;i++){
    var f=arr[i];
    var isPdf=/\.pdf$/i.test(f.name||'') || /pdf/i.test(f.type||'');
    try{
      if(isPdf){
        if(f.size>WQ_PDF_MAX){ bad++; continue; }
        var fid=uid();
        await idbPut(fid, f);
        _wqBuf.files.push({ id:fid, name:f.name||'题目.pdf', size:f.size||0, at:todayStr() });
        nPdf++;
        var bytes=null;
        try{ bytes=await blobToBytes(f); }catch(e){}
        if(bytes){
          var jpgs=pdfScanJpegs(bytes);
          for(var k=0;k<jpgs.length;k++){
            if(_wqBuf.pages.length>=WQ_MAX_PAGES) break;
            try{
              var jb=new Blob([jpgs[k]], { type:'image/jpeg' });
              var sb2=await shrinkImage(jb, 1800, 0.8);
              var pid2=uid();
              await idbPut(pid2, sb2);
              _wqBuf.pages.push(pid2); nPage++;
            }catch(e){}
          }
        }
      }else if(/^image\//.test(f.type||'') || /\.(jpe?g|png|webp|heic|heif|bmp)$/i.test(f.name||'')){
        if(_wqBuf.pages.length>=WQ_MAX_PAGES){ bad++; continue; }
        var sb=await shrinkImage(f, 1800, 0.82);
        var pid=uid();
        await idbPut(pid, sb);
        _wqBuf.pages.push(pid); nImg++;
      }else bad++;
    }catch(e){ bad++; }
  }
  renderWqBuf();
  var msg=[];
  if(nImg) msg.push(nImg+' 张照片');
  if(nPdf) msg.push(nPdf+' 份 PDF'+(nPage?('（抽出 '+nPage+' 页）'):''));
  if(bad) msg.push(bad+' 个没读出来');
  toast(msg.length ? ('已加入 '+msg.join(' · ')) : '文件没读出来，换一个试试');
}
/* PDF 预览：能内嵌就内嵌，不能就交给系统阅读器 */
function openWqFile(fid, name){
  idbGet(fid).then(function(b){
    if(!b){ toast('文件不在这台设备上'); return; }
    var url=URL.createObjectURL(b);
    var el=document.createElement('div');
    el.className='viewer vw-pdf';
    el.innerHTML='<div class="vw-bar"><span class="vb-t">'+esc(name||'PDF')+'</span><span class="sp"></span>'+
      '<a class="vw-btn" href="'+url+'" target="_blank" rel="noopener">'+ic('external')+'新窗口</a>'+
      '<a class="vw-btn" href="'+url+'" download="'+esc(name||'file.pdf')+'">'+ic('download')+'下载</a>'+
      '<button class="vw-x" type="button" aria-label="关闭">'+ic('x')+'</button></div>'+
      '<iframe class="vw-frame" src="'+url+'" title="PDF"></iframe>'+
      '<div class="vw-tip">手机上这块空白是正常的，点上面「新窗口」或「下载」用系统阅读器打开。</div>';
    function close(){
      try{ URL.revokeObjectURL(url); }catch(e){}
      if(el.parentNode) el.parentNode.removeChild(el);

/* ---------- 图片动作 ---------- */
function blobToBytes(b){
  if(b.arrayBuffer) return b.arrayBuffer().then(function(ab){ return new Uint8Array(ab); });
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ res(new Uint8Array(fr.result)); };
    fr.onerror=rej;
    fr.readAsArrayBuffer(b);
  });
}

async function exportPaperPack(){
  var list=(S.study.papers||[]).slice();
  if(!list.length){ toast('还没有试卷'); return; }
  toast('正在打包 '+list.length+' 份试卷…');
  var out={ app:'growth-workbench-papers', version:1, exportedAt:new Date().toISOString(), papers:[] };
  var miss=0, cnt=0;
  for(var i=0;i<list.length;i++){
    var p=list[i], pgs=p.pages||[], imgs=[];
    for(var j=0;j<pgs.length;j++){
      var b=null;
      try{ b=await idbGet(pgs[j]); }catch(e){}
      if(!b){ miss++; continue; }
      var du=await blobToDataURL(b);
      if(!du){ miss++; continue; }
      imgs.push({ id:pgs[j], data:du });
      cnt++;
    }
    var meta=JSON.parse(JSON.stringify(p));
    delete meta.imgs;
    meta.imgs=imgs;
    out.papers.push(meta);
  }
  dlBlob(new Blob([JSON.stringify(out)], { type:'application/json' }), '试卷包_'+todayStr()+'.json');
  toast('已打包 '+out.papers.length+' 份 · '+cnt+' 页'+(miss?(' · '+miss+' 页原图缺失已跳过'):''));
}
async function importPaperPack(file){
  if(!file) return;
  toast('正在导入试卷包…');
  var txt='';
  try{ txt=await readTextFile(file); }catch(e){ toast('文件读不出来'); return; }
  var d=null;
  try{ d=JSON.parse(txt); }catch(e){ toast('不是有效的试卷包文件'); return; }
  var arr=Array.isArray(d)?d
    :(Array.isArray(d.papers)?d.papers
    :((d.study&&Array.isArray(d.study.papers))?d.study.papers:[]));
  if(!arr.length){ toast('这个文件里没有试卷'); return; }
  var added=0, merged=0, put=0;
  for(var i=0;i<arr.length;i++){
    var src=arr[i]||{};
    var imgs=Array.isArray(src.imgs)?src.imgs:[];
    var p=JSON.parse(JSON.stringify(src));
    delete p.imgs;
    if(!p.id) p.id=uid();
    for(var j=0;j<imgs.length;j++){
      var im=imgs[j]||{};
      var blob=im.data?dataURLtoBlob(im.data):null;
      if(!blob) continue;
      try{ await idbPut(im.id||uid(), blob); put++; }catch(e){}
    }
    var old=paperById(p.id);
    if(old){
      var set={};
      (old.pages||[]).forEach(function(x){ set[x]=1; });
      (p.pages||[]).forEach(function(x){ set[x]=1; });
      old.pages=Object.keys(set);
      ['subj','kind','title','date','note'].forEach(function(k){
        if(p[k]!==undefined && p[k]!=='') old[k]=p[k];
      });
      if(!old.thumb && p.thumb) old.thumb=p.thumb;
      merged++;
    }else{
      S.study.papers.push(p);
      added++;
    }
  }
  _thumbTried={};
  save(); closeModal(); renderAll(); ensureThumbs(6);
  toast('导入完成 · 新增 '+added+' 份'+(merged?(' · 合并 '+merged+' 份'):'')+(put?(' · '+put+' 页原图'):''));
}

/* ---------- 生成 PDF ---------- */
async function makePaperPdf(ids, oneName){
  var list=(ids||[]).map(paperById).filter(Boolean).sort(byDateAsc);
  if(!list.length){ toast('还没有可导出的试卷'); return; }
  toast('正在生成 PDF，共 '+list.length+' 份…');
  var items=[];
  for(var i=0;i<list.length;i++){
    var p=list[i], sb=subjOf(p.subj);
    var dv=await dividerPage('练 习 试 卷', sb.n+'\n'+String(p.title||'未命名').slice(0,16),
      p.date+' | '+(p.kind||'')+' | 共 '+(p.pages||[]).length+' 页', sb.c);
    if(dv) items.push({ bytes:dv, w:1240, h:1754 });
    var pgs=p.pages||[];
    for(var j=0;j<pgs.length;j++){
      var b=null;
      try{ b=await idbGet(pgs[j]); }catch(e){}
      if(!b) continue;
      var bytes=await blobToBytes(b);
      var dim=jpegDim(bytes);
      if(!dim) continue;
      items.push({ bytes:bytes, w:dim.w, h:dim.h });
    }
  }
  if(!items.length){ toast('这些试卷里没有可用的图片'); return; }
  var blob=buildPdf(items);
  var fname=String(oneName||('练习试卷_'+todayStr())).replace(/[\\\/:*?"<>|\r\n]/g,'_').slice(0,60)+'.pdf';
  dlBlob(blob, fname);
  toast('PDF 已生成 · '+items.length+' 页 · '+(blob.size/1048576).toFixed(1)+' MB');
}

/* 单个项目导出：项目信息 + 线路进度 + 全部待办（未完成 / 已完成） */
function exportProjData(pid){
  var p=findProj(pid), rows=[];
  if(!p){ rows.push(['项目不存在']); return { rows:rows, head:[], scope:'proj:'+pid, title:'项目' }; }
  var all=projIssuesOf(p);
  var und=all.filter(function(t){ return !t.done; });
  var don=all.filter(function(t){ return t.done; });
  var ts=tracksOf(p);
  rows.push(['项目 · '+p.name]);
  rows.push(['项目名称','类型','阶段','健康状态','目标日期','备注','卡点']);
  rows.push([p.name, catOf(p.cat).label, phaseOf(p.phase).label, statOf(p.status).label, p.goalDate||'', p.next||'', p.blocker||'']);
  rows.push([]);
  rows.push(['线路进度']);
  if(ts.length){
    rows.push(['线路','进度','当前步骤','备注']);
    ts.forEach(function(t){
      var n=trackSteps(t).length, d=trackDone(t);
      rows.push([t.name, d+'/'+n, (n&&d<n)?trackSteps(t)[d].n:'已完成', t.note||'']);
    });
  }else{
    rows.push(['还没有线路']);
  }
  rows.push([]);
  rows.push(['期间问题处理（共 '+all.length+' 条 · 未完成 '+und.length+' · 已完成 '+don.length+'）']);
  if(all.length){
    rows.push(['标题','优先级','截止日期','所属线路','状态','完成日期']);
    all.forEach(function(t){
      var tk = t.tid ? findTrack(p, t.tid) : null;
      rows.push([t.title, prioOf(t.prio).label, t.due||'', tk?tk.name:'', t.done?'已完成':'未完成', (t.done&&t.doneAt)?t.doneAt:'']);
    });
  }else{
    rows.push(['暂无待办事项']);
  }
  rows.push([]);
  rows.push(['导出时间', todayStr()]);
  return { rows:rows, head:[], scope:'proj:'+pid, title:scopeName('proj:'+pid) };
}
function exportData(scope){
  var title='', head=[], rows=[];
  if(scope && scope.indexOf('proj:')===0) return exportProjData(scope.slice(5));
  if(scope==='tasks'||scope==='focus'||scope==='all'){
    var list = scope==='focus' ? overdue().concat(dueToday()).concat(dueSoon(3)) : S.tasks.slice();
    list=list.slice().sort(function(a,b){ return (a.due||'9999')<(b.due||'9999')?-1:1; });
    rows.push(['待办清单']);
    head=['标题','优先级','截止日期','状态','所属项目','完成日期'];
    rows.push(head);
    list.forEach(function(t){
      rows.push([t.title, prioOf(t.prio).label, t.due||'', t.done?'已完成':'未完成', projNameOf(t.pid)||'', t.doneAt||'']);
    });
    rows.push([]);
  }
  if(scope==='projects'||scope==='all'){
    rows.push(['项目总览']);
    rows.push(['项目名称','类型','阶段','健康状态','线路进度','备注','卡点','目标日期','关联任务完成率']);
    S.projects.forEach(function(p){
      var pg=projProgress(p.id), tks=tracksOf(p);
      var prog = tks.length ? tks.map(function(t){ var n=trackSteps(t).length, d=trackDone(t); return t.name+' '+d+'/'+n+((n&&d>=n)?' ✓':''); }).join(' ｜ ') : '还没有线路';
      rows.push([p.name, catOf(p.cat).label, phaseOf(p.phase).label, statOf(p.status).label, prog, p.next||'', p.blocker||'', p.goalDate||'', pg?(pg.pct+'%'):'无关联任务']);
    });
    rows.push([]);
    rows.push(['线路明细']);
    rows.push(['项目','线路','进度','当前步骤','备注']);
    S.projects.forEach(function(p){
      tracksOf(p).forEach(function(t){
        var n=trackSteps(t).length, d=trackDone(t);
        rows.push([p.name, t.name, d+'/'+n, (n&&d<n)?trackSteps(t)[d].n:'已完成', t.note||'']);
      });
    });
    rows.push([]);
  }
  if(scope==='meetings'||scope==='all'){
    rows.push(['会议记录']);
    rows.push(['主题','日期','参会人','时长(分钟)','议题纪要','结论','后续待办','关联项目']);
    S.meetings.slice().sort(function(a,b){ return (b.date||'')<(a.date||'')?-1:1; }).forEach(function(m){
      rows.push([m.title, m.date||'', m.attendees||'', m.duration||'', m.notes||'', m.conclusion||'', (m.todos||'').replace(/\n/g,' / '), projNameOf(m.pid)||'']);
    });
  }
  rows.push([]);
  rows.push(['导出时间', todayStr()]);
  return { rows:rows, head:head, scope:scope, title:scopeName(scope) };
}
function scopeName(s){
  if(s && s.indexOf('proj:')===0){
    var p=findProj(s.slice(5));
    return String(p?p.name:'未命名项目').replace(/[\\\/:*?"<>|\r\n]/g,'-').slice(0,40);
  }
  return { tasks:'待办清单', focus:'今天要处理', projects:'项目总览', meetings:'会议记录', all:'工作数据汇总' }[s]||'工作数据';
}
function toTSV(rows){ return rows.map(function(r){ return r.map(function(c){ return String(c==null?'':c).replace(/\t/g,' ').replace(/\n/g,' '); }).join('\t'); }).join('\n'); }
function toHTMLTable(rows){
  var h='<table border="1" style="border-collapse:collapse;font-family:sans-serif;font-size:13px">';
  rows.forEach(function(r){
    if(!r.length){ h+='<tr><td colspan="8" style="border:none;height:8px"></td></tr>'; return; }
    var isTitle = r.length===1;
    h+='<tr>';
    r.forEach(function(c){
      var st=isTitle ? 'style="font-weight:bold;font-size:15px;border:none;padding:6px 4px"' : 'style="padding:5px 8px;border:1px solid #ddd"';
      h+='<td '+st+'>'+String(c==null?'':c).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')+'</td>';
    });
    h+='</tr>';
  });
  return h+'</table>';
}
function toMarkdown(rows){
  var out=[], expectHead=false;
  rows.forEach(function(r){
    if(!r.length){ out.push(''); expectHead=false; return; }
    if(r.length===1){ out.push(''); out.push('## '+r[0]); out.push(''); expectHead=true; return; }
    out.push('| '+r.join(' | ')+' |');
    if(expectHead){ out.push('|'+r.map(function(){ return '---'; }).join('|')+'|'); expectHead=false; }
  });
  return out.join('\n').replace(/^\n+/,'');
}
function copyRich(rows){
  var plain=toTSV(rows), html=toHTMLTable(rows);
  if(navigator.clipboard && window.ClipboardItem){
    var item={};
    try{ item['text/html']=new Blob([html],{type:'text/html'}); }catch(e){}
    item['text/plain']=new Blob([plain],{type:'text/plain'});
    return navigator.clipboard.write([new ClipboardItem(item)]).then(function(){ return true; }).catch(function(){ return copyFallback(plain); });
  }
  return Promise.resolve(copyFallback(plain));
}
function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(txt).then(function(){ return true; }).catch(function(){ return copyFallback(txt); });
  }
  return Promise.resolve(copyFallback(txt));
}
function copyFallback(txt){
  try{
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    var ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return !!ok;
  }catch(e){ return false; }
}
function downloadCSV(rows, name){
  var csv=rows.map(function(r){
    return r.map(function(c){
      var s=String(c==null?'':c);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(',');
  }).join('\r\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name+'_'+todayStr()+'.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); if(a.parentNode) a.parentNode.removeChild(a); },400);
}

/* ---------- 顺延（常驻，可选时长） ---------- */
/* 基准：已逾期/未排期从今天起算；还没到期就从原截止日往后推 */
function snBase(t){
  var td=todayStr();
  if(!t || !t.due) return td;
  return t.due<=td ? td : t.due;
}
function snDue(t, days){ return addDays(snBase(t), days); }
function snWeekday(s){ return '周'+'日一二三四五六'.charAt(parseD(s).getDay()); }
function snMonthEnd(){
  var d=parseD(todayStr());
  var e=new Date(d.getFullYear(), d.getMonth()+1, 0);
  return fmtD(e);
}
function snNextMon(){
  var w=parseD(todayStr()).getDay();
  var n=(8-w)%7; if(n===0) n=7;         /* 今天周一 → 下周一 */
  return addDays(todayStr(), n);
}
var _snIds=[];
function snTargets(){
  return _snIds.map(findTask).filter(function(t){ return t && !t.done; });
}
function openSnoozeModal(ids){
  var list=(ids||[]).map(findTask).filter(function(t){ return t && !t.done; });
  if(!list.length){ toast('没有可顺延的任务'); return; }
  _snIds=list.map(function(t){ return t.id; });
  var multi=list.length>1;
  var one=list[0];
  var base=multi?todayStr():snBase(one);
  var cur;
  if(multi){
    cur='共 <b>'+list.length+'</b> 条，统一从<b>今天</b>往后推';
  }else{
    var od = one.due && dayDiff(one.due, todayStr())<0;
    cur = one.due
      ? ('当前截止 <b>'+cnDate(one.due).replace(' · ',' ')+'</b>'+(od?' · <span class="bad">逾期 '+Math.abs(dayDiff(one.due,todayStr()))+' 天</span>':''))
      : '当前没有截止日期 · 按今天起算';
  }
  var picks=[1,3,7,14];
  var grid=picks.map(function(d){
    var tg=addDays(base,d);
    return '<button class="sn-opt" data-act="snSet" data-due="'+tg+'" type="button"><b>+'+d+' 天</b><span>'+(parseD(tg).getMonth()+1)+'/'+parseD(tg).getDate()+' '+snWeekday(tg)+'</span></button>';
  }).join('');
  var mon=snNextMon(), mEnd=snMonthEnd();
  grid+='<button class="sn-opt" data-act="snSet" data-due="'+mon+'" type="button"><b>下周一</b><span>'+(parseD(mon).getMonth()+1)+'/'+parseD(mon).getDate()+' '+snWeekday(mon)+'</span></button>';
  grid+='<button class="sn-opt" data-act="snSet" data-due="'+mEnd+'" type="button"><b>月底</b><span>'+(parseD(mEnd).getMonth()+1)+'/'+parseD(mEnd).getDate()+' '+snWeekday(mEnd)+'</span></button>';
  openModal('<h3>'+(multi?('顺延 '+list.length+' 条任务'):('顺延「'+esc(one.title)+'」'))+'</h3>'+
    '<div class="sn-cur">'+cur+'</div>'+
    '<div class="sn-grid">'+grid+'</div>'+
    '<div class="form">'+
      '<div class="row2">'+
        '<div class="f"><label>或往后推几天</label><input type="number" id="snDays" min="1" max="365" placeholder="例如 5"></div>'+
        '<div class="f"><label>或直接选到期日</label><input type="date" id="snDate" value="'+addDays(base,1)+'"></div>'+
      '</div>'+
    '</div>'+
    '<div class="ma">'+
      '<button class="btn" data-act="closeModal" type="button">取消</button>'+
      '<button class="btn btn-primary" data-act="snCustom" type="button">'+ic('check')+'确定顺延</button>'+
    '</div>');
}
function applySnooze(due){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(due||''))){ toast('日期不对'); return; }
  var list=snTargets();
  if(!list.length){ closeModal(); return; }
  list.forEach(function(t){ t.due=due; });
  save(); closeModal(); renderAll();
  var human=(parseD(due).getMonth()+1)+'月'+parseD(due).getDate()+'日 '+snWeekday(due);
  toast(list.length>1 ? ('已把 '+list.length+' 条顺延到 '+human) : ('已顺延到 '+human));
}
function snApplyCustom(){
  var nEl=$('snDays');
  var n=nEl?parseInt(nEl.value,10):0;
  if(n>0){
    if(n>365){ toast('最多顺延 365 天'); return; }
    var base=(_snIds.length===1 && findTask(_snIds[0])) ? snBase(findTask(_snIds[0])) : todayStr();
    applySnooze(addDays(base,n));
    return;
  }
  var dEl=$('snDate');
  var v=dEl?String(dEl.value||''):'';
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)){ applySnooze(v); return; }
  toast('填个天数，或直接选一个日期');
}

function collectStdForm(){
  var box=$('stdList');
  if(!box || !box.querySelectorAll) return _stdDraft||[];
  var cards=box.querySelectorAll('.std-trk'), out=[];
  for(var i=0;i<cards.length;i++){
    var c=cards[i];
    var nm=c.querySelector('.std-nm');
    var stepBox=c.querySelector('.std-steps');
    var rows=stepBox?stepBox.querySelectorAll('.step-row'):[];
    var steps=[];
    for(var j=0;j<rows.length;j++){
      var a=rows[j].querySelector('.sr-nm'), b=rows[j].querySelector('.sr-d');
      steps.push({
        n:a?String(a.value||'').trim():'',
        d:b?String(b.value||'').trim():''
      });
    }
    out.push({
      id:c.getAttribute('data-id')||uid(),
      name:nm?String(nm.value||'').trim():'',
      steps:steps
    });
  }
  return out;
}
/* 校验并落库；返回 {err} 或 {ok:true} */
function saveStd(list, applyAll){
  if(!list || !list.length) return { err:'至少要有一条线路' };
  var clean=[];
  for(var i=0;i<list.length;i++){
    var name=String(list[i].name||'').trim();
    var steps=(list[i].steps||[]).filter(function(x){ return String(x.n||'').trim(); })
      .map(function(x){ return { n:String(x.n).trim(), d:String(x.d||'').trim() }; });
    if(!name) return { err:'第 '+(i+1)+' 条线路还没填名称' };
    if(!steps.length) return { err:'「'+name+'」至少要留一步' };
    clean.push({ id:list[i].id||uid(), name:name, steps:steps });
  }
  S.std=clean;
  _stdDraft=null;
  var n=0;
  if(applyAll) n=applyStdToProjects();
  save();
  closeModal(); renderAll();
  toast(applyAll ? ('标准流程已保存 · 已套用到 '+n+' 个项目') : '标准流程已保存 · 新建项目按它生成线路');
  return { ok:true };
}

      _snIds=[t3.id];
      openSnoozeModal([t3.id]);
      break;
    }
    case 'postponeAll': {
      var odl=overdue();
      if(!odl.length){ toast('没有逾期任务'); break; }
      openSnoozeModal(odl.map(function(x){ return x.id; }));
      break;

    case 'taskFilter': S.ui.taskFilter=el.getAttribute('data-v'); saveNow(); renderAll(); break;
    case 'projFilter': S.ui.projFilter=el.getAttribute('data-v'); saveNow(); renderAll(); break;

      var tkid=el.getAttribute('data-tid');
      tkSetOpen(tkid, !tkIsOpen(tkid));
      saveNow(); renderAll();
      break;
    }
    case 'trackStep': {
      var tsp=findProj(id); if(!tsp) break;
      var tst=findTrack(tsp, el.getAttribute('data-tid')); if(!tst) break;
      var tsl=trackSteps(tst), tsi=Number(el.getAttribute('data-i'));
      if(!isFinite(tsi) || tsi<0 || tsi>=tsl.length) break;
      var tsd=trackDone(tst);
      if(tsi<tsd){
        tst.step=tsi;
        toast('已退回 · 回到「'+tsl[tsi].n+'」之前');
      }else{
        tst.step=Math.min(tsi+1, tsl.length);
        toast(tst.step>=tsl.length ? ('「'+tsl[tsi].n+'」完成 · 这条线路走完了')
                                   : ('「'+tsl[tsi].n+'」完成 · 下一步：'+tsl[tsi+1].n));
      }

      break;
    }
    case 'tkRowAdd': {
      var rbox=el.closest ? el.closest('.step-rows') : null;
      if(!rbox) rbox=$('tkRows');

      var rdiv=document.createElement('div');
      rdiv.className='step-row';
      rdiv.innerHTML=stepRowHtml('','');
      rbox.appendChild(rdiv);
      renumberRows(rbox);

    }
    case 'tkRowDel': {
      var rdel=el.closest?el.closest('.step-row'):null; if(!rdel) break;

      if(rlist.length<=1){
        var i1=rdel.querySelector('input.sr-nm'), i2=rdel.querySelector('input.sr-d');
        if(i1) i1.value=''; if(i2) i2.value='';
      }else{
        rbox2.removeChild(rdel);
      }
      renumberRows(rbox2);
      break;
    }
    case 'tkRowUp': {
      var rup=el.closest?el.closest('.step-row'):null; if(!rup) break;
      var rpv=rup.previousElementSibling;
      if(rpv && rpv.classList && rpv.classList.contains('step-row')) rup.parentNode.insertBefore(rup, rpv);
      renumberRows(rup.parentNode);
      break;
    }
    case 'tkRowDown': {
      var rdn=el.closest?el.closest('.step-row'):null; if(!rdn) break;
      var rnx=rdn.nextElementSibling;

    }
    case 'trackPreset': {
      var pre=trackPreset(el.getAttribute('data-v'));
      if(!pre) break;
      var ne=$('tkName');
      if(ne) ne.value=pre.name;
      var rbox3=$('tkRows');
      if(rbox3){
        rbox3.innerHTML=pre.steps.map(function(s){ var x=stLine(s); return '<div class="step-row">'+stepRowHtml(x.n, x.d)+'</div>'; }).join('');
        renumberRows();

    }
    case 'trackNext': {
      var tnp=findProj(id); if(!tnp) break;

      var tss=trackSteps(tnk), tcur=trackDone(tnk);
      if(!tss.length || tcur>=tss.length) break;
      tnk.step=tcur+1;
      var tInModal = !!(el.closest && el.closest('#trackForm'));
      save(true); renderAll();
      if(tInModal) openTrackModal(id, el.getAttribute('data-tid'));
      toast(tnk.step<tss.length ? ('「'+tss[tcur].n+'」完成 · 下一步：'+tss[tnk.step].n) : ('「'+tss[tcur].n+'」完成 · 这条线路走完了'));
      break;
    }
    case 'trackPrev': {
      var tvp=findProj(id); if(!tvp) break;
      var tvk=findTrack(tvp, el.getAttribute('data-tid')); if(!tvk) break;
      var tvc=trackDone(tvk); if(tvc<=0) break;
      tvk.step=tvc-1;
      var pInModal = !!(el.closest && el.closest('#trackForm'));
      save(true); renderAll();
      if(pInModal) openTrackModal(id, el.getAttribute('data-tid'));
      toast('已退回「'+trackSteps(tvk)[tvk.step].n+'」');

    }
    case 'delTrack': {
      var tdp=findProj(id); if(!tdp) break;
      var tdt=findTrack(tdp, el.getAttribute('data-tid')); if(!tdt) break;
      confirmBox('删除这条线路？','「'+esc(tdt.name)+'」的步骤和进度都会被移除，其他线路不受影响。','删除', function(){
        tdp.tracks=(tdp.tracks||[]).filter(function(x){ return x.id!==tdt.id; });
        S.tasks.forEach(function(x){ if(x.tid===tdt.id){ x.tid=''; } });
        tkSetOpen(tdt.id, false);
        closeModal(); save(); renderAll(); toast('线路已删除');
      });
      break;
    }
    case 'addProj': openProjModal(null); break;
    case 'openFlows': _stdDraft=null; openStdModal(); break;
    case 'stdToggle': {
      var tcard=el.closest?el.closest('.std-trk'):null; if(!tcard) break;
      var tkey=tcard.getAttribute('data-id');
      var tidx=Number(tcard.getAttribute('data-i'));

      _stdDraft=tlist; rerenderStd();

    }
    case 'stdLineAdd': {
      var sl=collectStdForm();
      if(!stdAddLine(sl)){ toast('最多 '+STD_MAX_LINES+' 条线路'); break; }
      var added=sl[sl.length-1];
      if(added && added.id) _stdOpen[added.id]=true;   /* 新加的线路直接展开 */
      _stdDraft=sl; rerenderStd();
      break;
    }
    case 'stdLineDel': {
      var sc=el.closest?el.closest('.std-trk'):null; if(!sc) break;
      var si=Number(sc.getAttribute('data-i'));
      var sl2=collectStdForm();
      if(!stdDelLine(sl2, si)){ toast('至少保留一条线路'); break; }
      _stdDraft=sl2; rerenderStd();
      toast('已删除一条线路，保存后生效');
      break;
    }
    case 'stdLineUp': case 'stdLineDown': {
      var su=el.closest?el.closest('.std-trk'):null; if(!su) break;
      var ui=Number(su.getAttribute('data-i'));

    }
    case 'stdReset': {
      _stdDraft=collectStdForm();
      confirmBox('恢复内置默认流程？','会把编辑区换回内置的三条线路（生产供货 / 技术资料 / 零星问题处理），你在这里改的内容会丢，保存前的项目不受影响。','恢复默认', function(){
        _stdDraft=defaultStdTracks();
        rerenderStd();
      });
      break;
    }
    case 'flowTab': S.ui.flowTab=el.getAttribute('data-v'); saveNow(); openFlowModal(); break;
    case 'stepNext': {
      var pn=findProj(id); if(!pn) break;
      var ss=stepsOfProj(pn), tot=ss.length, cur=stepDone(pn);
      if(!tot || cur>=tot) break;
      pn.step=cur+1;
      save(true); renderAll();
      var nxt = pn.step<tot ? ('下一步：'+ss[pn.step].n) : '这套流程走完了';
      toast('已完成「'+ss[cur].n+'」· '+nxt);
      break;
    }
    case 'stepPrev': {
      var pb=findProj(id); if(!pb) break;
      var cb=stepDone(pb); if(cb<=0) break;
      pb.step=cb-1; save(true); renderAll(); toast('已退回上一步');
      break;
    }
    case 'editProj': openProjModal(id); break;
    case 'delProj': {
      var p=findProj(id); if(!p) break;
      var n=tasksOfProj(id).length;
      confirmBox('删除这个项目？','「'+esc(p.name)+'」将被移除'+(n?'，其中 '+n+' 条关联待办会保留但失去项目归属':'')+'。','删除', function(){
        S.projects=S.projects.filter(function(x){ return x.id!==id; });
        S.tasks.forEach(function(t){ if(t.pid===id){ t.pid=''; t.tid=''; } });
        save(); renderAll(); toast('项目已删除');
      });
      break;
    }
    case 'addTaskToProj': openTaskModal(null, id); break;
    case 'piMore': { var pm=el.getAttribute('data-id'); _pi.more[pm]=!_pi.more[pm]; renderAll(); break; }
    case 'piDone': { var pd=el.getAttribute('data-id'); _pi.done[pd]=!_pi.done[pd]; renderAll(); break; }
    case 'addMeet': openMeetModal(null); break;
    case 'editMeet': openMeetModal(id); break;
    case 'delMeet': {
      var m=findMeet(id); if(!m) break;
      confirmBox('删除这条会议记录？','「'+esc(m.title)+'」的纪要将被移除，此操作不可撤销。','删除', function(){
        S.meetings=S.meetings.filter(function(x){ return x.id!==id; });
        save(); renderAll(); toast('已删除');
      });
      break;
    }
    case 'todoToTask': {
      var mm=findMeet(id); if(!mm) break;
      var lines=todoLines(mm); var idx=Number(el.getAttribute('data-idx'));
      var txt=lines[idx]; if(!txt) break;
      var exists=S.tasks.some(function(t){ return t.title===txt; });
      if(exists){ toast('这条已经在待办里了'); break; }
      S.tasks.push({ id:uid(), title:txt, prio:'P1', due:addDays(todayStr(),1), done:false, pid:mm.pid||'', createdAt:todayStr(), doneAt:null });
      save(); renderAll(); toast('已加入待办');
      break;
    }
    case 'export': openExportModal(el.getAttribute('data-scope')||'all'); break;
    case 'expTable': {
      var d=exportData(el.getAttribute('data-scope'));
      copyRich(d.rows).then(function(ok){ closeModal(); toast(ok?'表格已复制，去腾讯文档粘贴':'复制失败，请改用下载 CSV'); });
      break;
    }
    case 'expMd': {
      var d2=exportData(el.getAttribute('data-scope'));
      copyText(toMarkdown(d2.rows)).then(function(ok){ closeModal(); toast(ok?'Markdown 已复制':'复制失败，请改用下载 CSV'); });
      break;
    }
    case 'expCsv': {
      var d3=exportData(el.getAttribute('data-scope'));
      downloadCSV(d3.rows, d3.title); closeModal(); toast('CSV 已开始下载');
      break;
    }
    case 'expJson': {
      var blob=new Blob([JSON.stringify({ v:1, exportedAt:new Date().toISOString(), tasks:S.tasks, projects:S.projects, meetings:S.meetings, flows:S.flows, std:S.std, reviews:S.reviews, study:S.study },null,2)],{type:'application/json'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='XCX工作台备份_'+todayStr()+'.json';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); if(a.parentNode) a.parentNode.removeChild(a); },400);
      closeModal(); toast('备份已下载');
      break;
    }
    case 'impJson': {
      var inp=document.createElement('input');
      inp.type='file'; inp.accept='.json,application/json';
      inp.onchange=function(){
        var f=inp.files&&inp.files[0]; if(!f) return;
        var rd=new FileReader();
        rd.onload=function(){
          try{
            var d4=JSON.parse(rd.result);
            if(!d4||(!Array.isArray(d4.tasks)&&!Array.isArray(d4.projects))){ toast('文件格式不对'); return; }
            confirmBox('用备份覆盖当前数据？','将导入 '+((d4.tasks||[]).length)+' 条待办、'+((d4.projects||[]).length)+' 个项目、'+((d4.meetings||[]).length)+' 条会议，当前数据会被替换。','覆盖导入', function(){
              S.tasks=d4.tasks||[]; S.projects=d4.projects||[]; S.meetings=d4.meetings||[];
              S.tasks.forEach(function(t){ delete t.remoteId; });
              S.projects.forEach(function(p){ delete p.remoteId; });
              S.meetings.forEach(function(m){ delete m.remoteId; });
              if(Array.isArray(d4.flows) && d4.flows.length) S.flows=d4.flows;
              if(Array.isArray(d4.std) && d4.std.length) S.std=d4.std;
              if(d4.study && typeof d4.study==='object') S.study=d4.study;
              if(Array.isArray(d4.reviews)) S.reviews=d4.reviews;
              migrate();                 /* 老备份没有 tracks：按 cat/phase/step 重建线路 */
              save(); renderAll(); toast('导入完成');
            });
          }catch(e){ toast('解析文件失败'); }
        };
        rd.readAsText(f);
      };
      inp.click();
      break;
    }
    case 'clearSample': {
      var cnt=S.tasks.filter(function(t){return t.sample;}).length+S.projects.filter(function(p){return p.sample;}).length+S.meetings.filter(function(m){return m.sample;}).length;
      confirmBox('清空示例数据？','将移除 '+cnt+' 条示例记录（含示例会议、示例项目），你自己加的数据不受影响。','清空示例', function(){
        S.tasks=S.tasks.filter(function(t){ return !t.sample; });
        S.projects=S.projects.filter(function(p){ return !p.sample; });
        S.meetings=S.meetings.filter(function(m){ return !m.sample; });
        save(); renderAll(); toast('示例数据已清空');
      });
      break;
    }
    case 'clearAll': {
      confirmBox('清空全部数据？','待办、项目、会议将全部删除，云端记录也会一起清掉。建议先下载一份 JSON 备份。','我确定，清空', function(){
        confirmBox('最后确认','此操作不可撤销。真的要全部清空吗？','全部清空', function(){
          S.tasks=[]; S.projects=[]; S.meetings=[];
          saveNow();
          if(window.__WIPE__) window.__WIPE__(function(){ toast('已全部清空'); });
          renderAll();
        });
      });
      break;
    }
    case 'syncNow': {
      if(!window.__SYNC_ALL__){ toast('本地模式：数据只存在这台设备'); break; }
      window.__SYNC_ALL__();
      break;
    }
    case 'closeModal': closeModal(); break;
    case 'confirmYes': { var cb=_confirmCb; closeModal(); if(cb) cb(); break; }
    default: break;
  }
}

function bindEvents(){
  document.addEventListener('click', function(e){
    var el=e.target;
    if(!el || !el.closest) return;
    var goEl=el.closest('[data-go]');
    if(goEl){ go(goEl.getAttribute('data-go')); return; }
    var grpEl=el.closest('[data-grp]');
    if(grpEl){ goGroup(grpEl.getAttribute('data-grp')); return; }
    var actEl=el.closest('[data-act]');
    if(actEl){ e.preventDefault(); handleAct(actEl.getAttribute('data-act'), actEl); return; }
    if(el.closest('[data-close]') && !el.closest('[data-stop]')) closeModal();
  }, false);
  /* mask 点击（点在 mask 自身） */
  document.addEventListener('click', function(e){
    if(e.target && e.target.classList && e.target.classList.contains('mask')) closeModal();
  }, false);

  document.addEventListener('submit', function(e){
    var f=e.target; if(!f || !f.id) return;
    e.preventDefault();
    var fd=new FormData(f);
    if(f.id==='taskForm'){
      var id=f.getAttribute('data-id');
      var t=id?findTask(id):null;
      if(!t){ t={ id:uid(), createdAt:todayStr(), done:false, doneAt:null }; S.tasks.push(t); }
      t.title=String(fd.get('title')||'').trim();
      t.prio=fd.get('prio')||'P2';
      t.due=fd.get('due')||'';
      t.time=fd.get('time')||'';
      t.pid=fd.get('pid')||'';
      t.tid=t.pid?(fd.get('tid')||''):'';
      save(); closeModal(); renderAll(); toast(id?'已保存':'待办已添加');
    }else if(f.id==='projForm'){
      var pid=f.getAttribute('data-id');
      var p=pid?findProj(pid):null;
      var isNew=!p;
      if(!p){ p={ id:uid(), createdAt:todayStr() }; S.projects.push(p); }
      p.name=String(fd.get('name')||'').trim();
      if(!p.name){ toast('项目名称不能为空'); return; }
      p.cat=fd.get('cat')||'jsfj';
      p.phase=fd.get('phase')||'pre';
      p.status=fd.get('status')||'active';
      p.goalDate=fd.get('goalDate')||'';
      p.next=String(fd.get('next')||'').trim();
      p.blocker=String(fd.get('blocker')||'').trim();
      p.stage='';
      if(isNew){ p.tracks=stdTracks().map(newTrackFromStd); }
      p.tracks=tracksOf(p);
      save(); closeModal(); renderAll();
      toast(isNew ? ('项目已创建 · 已按标准流程带上 '+p.tracks.length+' 条线路') : '已保存');
    }else if(f.id==='trackForm'){
      var tpid=f.getAttribute('data-pid');
      var ttid=f.getAttribute('data-tid');
      var tp=findProj(tpid); if(!tp){ toast('项目不存在'); return; }
      var tname=String(fd.get('tname')||'').trim();
      var tsteps=collectSteps(fd);
      var tnote=String(fd.get('tnote')||'').trim();
      if(!tname){ toast('线路名称不能为空'); return; }
      if(!tsteps.length){ toast('至少写一个步骤'); return; }
      if(ttid){
        var tt=findTrack(tp, ttid); if(!tt){ toast('线路不存在'); return; }
        tt.name=tname; tt.steps=tsteps; tt.note=tnote;
        tt.step=Math.min(Number(tt.step)||0, tsteps.length);
      }else{
        var nt={ id:uid(), name:tname, steps:tsteps, note:tnote, step:0 };
        tracksOf(tp).push(nt);
        tkSetOpen(nt.id, true);   /* 新加的线路直接展开节点，方便马上点 */
      }
      save(); closeModal(); renderAll(); toast(ttid?'线路已更新':'线路已添加');
    }else if(f.id==='stdForm'){
      var applyAll=false;
      var cbx=f.querySelector('input[name="applyAll"]');
      if(cbx && cbx.checked) applyAll=true;
      var res=saveStd(collectStdForm(), applyAll);
      if(res && res.err){ toast(res.err); return; }
    }else if(f.id==='flowForm'){
      var fcat=f.getAttribute('data-cat');
      var fl=flowOf(fcat);
      var fname=String(fd.get('fname')||'').trim();
      var fsteps=parseSteps(fd.get('fsteps'));
      if(!fsteps.length){ toast('至少写一个步骤'); return; }
      if(fl){ fl.name=fname||fl.name; fl.steps=fsteps; }
      save(true); closeModal(); renderAll(); toast('流程已保存 · 共 '+fsteps.length+' 步');
    }else if(f.id==='aiForm'){
      var cmd=String(fd.get('cmd')||'').trim();
      if(!cmd){ toast('先说一句'); return; }
      aiPreview(cmd);
      return;
    }else if(f.id==='meetForm'){
      var mid=f.getAttribute('data-id');
      var m=mid?findMeet(mid):null;
      if(!m){ m={ id:uid(), createdAt:todayStr() }; S.meetings.push(m); }
      m.title=String(fd.get('title')||'').trim();
      m.date=fd.get('date')||'';
      m.attendees=String(fd.get('attendees')||'').trim();
      m.duration=fd.get('duration')?Number(fd.get('duration')):'';
      m.notes=String(fd.get('notes')||'').trim();
      m.conclusion=String(fd.get('conclusion')||'').trim();
      m.todos=String(fd.get('todos')||'').trim();
      m.pid=fd.get('pid')||'';
      save(); closeModal(); renderAll(); toast(mid?'已保存':'会议已记录');
    }else if(f.id==='paperForm'){
      var ppid=f.getAttribute('data-id');
      var pp=ppid?paperById(ppid):null;
      var isNewP=!pp;
      if(!pp){ pp={ id:uid(), createdAt:todayStr(), pages:[] }; }
      var pgs=(_paperBuf && _paperBuf.pages) ? _paperBuf.pages.slice() : (pp.pages||[]);
      if(!pgs.length){ toast('至少先拍一页再保存'); return; }
      pp.subj=fd.get('subj')||'cn';
      pp.kind=fd.get('kind')||'单元测';
      pp.title=String(fd.get('title')||'').trim() || (subjOf(pp.subj).n+'试卷');
      pp.date=fd.get('date')||todayStr();
      pp.note=String(fd.get('note')||'').trim();
      pp.pages=pgs;
      if(isNewP) S.study.papers.push(pp);
      if(_paperBuf) _paperBuf.dropOnClose=false;   /* 已入库，别在关弹窗时删图 */
      save(); closeModal(); renderAll(); ensureThumbs(1);
      toast(isNewP?('试卷已保存 · '+pgs.length+' 页'):'已更新');
    }else if(f.id==='scoreForm'){
      var sfid=f.getAttribute('data-id');
      var sc=sfid?findScore(sfid):null;
      var rawScore=String(fd.get('score')||'').trim();
      var rawFull=String(fd.get('full')||'').trim();
      if(rawScore===''){ toast('先填得分'); return; }
      var sv=Number(rawScore), fv=rawFull?Number(rawFull):100;
      if(!isFinite(sv) || sv<0){ toast('分数格式不对'); return; }
      if(!isFinite(fv) || fv<=0){ toast('满分要大于 0'); return; }
      if(sv>fv){ toast('得分不能超过满分'); return; }
      if(!sc){ sc={ id:uid(), createdAt:todayStr() }; S.study.scores.push(sc); }
      sc.subj=fd.get('subj')||'cn';
      sc.date=fd.get('date')||todayStr();
      sc.name=String(fd.get('name')||'').trim() || '练习';
      sc.score=sv; sc.full=fv;
      sc.rank=fd.get('rank')?Number(fd.get('rank')):'';
      sc.note=String(fd.get('note')||'').trim();
      save(); closeModal(); renderAll();
      var rr=rateOf(sc);
      toast('已记录 · 得分率 '+rr+'%（'+rateLabel(rr)+'）');
    }else if(f.id==='wrongForm'){
      var wid=f.getAttribute('data-id');
      var wq=wid?findWrong(wid):null;
      var wqText=String(fd.get('q')||'').trim();
      var wqTopic=String(fd.get('topic')||'').trim();
      var wqP=(_wqBuf&&_wqBuf.pages)?_wqBuf.pages.slice():[];
      var wqF=(_wqBuf&&_wqBuf.files)?_wqBuf.files.slice():[];
      if(!wqText && !wqTopic && !wqP.length && !wqF.length){ toast('写一句错在哪，或拍张题目照片'); return; }
      if(!wq){ wq={ id:uid(), createdAt:todayStr(), mastered:false }; S.study.wrongs.push(wq); }
      var oldP=wqPagesOf(wq), oldF=wqFilesOf(wq);
      wq.subj=fd.get('subj')||'cn';
      wq.date=fd.get('date')||todayStr();
      wq.topic=wqTopic;
      wq.q=wqText;
      wq.why=String(fd.get('why')||'').trim();
      wq.fix=String(fd.get('fix')||'').trim();
      wq.pages=wqP;
      wq.files=wqF;

   云端同步（资料库数据表 · 本地权威双向同步）
   规则：本地是权威 → 云端只补本地没有的；推送用 remoteId 精准更新
        每张表额外写「本地ID」字段，彻底消除按标题匹配造成的重复
   ========================================================= */
var DB_TASKS='jRlBHQiMEEw05EclZRecLs';

function setSyncState(cls, text){
  var i, lines=document.querySelectorAll('.sync-line');
  for(i=0;i<lines.length;i++) lines[i].className='sync-line '+cls;
  var texts=document.querySelectorAll('.sync-text');
  for(i=0;i<texts.length;i++) texts[i].textContent=text;
}
function noop(){}
function compact(o){
  var r={};
  Object.keys(o||{}).forEach(function(k){ if(o[k]!==undefined && o[k]!==null) r[k]=o[k]; });
  return r;
}
function gv(v){
  if(v==null) return '';
  if(typeof v==='object'){
    if(v.text!=null) return String(v.text);
    if(Array.isArray(v)) return v.map(function(x){ return (x&&x.text)||x||''; }).join(',');
  }
  return String(v);
}
function dt(v){ var s=gv(v); return s?String(s).slice(0,10):''; }

function syncTable(db, dbId, opts){
  var st={ pulling:false, wiping:false };
  function queryAll(cb){
    var all=[], cursor=null;
    (function page(){
      db.query({ databaseId:dbId, pageSize:100, startCursor:cursor }).then(function(r){
        all=all.concat(r.results||[]);
        if(r.hasMore && r.nextCursor){ cursor=r.nextCursor; page(); } else cb(all);
      }).catch(function(){ cb(null); });
    })();
  }
  function pull(){
    st.pulling=true;
    queryAll(function(rows){
      if(rows===null){ st.pulling=false; setSyncState('off','仅本地'); return; }
      if(!rows.length){ st.pulling=false; push(); return; }
      var locals=opts.list();
      var byId={}; locals.forEach(function(x){ byId[x.id]=x; });
      var added=[], changed=false;
      rows.forEach(function(row){
        var lid=String(gv(row[LID])||'').trim();
        var obj=opts.fromRow(row);
        obj.remoteId=row.record_id;
        if(lid && byId[lid]){ byId[lid].remoteId=row.record_id; return; }
        var k=opts.key(obj); if(!k) return;
        var dup=null;
        locals.forEach(function(x){ if(!dup && opts.key(x)===k) dup=x; });
        if(dup){
          if(opts.adopt){ opts.adopt(dup, obj); dup.remoteId=row.record_id; changed=true; }
          return;
        }
        added.push(obj);
      });
      if(added.length||changed){ if(added.length) opts.append(added); saveNow(); renderAll(); }
      st.pulling=false;
      setSyncState('ok','云端已同步');
    });
  }
  function push(){
    if(st.wiping || st.pulling) return;
    queryAll(function(rows){
      if(rows===null) return;
      var map={}, remoteLid={};
      rows.forEach(function(r){
        var lid=String(gv(r[LID])||'').trim();
        if(lid){ map[lid]=r.record_id; remoteLid[r.record_id]=lid; }
      });
      var keep={}, localKeys={};
      opts.list().forEach(function(it){
        keep[it.id]=1;
        var k=opts.key(it); if(k) localKeys[k]=1;
        var props=compact(opts.props(it));
        props[LID]={ text:String(it.id) };
        if(it.remoteId){ db.updateRecord({ databaseId:dbId, recordId:it.remoteId, properties:props }).catch(noop); }
        else if(map[it.id]){
          it.remoteId=map[it.id];
          db.updateRecord({ databaseId:dbId, recordId:map[it.id], properties:props }).catch(noop);
        }else{
          db.addRecord({ databaseId:dbId, properties:props }).then(function(r){ if(r&&r.id) it.remoteId=r.id; }).catch(noop);
        }
      });
      rows.forEach(function(r){
        var lid=String(gv(r[LID])||'').trim();
        if(lid){ if(!keep[lid]) db.deleteRecord({ databaseId:dbId, recordId:r.record_id }).catch(noop); }
        else{
          var k=opts.key(opts.fromRow(r));
          if(k && !localKeys[k]) db.deleteRecord({ databaseId:dbId, recordId:r.record_id }).catch(noop);
        }
      });
      setSyncState('ok','云端已同步');
    });
  }
  return { pull:pull, push:push, setWipe:function(v){ st.wiping=v; }, queryAll:queryAll, dbId:dbId };
}

/* ---------- 登录态探测 ----------
   发布页运行时会往 window.userInfo 写入登录信息（已登录有 id，未登录为 null/{id:undefined}）。
   未登录时任何云端"写"操作都会被运行时劫持跳转微信登录/小程序，
   所以写库前必须先确认登录态，未登录就只留在本地，绝不主动触发跳转。 */
function authProbed(){
  try{
    var u=window.userInfo;
    if(u===undefined) return 0;                       /* 运行时还没给出结果 */
    return (u && (u.id||u.uid)) ? 1 : -1;             /* 1=已登录  -1=未登录 */
  }catch(e){ return 0; }
}
function waitAuth(cb, ms){                            /* 等运行时给出登录态再回调 */
  var deadline=Date.now()+(ms||3000);
  (function tick(){
    var a=authProbed();
    if(a!==0 || Date.now()>deadline){ cb(a===0?-1:a); return; }
    setTimeout(tick, 250);
  })();
}
function localModeHint(){
  setSyncState('off','本地模式 · 未登录');

  }
}

/* =========================================================
   云同步 · 单个 JSON 文件（GitHub Gist）
   ---------------------------------------------------------
   数据本来就是一整块 JSON，这里只做「读写远端一个文件」：
   不拆表、不逐条 diff、不依赖 WorkBuddy 登录。
   ========================================================= */
var CLOUD_FILE_NAME = 'growth-workspace.json';
var CLOUD_CFG_KEY = 'wb_cloud_sync_v1';

function cloudCfg(){
  try{ return JSON.parse(localStorage.getItem(CLOUD_CFG_KEY) || 'null') || null; }catch(e){ return null; }
}
function cloudCfgSet(cfg){
  try{
    if(cfg && cfg.token) localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cfg));
    else localStorage.removeItem(CLOUD_CFG_KEY);
  }catch(e){}
}
function cloudHasCfg(){ var c = cloudCfg(); return !!(c && c.token); }
function cloudBase(){
  var c = cloudCfg();
  return Number(c && c.syncedAt) || 0;
}
function cloudMarkSynced(ts){
  _cloudDirty = false;     /* 已对齐云端 */
  var c = cloudCfg();
  if(!c) return;
  c.syncedAt = ts || Date.now();
  cloudCfgSet(c);
}
function cloudTime(ts){
  if(!ts) return '';
  var d = new Date(ts), now = new Date();
  var hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  if(d.toDateString() === now.toDateString()) return '今天 ' + hm;
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
}

function cloudPayload(){
  return JSON.stringify({
    app: 'growth-workbench',
    version: 1,
    updatedAt: Date.now(),
    data: { tasks: S.tasks, projects: S.projects, meetings: S.meetings, flows: S.flows, std: S.std, reviews: S.reviews, study: S.study }
  });
}
function cloudApply(remote){
  var d = remote && remote.data;
  if(!d) return false;
  S.tasks    = Array.isArray(d.tasks)    ? d.tasks    : [];
  S.projects = Array.isArray(d.projects) ? d.projects : [];
  S.meetings = Array.isArray(d.meetings) ? d.meetings : [];
  S.flows    = (Array.isArray(d.flows) && d.flows.length) ? d.flows : defaultFlows();
  if(Array.isArray(d.std) && d.std.length) S.std = d.std;
  S.reviews  = Array.isArray(d.reviews) ? d.reviews : [];
  S.study    = (d.study && typeof d.study==='object') ? d.study : { papers:[], scores:[], wrongs:[] };
  migrate();
  saveNow();
  renderAll();
  return true;
}

function cloudHeaders(write){
  var c = cloudCfg() || {};
  var h = {
    'Accept': 'application/vnd.github+json',
    'Authorization': 'Bearer ' + c.token,
    'X-GitHub-Api-Version': '2022-11-28'
  };
  if(write) h['Content-Type'] = 'application/json';
  return h;
}
function cloudFail(msg, status){
  var e = new Error(msg);
  e.status = status || 0;
  return e;
}
function cloudHttpError(status){
  if(status === 401) return cloudFail('Token 无效或已过期，请重新填写', 401);
  if(status === 403) return cloudFail('GitHub 拒绝请求（权限不足或触发限流）', 403);
  if(status === 404) return cloudFail('找不到这个 Gist：ID 写错了，或 token 没有 Gists 权限', 404);
  return cloudFail('GitHub 返回 HTTP ' + status, status);
}

async function cloudRead(){
  var c = cloudCfg();
  if(!c || !c.token || !c.gistId) return null;
  var res = await fetch('https://api.github.com/gists/' + encodeURIComponent(c.gistId), { headers: cloudHeaders(false), cache: 'no-store' });
  if(!res.ok) throw cloudHttpError(res.status);
  var g = await res.json();
  var f = g.files && g.files[CLOUD_FILE_NAME];
  if(!f) return null;
  var text = f.content;
  if(f.truncated && f.raw_url){
    var raw = await fetch(f.raw_url, { headers: cloudHeaders(false), cache: 'no-store' });
    text = await raw.text();
  }
  try{ return JSON.parse(text); }catch(e){ return null; }
}

async function cloudWrite(text){
  var c = cloudCfg();
  if(!c || !c.token) throw cloudFail('还没有配置 GitHub Token', 0);
  var files = {};
  files[CLOUD_FILE_NAME] = { content: text };

  if(!c.gistId){
    var res = await fetch('https://api.github.com/gists', {
      method: 'POST',
      headers: cloudHeaders(true),
      body: JSON.stringify({ description: 'XCX工作台 · 云同步数据', public: false, files: files })
    });
    if(!res.ok) throw cloudHttpError(res.status);
    var g = await res.json();
    c.gistId = g.id;
    cloudCfgSet(c);
    return g.id;
  }

  var res2 = await fetch('https://api.github.com/gists/' + encodeURIComponent(c.gistId), {
    method: 'PATCH',
    headers: cloudHeaders(true),
    body: JSON.stringify({ files: files })
  });
  if(!res2.ok) throw cloudHttpError(res2.status);
  return c.gistId;
}

var _cloudBusy = false;
var _cloudDirty = false;   /* 本机有未推送到云端的改动 */
var _cloudTimer = null;

async function cloudSync(manual){
  if(_cloudBusy) return;
  var c = cloudCfg();
  if(!c || !c.token){
    if(manual) openCloudSettings();
    else setSyncState('off', '本地模式 · 可开启云同步');
    return;
  }
  _cloudBusy = true;
  setSyncState('syncing', '同步中…');
  try{
    var payload = cloudPayload();

    if(!c.gistId){
      await cloudWrite(payload);
      cloudMarkSynced(JSON.parse(payload).updatedAt);
      setSyncState('ok', '云同步已开启');
      if(manual) toast('云端文件已创建，同步开启');
      return;
    }

    var remote = await cloudRead();
    var rAt = remote ? (Number(remote.updatedAt) || 0) : 0;
    var base = cloudBase();

    if(remote && rAt > base + 1200){
      /* 两端都有新改动：快照同步无法合并，绝不静默覆盖任何一边，交给用户手动裁决 */
      if(!manual && _cloudDirty){
        setSyncState('off', '两端都有改动 · 点「立即同步」处理');
        return;
      }
      var takeRemote = true;
      if(manual){
        takeRemote = confirm('云端有更新的数据（' + cloudTime(rAt) + '）。\n\n点「确定」= 载入云端，覆盖本机\n点「取消」= 用本机数据覆盖云端');
      }
      if(takeRemote){
        cloudApply(remote);
        cloudMarkSynced(rAt);
        setSyncState('ok', '已载入云端 · ' + cloudTime(rAt));
        if(manual) toast('已载入云端最新数据');
        return;
      }
    }

    await cloudWrite(payload);
    cloudMarkSynced(JSON.parse(payload).updatedAt);
    setSyncState('ok', '云端已同步 · ' + cloudTime(Date.now()));
    if(manual) toast('同步完成');
  }catch(e){
    setSyncState('off', '同步失败');
    toast(e && e.message ? e.message : '同步失败');
    if(manual && e && e.status === 401) openCloudSettings();
  }finally{
    _cloudBusy = false;
  }
}

/* 每次 save() 后防抖推送 */
function cloudQueue(instant){
  clearTimeout(_cloudTimer);
  _cloudDirty = true;      /* 本机产生未同步改动 */
  if(!cloudHasCfg()) return;
  _cloudTimer = setTimeout(function(){ cloudSync(false); }, instant ? 800 : 2500);
}

window.__SYNC_ALL__ = function(){ cloudSync(true); };
window.__WIPE__ = function(cb){
  if(!cloudHasCfg() || !cloudCfg().gistId){ if(cb) cb(); return; }
  cloudWrite(cloudPayload()).then(function(){
    cloudMarkSynced(Date.now());
    if(cb) cb();
  }).catch(function(){ if(cb) cb(); });
};

  setTimeout(function(){
    pwaTip(
      '<div class="pt-i">' + ic('download') + '</div>' +
      '<div class="pt-t"><b>装到桌面，用起来像 App</b><span>全屏打开，断网也能看</span></div>' +

      '<button class="ico-btn" type="button" aria-label="关闭" onclick="pwaTipClose()">' + ic('x') + '</button>'
    );
  }, 1200);
});
