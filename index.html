<style data-page-node-id="TPUlCK2oGLm9vrfPHx7GrX" data-pnid-children="QcKmIE6tcmMwDFPhm4E777">
:root{
  --bg:#f4f8f8; --bg-2:#eef4f4; --surface:#fff;
  --line:#e2ebeb; --line-soft:#edf3f3;
  --text:#0e2b29; --text-2:#476663; --text-3:#8aa3a1; --text-4:#a9bebd;
  --accent:#0d9488; --accent-dark:#0b7f74; --accent-deep:#075e56;
  --accent-soft:#e4f4f1; --accent-soft2:#f1fafa;
  --cyan:#0e93b5; --cyan-soft:#e5f3f8;
  --amber:#b07309; --amber-soft:#fdf4e3;
  --violet:#6d55c8; --violet-soft:#f0ecfb;
  --danger:#d13b38; --danger-soft:#fdeceb; --danger-line:#f4c6c5;
  --warn:#a86206; --warn-soft:#fdf4e6; --warn-line:#f0dcb2;
  --radius:14px; --radius-sm:10px; --radius-xs:8px;
  --sh-1:0 1px 2px rgba(10,50,46,.05);
  --sh-2:0 1px 2px rgba(10,50,46,.04), 0 4px 14px rgba(10,50,46,.045);
  --sh-3:0 2px 4px rgba(10,50,46,.05), 0 12px 32px rgba(10,50,46,.07);
  --sh-4:0 20px 50px rgba(8,42,39,.16);
  --nav-w:250px;
  --serif:ui-serif,"Songti SC","Georgia","Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
svg{width:16px;height:16px;flex:0 0 auto;display:inline-block;vertical-align:middle}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#cfdedd;border-radius:9px;border:3.5px solid var(--bg);background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#b9cfcd;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ Layout ============ */
.app{display:flex;min-height:100vh}
.nav{
  width:var(--nav-w);flex:0 0 var(--nav-w);
  background:linear-gradient(180deg,#fff 0%,#fbfdfd 60%,#f7fbfb 100%);
  border-right:1px solid var(--line);
  padding:22px 14px 18px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px 18px;border-bottom:1px solid var(--line-soft)}
.brand-mark{
  width:36px;height:36px;border-radius:11px;flex:0 0 36px;
  background:linear-gradient(145deg,#12a89a 0%,var(--accent) 45%,#0b7fa0 100%);
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 3px 10px rgba(13,148,136,.32), inset 0 1px 0 rgba(255,255,255,.28);
}
.brand-mark svg{width:19px;height:19px}
.brand-t{font-weight:660;font-size:15px;letter-spacing:.1px;line-height:1.25}
.brand-s{font-size:11.5px;color:var(--text-3);margin-top:1px;letter-spacing:.2px}
.nav-scroll{overflow-y:auto;overflow-x:hidden;flex:1;margin:0 -4px;padding:0 4px}
.nav-group{margin-top:16px}
.nav-group:first-child{margin-top:12px}
.nav-gh{
  display:flex;align-items:center;gap:7px;padding:0 9px 6px;
  font-size:10.5px;font-weight:700;color:var(--text-4);letter-spacing:1.2px;text-transform:uppercase;
}
.nav-gh .bar{flex:1;height:1px;background:var(--line-soft)}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;position:relative;
  padding:9px 10px;border-radius:var(--radius-sm);margin-bottom:2px;
  color:var(--text-2);font-weight:520;text-align:left;font-size:13.5px;
  transition:background .16s ease,color .16s ease;
}
.nav-item:hover{background:var(--accent-soft2);color:var(--text)}
.nav-item.on{background:var(--accent-soft);color:var(--accent-deep);font-weight:650}
.nav-item.on::before{
  content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--accent);
}
.nav-item.on svg{color:var(--accent)}
.nav-item svg{width:16px;height:16px;color:var(--text-3);transition:color .16s}
.nav-item:hover svg{color:var(--accent-dark)}
.nav-count{
  margin-left:auto;font-size:11px;font-weight:700;min-width:20px;text-align:center;
  padding:1px 6px;border-radius:20px;background:var(--bg-2);color:var(--text-2);
}
.nav-item.on .nav-count{background:#fff;color:var(--accent-deep)}
.nav-count.hot{background:var(--danger);color:#fff;box-shadow:0 1px 4px rgba(209,59,56,.3)}
.nav-count.zero{display:none}
.nav-soon{
  margin-left:auto;font-size:9.5px;font-weight:700;color:var(--text-4);
  padding:1px 5px;border-radius:20px;border:1px solid var(--line);letter-spacing:.3px;
}
.nav-foot{margin-top:12px;padding:12px 10px 0;border-top:1px solid var(--line-soft);font-size:11px;color:var(--text-4);line-height:1.7}
.sync-line{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--text-3)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text-4);flex:0 0 6px}
.sync-line.ok .sync-dot{background:var(--accent);box-shadow:0 0 0 3px rgba(13,148,136,.14)}
.sync-line.syncing .sync-dot{background:var(--amber);box-shadow:0 0 0 3px rgba(176,115,9,.14);animation:pulse 1.2s infinite}
.sync-line.off .sync-dot{background:var(--text-4)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.main{flex:1;min-width:0;padding:26px 34px 80px;max-width:1180px}

/* ============ 顶部子板块 Tab ============ */
.tabs{display:flex;gap:2px;background:var(--bg-2);padding:3px;border-radius:var(--radius-sm);margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 0 auto;min-width:0;padding:8px 13px;border-radius:7px;font-size:13px;font-weight:600;
  color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:.15s;
}
.tab svg{width:15px;height:15px;color:var(--text-3);transition:color .16s}
.tab:hover{color:var(--text)}
.tab:hover svg{color:var(--accent-dark)}
.tab.on{background:var(--surface);color:var(--accent-deep);font-weight:660;box-shadow:0 1px 3px rgba(10,50,46,.1)}
.tab.on svg{color:var(--accent)}
.tab .n{font-size:10.5px;font-weight:700;background:var(--bg-2);color:var(--text-3);border-radius:20px;padding:0 5px;min-width:17px;text-align:center;line-height:16px}
.tab.on .n{background:var(--accent-soft);color:var(--accent-deep)}

/* ============ Topbar ============ */
.topbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{margin:0;font-size:22px;font-weight:660;letter-spacing:-.35px;line-height:1.3}
.topbar .sub{font-size:12.5px;color:var(--text-3);margin-top:4px;line-height:1.6}
.topbar-act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ============ Buttons ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8.5px 14px;border-radius:var(--radius-sm);font-weight:600;font-size:13px;
  background:var(--surface);border:1px solid var(--line);color:var(--text-2);
  transition:border-color .15s,background .15s,color .15s,box-shadow .15s,transform .1s;
  white-space:nowrap;box-shadow:var(--sh-1);letter-spacing:.1px;
}
.btn:hover{border-color:#c3d8d6;color:var(--text);box-shadow:var(--sh-2)}
.btn:active{transform:translateY(.5px)}
.btn svg{width:15px;height:15px}
.btn-primary{
  background:linear-gradient(180deg,#12a094,var(--accent-dark));
  border-color:var(--accent-dark);color:#fff;
  box-shadow:0 1px 2px rgba(11,127,116,.2),0 4px 12px rgba(11,127,116,.22),inset 0 1px 0 rgba(255,255,255,.16);
}
.btn-primary:hover{background:linear-gradient(180deg,var(--accent-dark),var(--accent-deep));border-color:var(--accent-deep);color:#fff;box-shadow:0 2px 4px rgba(11,127,116,.24),0 7px 18px rgba(11,127,116,.28),inset 0 1px 0 rgba(255,255,255,.16)}
.btn-danger{color:var(--danger);border-color:var(--danger-line);background:var(--surface)}
.btn-danger:hover{background:var(--danger-soft);color:var(--danger);border-color:#eaa9a7}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:var(--radius-xs)}
.btn-sm svg{width:13.5px;height:13.5px}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--text-3)}
.btn-ghost:hover{background:var(--bg-2);border-color:transparent;color:var(--text-2)}

/* ============ Card ============ */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--sh-2);margin-bottom:18px;overflow:hidden;transition:box-shadow .22s ease;
}
.card:hover{box-shadow:var(--sh-3)}
.card-h{
  display:flex;align-items:center;gap:10px;padding:14px 20px;flex-wrap:wrap;
  border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg,#fdfefe,#fafcfc);
}
.card-h > svg{width:17px;height:17px;color:var(--accent);flex:0 0 17px}
.card-h h2{margin:0;font-size:14.5px;font-weight:660;letter-spacing:-.1px}
.card-h .hint{font-size:11.5px;color:var(--text-4);font-weight:500}
.card-h .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:18px 20px}
.card-b.tight{padding:4px 20px 12px}

/* ============ Focus banner ============ */
.focus{
  border:1px solid var(--danger-line);border-radius:var(--radius);margin-bottom:18px;
  box-shadow:0 1px 2px rgba(180,50,46,.05),0 6px 20px rgba(180,50,46,.08);overflow:hidden;
  background:linear-gradient(180deg,#fffbfb,#fff);
}
.focus.clear{
  border-color:#cfe8e4;background:linear-gradient(180deg,var(--accent-soft2),#fff);
  box-shadow:0 1px 2px rgba(10,90,82,.04),0 6px 20px rgba(10,90,82,.06);
}
.focus-h{
  display:flex;align-items:center;gap:10px;padding:14px 20px;
  border-bottom:1px solid var(--danger-line);
  background:linear-gradient(180deg,rgba(209,59,56,.05),transparent);
}
.focus.clear .focus-h{border-color:#dcece9;background:linear-gradient(180deg,rgba(13,148,136,.05),transparent)}
.focus-h h2{margin:0;font-size:15px;font-weight:700;color:var(--danger);letter-spacing:-.1px}
.focus.clear .focus-h h2{color:var(--accent-deep)}
.focus-h > svg{width:18px;height:18px;color:var(--danger);flex:0 0 18px}
.focus.clear .focus-h > svg{color:var(--accent)}
.focus-h .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.focus-b{padding:2px 20px 12px}
.frow{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.frow:last-child{border-bottom:none}
.frow .ft{flex:1;min-width:0}
.frow .ft b{font-weight:600;display:block;word-break:break-word;font-size:13.8px;letter-spacing:-.05px}
.frow .ft span{font-size:12px;color:var(--text-2);display:block;margin-top:3px;word-break:break-word;line-height:1.6}
.frow .fa{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--danger);margin-top:8px;flex:0 0 6px;box-shadow:0 0 0 3px rgba(209,59,56,.13)}
.allclear{display:flex;align-items:center;gap:9px;padding:12px 0;color:var(--text-2);font-size:13px}
.allclear svg{width:17px;height:17px;color:var(--accent)}

/* ============ Pills ============ */
.pill{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:650;
  padding:2.5px 9px;border-radius:20px;background:var(--bg-2);color:var(--text-2);
  white-space:nowrap;letter-spacing:.1px;line-height:1.6;
}
.pill svg{width:11px;height:11px}
.pill.red{background:var(--danger-soft);color:var(--danger);box-shadow:inset 0 0 0 1px rgba(209,59,56,.13)}
.pill.teal{background:var(--accent-soft);color:var(--accent-deep);box-shadow:inset 0 0 0 1px rgba(13,148,136,.13)}
.pill.cyan{background:var(--cyan-soft);color:#0a6f8c;box-shadow:inset 0 0 0 1px rgba(14,147,181,.13)}
.pill.warn{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(168,98,6,.13)}
.pill.amber{background:var(--amber-soft);color:var(--amber);box-shadow:inset 0 0 0 1px rgba(176,115,9,.13)}
.pill.violet{background:var(--violet-soft);color:var(--violet);box-shadow:inset 0 0 0 1px rgba(109,85,200,.13)}
.pill.gray{background:#f0f5f5;color:var(--text-3)}
/* 可点击直接改的胶囊（项目状态 / 阶段） */
.pill-sel{position:relative;cursor:pointer;padding-right:18px;-webkit-tap-highlight-color:transparent;transition:filter .15s}
.pill-sel:hover{filter:brightness(.965)}
.pill-sel select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;background:transparent;background-image:none !important;
  border:0;margin:0;padding:0;width:auto;min-height:0;
  font:inherit;font-size:inherit;font-weight:inherit;letter-spacing:inherit;line-height:inherit;color:inherit;
  cursor:pointer;max-width:108px;text-overflow:ellipsis;outline:none;text-align-last:left;
}
.pill-sel select::-ms-expand{display:none}
.pill-sel select option{color:var(--text);background:var(--surface);font-weight:600}
.pill-sel::after{
  content:'';position:absolute;right:6.5px;top:50%;width:4.5px;height:4.5px;
  border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  transform:translateY(-72%) rotate(45deg);opacity:.5;pointer-events:none;
}
.pill-sel:focus-within{box-shadow:0 0 0 3px rgba(13,148,136,.14)}
@media (max-width:860px){
  .pill-sel{padding-top:5px;padding-bottom:5px;padding-right:19px}
  .pill-sel select{max-width:120px}
}
.p0{background:#fdeceb;color:#bd302d;box-shadow:inset 0 0 0 1px rgba(189,48,45,.14)}
.p1{background:var(--warn-soft);color:#96580a;box-shadow:inset 0 0 0 1px rgba(150,88,10,.14)}
.p2{background:var(--cyan-soft);color:#0a6f8c;box-shadow:inset 0 0 0 1px rgba(10,111,140,.13)}

/* ============ Forms ============ */
.form{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.grow{flex:1 1 220px}
.f.auto{flex:0 0 auto}
.f label{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.5px;text-transform:uppercase}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;padding:9.5px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:#fcfefe;outline:none;transition:border-color .15s,box-shadow .15s,background .15s;
}
input[type=text]:hover,input[type=date]:hover,input[type=number]:hover,select:hover,textarea:hover{border-color:#cfdedd}
textarea{resize:vertical;min-height:74px;line-height:1.68}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3.5px rgba(13,148,136,.1)}
input::placeholder,textarea::placeholder{color:var(--text-4)}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238aa3a1' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px}

/* ============ Segmented ============ */
.seg{display:inline-flex;background:var(--bg-2);border-radius:var(--radius-sm);padding:3px;gap:2px}
.seg button{padding:5.5px 13px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text-2);transition:.15s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--accent-deep);box-shadow:0 1px 3px rgba(10,50,46,.1)}

/* ============ Task list ============ */
.list{display:flex;flex-direction:column}
.item{
  display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);
  align-items:flex-start;position:relative;transition:background .15s;
}
.item:last-child{border-bottom:none}
.item::before{content:"";position:absolute;left:-20px;top:11px;bottom:11px;width:2.5px;border-radius:0 3px 3px 0;background:transparent}
.item.pr0::before{background:#d9403c}
.item.pr1::before{background:#dc8a12}
.item.pr2::before{background:var(--cyan)}
.item.done::before{background:#dbe7e6}
.item.od{background:linear-gradient(90deg,rgba(209,59,56,.075),rgba(209,59,56,.025) 55%,transparent 82%);margin:0 -20px;padding:12px 20px}
.item.od::before{left:0}
.item.od .it-title{color:#bd302d}
.item.done .it-title{text-decoration:line-through;text-decoration-color:var(--text-4);color:var(--text-3)}
.chk{
  width:20px;height:20px;flex:0 0 20px;border:1.8px solid #c2d6d5;border-radius:6px;margin-top:2px;
  display:flex;align-items:center;justify-content:center;background:#fff;transition:.16s;
}
.chk:hover{border-color:var(--accent);background:var(--accent-soft2);transform:scale(1.06)}
.chk.on{background:linear-gradient(180deg,#12a096,var(--accent-dark));border-color:var(--accent-dark);box-shadow:0 1px 4px rgba(13,148,136,.3)}
.chk svg{width:12.5px;height:12.5px;color:#fff;opacity:0;stroke-width:3.6}
.chk.on svg{opacity:1}
.it-main{flex:1;min-width:0}
.it-title{font-weight:545;word-break:break-word;font-size:13.9px;letter-spacing:-.05px;line-height:1.55}
.it-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px}
.it-act{display:flex;gap:3px;flex-shrink:0;align-items:center}
.sn-btn{gap:4px;padding:5px 9px;font-size:11.8px;font-weight:650;color:var(--text-2);box-shadow:none;background:var(--bg-2);border-color:transparent}
.sn-btn:hover{background:var(--accent-soft2);color:var(--accent-deep);border-color:var(--accent)}
.sn-btn svg{width:12px;height:12px}
.ico-btn{width:31px;height:31px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;color:var(--text-4);transition:.15s}
.ico-btn:hover{background:var(--bg-2);color:var(--text-2)}
.ico-btn.red:hover{background:var(--danger-soft);color:var(--danger)}
.ico-btn svg{width:15px;height:15px}

/* ============ Date group ============ */
.dgroup{margin-bottom:4px}
.dgroup-h{display:flex;align-items:center;gap:9px;padding:11px 0 6px}
.dg-d{font-size:12.5px;font-weight:700;color:var(--accent-deep)}
.dg-x{font-size:11.5px;color:var(--text-4)}
.dg-n{margin-left:auto;font-size:11px;font-weight:650;color:var(--text-3);background:var(--bg-2);padding:1.5px 8px;border-radius:20px}
.dgroup .list{border-left:2px solid var(--line-soft);padding-left:13px;margin-left:2px}
.dgroup .item::before{display:none}

/* ============ Project ============ */
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.proj{
  border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 13px;
  background:linear-gradient(180deg,#fff,#fcfefe);box-shadow:var(--sh-1);
  display:flex;flex-direction:column;gap:9px;transition:box-shadow .18s,border-color .18s;
}
.proj:hover{box-shadow:var(--sh-2);border-color:#d5e5e3}
.proj-top{display:flex;align-items:flex-start;gap:9px}
.proj-name{font-weight:660;font-size:14.2px;letter-spacing:-.15px;flex:1;min-width:0;word-break:break-word;line-height:1.45}
.proj-row{display:flex;gap:7px;font-size:12.3px;color:var(--text-2);line-height:1.6;word-break:break-word}
.proj-row .k{flex:0 0 46px;color:var(--text-4);font-weight:650;font-size:11px;padding-top:1px;letter-spacing:.2px}
.proj-row.blocker{color:#9a4a10;background:var(--warn-soft);border-radius:8px;padding:6px 9px}
.proj-row.blocker .k{color:var(--warn)}
.proj-bar{margin-top:2px}
.proj-bar .pb-t{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-bottom:4px;font-weight:600}
.pb{height:5px;border-radius:9px;background:var(--bg-2);overflow:hidden}
.pb > i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#12a89a,var(--accent));transition:width .35s}
.proj-foot{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line-soft)}
.proj-tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.cat-tag{font-size:10.5px;font-weight:700;letter-spacing:.2px;padding:2.5px 7px;border-radius:6px;background:var(--bg-2);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.cat-tag.jsfj{background:#edf5fe;color:#1f6fb2;box-shadow:inset 0 0 0 1px #d3e4f8}
.cat-tag.jsgj{background:#edf8f1;color:#1d855a;box-shadow:inset 0 0 0 1px #d0e9db}
.cat-tag.shgj{background:#fdf3ec;color:#b0602a;box-shadow:inset 0 0 0 1px #f3ddcc}
.cat-tag.shfj{background:#f3f0fd;color:#6d55c8;box-shadow:inset 0 0 0 1px #ded5f6}
.flow{background:var(--accent-soft2);border:1px solid #daebe8;border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:6px}
.flow-h{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3);font-weight:650;letter-spacing:.2px}
.flow-h b{color:var(--accent-deep);font-size:11.5px;font-weight:700}
.flow-cur{display:flex;align-items:baseline;gap:6px;font-size:12.8px;font-weight:650;color:var(--text);line-height:1.5;word-break:break-word}
.flow-cur i{font-style:normal;flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--accent-deep);background:#fff;border-radius:5px;padding:1px 5px;box-shadow:inset 0 0 0 1px #cfe8e4}
.flow-note{font-size:11.6px;color:var(--text-3);line-height:1.55}
.flow-done{font-size:12.2px;color:var(--accent-deep);font-weight:650;display:flex;align-items:center;gap:5px}
.flow-done svg{width:13px;height:13px}
.fl-bar{height:4px;border-radius:9px;background:#e2efed;overflow:hidden}
.fl-bar > i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#5cc9b9,var(--accent));transition:width .35s}
.grp{margin-bottom:16px}
.grp:last-child{margin-bottom:0}
.grp-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--text-2);margin:0 0 10px;letter-spacing:.2px}
.grp-h .n{font-size:11px;font-weight:700;color:var(--text-3);background:var(--bg-2);border-radius:20px;padding:1px 7px}
.grp-h i{flex:1;height:1px;background:var(--line);font-style:normal}
.seg.wrap{flex-wrap:wrap}
.sel-sm{padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text-2);width:auto}
.flow-tip{font-size:11.8px;color:var(--text-3);background:var(--bg-2);border-radius:9px;padding:9px 11px;line-height:1.7;margin-top:2px}
.flow-tip b{color:var(--text-2)}
.steps-editor{min-height:190px;font-family:var(--serif);font-size:13.5px;line-height:1.9}
/* 线路步骤：一行一步的编辑 */
.step-rows{display:flex;flex-direction:column;gap:6px}
.step-row{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,.92fr) 22px 22px 22px;gap:6px;align-items:center}
.step-row .sr-n{font-size:10.5px;font-weight:750;color:var(--text-4);text-align:center;line-height:1}
.step-row input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12.8px;color:var(--text);min-width:0}
.step-row input.sr-d{color:var(--text-3);font-size:12.2px}
.step-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,148,136,.1);outline:none}
.step-row input::placeholder{color:var(--text-4)}
.sr-mv,.sr-del{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--text-4);background:var(--bg-2);transition:background .15s,color .15s}
.sr-mv svg,.sr-del svg{width:12px;height:12px}
.sr-mv:hover,.sr-del:hover{background:var(--accent-soft);color:var(--accent-deep)}
.sr-del:hover{background:var(--danger-soft);color:var(--danger)}
.sr-mv[disabled]{opacity:.28;pointer-events:none}
.sr-add{margin-top:2px;align-self:flex-start;display:inline-flex;align-items:center;gap:4px;padding:6px 11px;
  border:1px dashed #cfe0de;border-radius:8px;font-size:12px;font-weight:650;color:var(--accent-deep);background:#fff;transition:.15s}
.sr-add:hover{background:var(--accent-soft2);border-color:var(--accent)}
.sr-add svg{width:13px;height:13px}
@media (max-width:640px){
  .step-row{grid-template-columns:20px minmax(0,1fr) 30px;grid-template-areas:"n nm del" "n d del";row-gap:5px}
  .step-row .sr-n{grid-area:n}
  .step-row .sr-nm{grid-area:nm}
  .step-row .sr-d{grid-area:d}
  .step-row .sr-mv{display:none}
  .step-row .sr-del{grid-area:del;align-self:center;width:30px;height:30px;border-radius:8px}
  .step-row input{padding:9px 10px;font-size:16px;min-height:40px}
  .tk-st{padding:5px 9px 5px 5px;font-size:12px}
  .tk-exp{padding:7px 10px;font-size:11.5px}
}

/* ============ Meeting ============ */
.meet{border-bottom:1px solid var(--line-soft);padding:14px 0}
.meet:last-child{border-bottom:none}
.meet-h{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.meet-t{font-weight:650;font-size:14px;flex:1;min-width:0;word-break:break-word}
.meet-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.meet-body{margin-top:9px;display:flex;flex-direction:column;gap:7px}
.mb{font-size:12.8px;color:var(--text-2);line-height:1.7;word-break:break-word}
.mb b{color:var(--text-3);font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;display:block;margin-bottom:2px}
.mb.todo{background:var(--accent-soft2);border:1px solid #d9ece9;border-radius:9px;padding:9px 11px}
.mb.todo .td{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12.8px}
.mb.todo .td svg{width:13px;height:13px;color:var(--accent);flex:0 0 13px}
.mb.todo .td span{flex:1;min-width:0;word-break:break-word}

/* ============ Stats ============ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 17px;box-shadow:var(--sh-1);
}
.stat .lb{font-size:11.5px;color:var(--text-3);font-weight:650;letter-spacing:.3px;display:flex;align-items:center;gap:5px}
.stat .lb svg{width:13px;height:13px}
.stat .n{font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1.15;margin-top:6px;color:var(--text)}
.stat .n small{font-size:13px;font-weight:600;color:var(--text-3);letter-spacing:0;margin-left:2px}
.stat .d{font-size:11.5px;color:var(--text-3);margin-top:2px}
.stat.red .n{color:var(--danger)}
.stat.teal .n{color:var(--accent-deep)}

.chart-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart-box{border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:14px 16px;background:#fcfefe}
.chart-box h3{margin:0 0 12px;font-size:12.5px;font-weight:700;color:var(--text-2);letter-spacing:.2px}
.bar-row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.bar-row .bl{flex:0 0 78px;font-size:11.5px;color:var(--text-2);font-weight:650;display:flex;align-items:center;gap:5px}
.bar-row .bt{flex:1;height:8px;border-radius:9px;background:var(--bg-2);overflow:hidden}
.bar-row .bt > i{display:block;height:100%;border-radius:9px;transition:width .4s}
.bar-row .bn{flex:0 0 26px;text-align:right;font-size:11.5px;font-weight:700;color:var(--text-2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--text-2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:3px;display:block}

/* ============ Empty ============ */
.empty{text-align:center;padding:34px 16px;color:var(--text-3)}
.empty svg{width:38px;height:38px;color:#cfe0de;margin-bottom:10px}
.empty b{display:block;color:var(--text-2);font-size:13.5px;font-weight:600;margin-bottom:4px}
.empty span{font-size:12.3px;line-height:1.7}
.empty .btn{margin-top:14px}

/* ============ Modal ============ */
.mask{position:fixed;inset:0;background:rgba(8,42,39,.34);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .16s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:16px;padding:22px;width:100%;max-width:520px;max-height:88vh;overflow:auto;
  box-shadow:var(--sh-4);animation:min .2s;
}
.modal.wide{max-width:640px}
@keyframes min{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 6px;font-size:16.5px;font-weight:660;letter-spacing:-.2px}
.modal p{margin:0 0 16px;font-size:13px;color:var(--text-2);line-height:1.7}
.modal .ma{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal .form{flex-direction:column;align-items:stretch;gap:13px}
.modal .form .f{width:100%}
.modal .form .row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.exp-opt{
  display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
  border-radius:var(--radius-sm);margin-bottom:9px;width:100%;text-align:left;
  transition:border-color .15s,background .15s,box-shadow .15s;background:#fff;
}
.exp-opt:hover{border-color:var(--accent);background:var(--accent-soft2);box-shadow:var(--sh-1)}
.exp-opt .ei{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:var(--accent-soft);color:var(--accent-deep);display:flex;align-items:center;justify-content:center}
.exp-opt .ei svg{width:16px;height:16px}
.exp-opt .et{flex:1;min-width:0}
.exp-opt .et b{display:block;font-size:13.2px;font-weight:650}
.exp-opt .et span{display:block;font-size:11.5px;color:var(--text-3);margin-top:2px;line-height:1.55}
.exp-note{font-size:11.5px;color:var(--text-3);line-height:1.7;background:var(--bg-2);border-radius:9px;padding:10px 12px;margin-top:4px}
.exp-note b{color:var(--accent-deep)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ============ Toast ============ */
.toasts{position:fixed;right:20px;bottom:20px;z-index:85;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{
  background:#0e2b29;color:#fff;padding:10px 16px;border-radius:11px;font-size:13px;font-weight:550;
  box-shadow:0 8px 26px rgba(8,42,39,.28);display:flex;align-items:center;gap:8px;max-width:340px;
  animation:tin .22s;line-height:1.5;
}
.toast svg{width:15px;height:15px;flex:0 0 15px;color:#6ee7d8}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ Soon page ============ */
.soon{text-align:center;padding:56px 22px;border:1px dashed #d5e5e3;border-radius:var(--radius);background:linear-gradient(180deg,#fcfefe,#f9fcfc)}
.soon .si{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.soon .si svg{width:26px;height:26px}
.soon h2{margin:0 0 8px;font-size:17px;font-weight:660}
.soon p{margin:0 auto;max-width:420px;font-size:13px;color:var(--text-2);line-height:1.75}
.soon ul{display:inline-block;text-align:left;margin:16px 0 0;padding:0;list-style:none;font-size:12.8px;color:var(--text-2)}
.soon ul li{padding:4px 0;display:flex;gap:8px;align-items:flex-start}
.soon ul li svg{width:14px;height:14px;color:var(--accent);margin-top:3px;flex:0 0 14px}
.soon .tagline{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-size:11.5px;font-weight:650;color:var(--accent-deep);background:var(--accent-soft);padding:5px 12px;border-radius:20px}

/* ============ Mobile ============ */
@media (max-width:860px){
  .app{flex-direction:column}
  .nav{
    position:sticky;top:0;z-index:50;width:100%;height:auto;flex:none;
    border-right:none;border-bottom:1px solid var(--line);padding:10px 12px 9px;
    background:rgba(255,255,255,.96);
    backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
    box-shadow:0 1px 12px rgba(10,50,46,.06);
  }
  .brand{padding:0 2px 9px;border-bottom:none}
  .brand-s{display:none}
  .nav-scroll{
    display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;margin:0 -12px;padding:0 12px 2px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;flex:none;
  }
  .nav-scroll::-webkit-scrollbar{display:none}
  .nav-group{margin:0;display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .nav-gh{padding:0;margin:0;writing-mode:horizontal-tb;font-size:10px;white-space:nowrap;color:var(--text-4)}
  .nav-scroll > .nav-gh{display:none}
  .nav-gh .bar{display:none}
  .nav-item{
    width:auto;flex:0 0 auto;padding:9px 13px;min-height:42px;font-size:13px;margin-bottom:0;
    border:1px solid var(--line);background:#fff;
  }
  .nav-item.on{border-color:transparent}
  .nav-item.on::before{display:none}
  .nav-soon{display:none}
  .nav-foot{display:none}
  .main{padding:16px 14px 64px;max-width:100%}
  .tabs{margin:-4px 0 14px}
  .tab{padding:9px 12px;font-size:12.5px;flex:1 0 auto}
  .tab svg{width:14px;height:14px}
  .topbar h1{font-size:19.5px}
  .topbar-act{width:100%;margin-left:0;flex-wrap:wrap}
  .topbar-act .btn{flex:1 1 calc(50% - 5px);min-width:calc(50% - 5px);min-height:44px}
  .focus-h,.card-h{flex-wrap:wrap;padding:12px 15px}
  .focus-h .sp,.card-h .sp{margin-left:0;width:100%;margin-top:6px}
  .card-h .hint{width:100%;order:9}
  .focus-b,.card-b{padding-left:15px;padding-right:15px}
  .card-b.tight{padding:4px 15px 10px}
  .item.od{margin:0 -15px;padding:12px 15px}
  .item::before{left:-15px}
  .btn{min-height:44px;padding:11px 16px}
  .btn-sm{min-height:38px;padding:8px 13px;font-size:12.5px}
  .ico-btn{width:38px;height:38px}
  .ico-btn svg{width:17px;height:17px}
  .chk{width:24px;height:24px;flex:0 0 24px}
  .chk svg{width:14px;height:14px}
  input[type=text],input[type=date],input[type=number],select,textarea{padding:12px;font-size:16px;min-height:46px}
  .f.grow,.form .f{flex:1 1 100%}
  .form .btn{width:100%}
  .projs{grid-template-columns:1fr}
  .chart-wrap{grid-template-columns:1fr}
  .dgroup .list{padding-left:10px}
  .toasts{left:14px;right:14px;bottom:14px;align-items:stretch}
  .toast{max-width:100%}
  .modal{padding:18px;border-radius:14px;max-height:92vh}
  .modal .form .row2{grid-template-columns:1fr}
  .frow{flex-wrap:wrap}
  .frow .fa{width:100%;justify-content:flex-start;margin-top:6px}
  .stat .n{font-size:25px}
  .meet-h .sp{width:100%;margin-top:2px}
  .soon{padding:40px 18px}
}
@media (min-width:861px){ .nav-scroll{display:block} }
@media print{ .nav,.topbar-act,.it-act,.ico-btn,.nav-foot{display:none} .card,.focus{box-shadow:none;break-inside:avoid} }

/* ================= App shell（手机形态） ================= */
:root{--mh:52px}
.mtop,.mbar{display:none}

@media (max-width:860px){
  body{overscroll-behavior-y:contain;background:var(--bg)}
  .app{display:block;min-height:100vh;min-height:100dvh}
  .nav{display:none!important}

  /* ---------- 顶部 App Bar ---------- */
  .mtop{
    display:flex;align-items:center;gap:10px;
    position:fixed;left:0;right:0;top:0;z-index:70;
    padding:calc(env(safe-area-inset-top) + 7px) 14px 7px;
    min-height:calc(var(--mh) + env(safe-area-inset-top));
    background:rgba(255,255,255,.9);
    -webkit-backdrop-filter:saturate(180%) blur(16px);
    backdrop-filter:saturate(180%) blur(16px);
    border-bottom:1px solid rgba(226,235,235,.9);
    -webkit-user-select:none;user-select:none;
  }
  .mtop-mark{
    width:30px;height:30px;border-radius:9px;flex:0 0 30px;
    background:linear-gradient(145deg,#12a89a 0%,var(--accent) 45%,#0b7fa0 100%);
    color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(13,148,136,.3),inset 0 1px 0 rgba(255,255,255,.3);
  }
  .mtop-mark svg{width:16px;height:16px}
  .mtop-t{min-width:0;flex:1}
  .mtop-name{font-size:14.5px;font-weight:700;letter-spacing:-.1px;line-height:1.2}
  .mtop-date{font-size:10.5px;color:var(--text-3);line-height:1.35;margin-top:1px}
  .mtop .sync-line{
    margin-left:auto;flex:0 0 auto;max-width:46vw;min-width:0;
    padding:5px 10px;border-radius:20px;background:var(--bg-2);
    font-size:10.5px;font-weight:650;color:var(--text-2);
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
    touch-action:manipulation;
  }
  .mtop .sync-line .sync-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mtop .sync-line:active{background:var(--accent-soft)}

  /* ---------- 底部 Tab ---------- */
  .mbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;
    padding:5px 6px calc(5px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:saturate(180%) blur(16px);
    backdrop-filter:saturate(180%) blur(16px);
    border-top:1px solid var(--line);
    box-shadow:0 -1px 14px rgba(10,50,46,.07);
    -webkit-user-select:none;user-select:none;
  }
  .mbar-i{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;padding:6px 2px 5px;border-radius:12px;position:relative;
    color:var(--text-3);font-size:10px;font-weight:650;letter-spacing:.2px;
    transition:color .16s,background .16s;touch-action:manipulation;
  }
  .mbar-i svg{width:22px;height:22px;stroke-width:1.85;transition:transform .18s}
  .mbar-i span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mbar-i.on{color:var(--accent-deep);background:var(--accent-soft2)}
  .mbar-i.on svg{color:var(--accent);transform:translateY(-1px)}
  .mbar-i:active{background:var(--bg-2);transform:scale(.97)}
  .mbar-dot{position:absolute;top:4px;left:50%;margin-left:5px;width:7px;height:7px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px #fff}

  /* ---------- 内容区 ---------- */
  .main{
    padding:calc(var(--mh) + env(safe-area-inset-top) + 12px) 14px calc(74px + env(safe-area-inset-bottom));
    max-width:100%;
  }
  .tabs{
    position:sticky;top:calc(var(--mh) + env(safe-area-inset-top));
    z-index:50;margin:0 0 14px;
    background:rgba(238,244,244,.92);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }
  .tab{min-height:38px}
  .topbar{margin-bottom:14px}
  .topbar h1{font-size:21px;letter-spacing:-.4px}

  /* 触感反馈 */
  .btn:active{transform:scale(.975)}
  .tab:active,.mbar-i:active,.exp-opt:active,.nav-item:active{background:var(--bg-2)}

  /* ---------- 弹窗 → 底部抽屉 ---------- */
  .mask{align-items:flex-end;padding:0}
  .modal{
    width:100%;max-width:none;
    max-height:88vh;max-height:90dvh;
    border-radius:20px 20px 0 0;
    padding:8px 16px calc(18px + env(safe-area-inset-bottom));
    animation:sheetUp .26s cubic-bezier(.32,.72,0,1);
  }
  .modal::before{
    content:"";display:block;width:36px;height:4px;border-radius:4px;
    background:#dde8e7;margin:2px auto 14px;
  }
  .modal h3{font-size:17px}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

  /* ---------- Toast 抬到底栏之上 ---------- */
  .toasts{left:12px;right:12px;align-items:stretch;bottom:calc(68px + env(safe-area-inset-bottom))}
  .toast{max-width:100%;border-radius:13px}

  /* ---------- 更适合拇指 ---------- */
  .item{padding:13px 0}
  .it-act{gap:2px}
  .sn-btn{padding:8px 9px;font-size:11.5px;min-height:36px}
  .sn-btn svg{display:none}
  .it-title{font-size:14.6px}
  .ico-btn{width:40px;height:40px}
  .ico-btn svg{width:17px;height:17px}
  .chk{width:25px;height:25px;flex:0 0 25px}
  .chk svg{width:15px;height:15px}
  .card{margin-bottom:14px;border-radius:15px}
  .stat{padding:14px 15px}
  .empty{padding:28px 16px}
}

/* ================= PWA 安装提示 ================= */
.pwa-tip{
  position:fixed;right:12px;left:12px;bottom:20px;z-index:85;
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:14px;
  background:rgba(255,255,255,.97);
  border:1px solid var(--line);
  box-shadow:0 12px 34px rgba(8,42,39,.18);
  animation:tin .26s;
}
.pwa-tip .pt-i{
  width:34px;height:34px;flex:0 0 34px;border-radius:10px;
  background:linear-gradient(145deg,#12a89a,var(--accent-dark));
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(13,148,136,.28);
}
.pwa-tip .pt-i svg{width:17px;height:17px}
.pwa-tip .pt-t{flex:1;min-width:0;line-height:1.4}
.pwa-tip .pt-t b{display:block;font-size:13px;font-weight:680;letter-spacing:-.1px}
.pwa-tip .pt-t span{display:block;font-size:11.5px;color:var(--text-3);margin-top:2px;word-break:break-word}
@media (max-width:860px){
  .pwa-tip{bottom:calc(70px + env(safe-area-inset-bottom));padding:9px 10px;gap:9px}
  .pwa-tip .btn-sm{min-height:36px;padding:7px 13px}
}
@media (min-width:861px){
  .pwa-tip{left:auto;right:20px;bottom:20px;max-width:380px}
}

/* ================= 项目线路 ================= */
.tks{display:flex;flex-direction:column;gap:7px}
.tk-wrap{border:1px solid var(--line-soft);border-radius:10px;background:#fbfdfd;overflow:hidden;transition:border-color .15s}
.tk-wrap:hover{border-color:#d5e5e3}
.tk{display:flex;align-items:stretch}
.tk-main{flex:1;min-width:0;text-align:left;padding:8px 10px;display:block;color:inherit}
.tk-top{display:flex;align-items:baseline;gap:8px;font-size:12.5px;line-height:1.4}
.tk-top b{font-weight:660;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.1px}
.tk-n{margin-left:auto;font-size:11px;font-weight:700;color:var(--text-3);flex:0 0 auto}
.tk-bar{height:4px;border-radius:9px;background:#e4eeec;margin:6px 0 5px;overflow:hidden}
.tk-bar > i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#5cc9b9,var(--accent));transition:width .3s}
.tk-cur{font-size:11.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px;line-height:1.4}
.tk-cur svg{width:12px;height:12px;color:var(--accent);flex:0 0 12px}
.tk-go{width:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;color:var(--accent-deep);background:var(--accent-soft2);border-left:1px solid var(--line-soft);transition:background .15s,transform .1s}
.tk-go svg{width:16px;height:16px;stroke-width:3.2}
.tk-go:hover{background:var(--accent-soft)}
.tk-go:active{background:var(--accent-soft);transform:scale(.95)}
.tk-done{background:var(--accent-soft2);border-color:#d8ece9}
.tk-done .tk-bar > i{background:var(--accent)}
.tk-done .tk-cur{color:var(--accent-deep);font-weight:600}
/* 节点（步骤）可点推进 */
.tk-exp{display:flex;align-items:center;gap:5px;width:100%;padding:5px 10px 6px;border-top:1px solid var(--line-soft);
  font-size:11px;font-weight:650;color:var(--text-3);background:rgba(255,255,255,.55);text-align:left;
  transition:background .15s,color .15s}
.tk-exp:hover{color:var(--accent-deep);background:var(--accent-soft2)}
.tk-exp b{font-weight:750;color:var(--text-2)}
.tk-exp .ce{margin-left:auto;display:flex;align-items:center;opacity:.6}
.tk-exp .ce svg{width:12px;height:12px;transform:rotate(90deg);transition:transform .2s}
.tk-exp[aria-expanded="true"] .ce svg{transform:rotate(-90deg)}
.tk-exp .tk-exp-tip{color:var(--text-4);font-weight:600}
.tk-steps{display:flex;flex-wrap:wrap;gap:5px;padding:8px 9px 9px;background:var(--surface);border-top:1px solid var(--line-soft)}
.tk-st{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:4px 8px 4px 5px;border-radius:8px;
  background:var(--bg-2);color:var(--text-2);font-size:11.5px;font-weight:600;line-height:1.35;text-align:left;
  border:1px solid transparent;transition:background .15s,border-color .15s,color .15s}
.tk-st i{font-style:normal;font-size:10px;font-weight:750;color:var(--text-4);background:#fff;border-radius:5px;padding:0 4px;line-height:15px;flex:0 0 auto}
.tk-st span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-st:hover{border-color:#cfe3e0;background:var(--accent-soft2);color:var(--accent-deep)}
.tk-st.is-done{background:var(--accent-soft);color:var(--accent-deep)}
.tk-st.is-done i{color:var(--accent-deep);background:#fff}
.tk-st.is-cur{background:#fff;color:var(--text);border-color:var(--accent);box-shadow:0 1px 4px rgba(13,148,136,.16)}
.tk-st.is-cur i{background:var(--accent);color:#fff}
.tk-foot{display:flex;align-items:center;gap:8px;margin-top:9px}
.tk-sum{font-size:11px;color:var(--text-4);font-weight:600}
.tk-add{margin-left:auto}
/* 接下来 3 天 */
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.srow:last-child{border-bottom:none}
.srow-t{flex:1;min-width:0;font-size:13.2px;word-break:break-word;color:var(--text-2);line-height:1.5}
.srow-m{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.soon-card{background:linear-gradient(180deg,#fcfefe,#fafcfc)}
@media (max-width:860px){
  .tk-go{width:52px;flex:0 0 52px}
  .tk-main{padding:10px 11px}
  .tk-top{font-size:13px}
  .tk-cur{font-size:12px}
  .srow{padding:11px 0}
  .srow-t{font-size:13.8px}
}

/* 线路备注 / 待办 / 进退 */
.tk-note{display:flex;align-items:flex-start;gap:4px;font-size:11.5px;color:var(--warn);margin-top:4px;line-height:1.45;min-width:0}
.tk-note span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tk-note svg{width:11px;height:11px;flex:0 0 11px;margin-top:2px}
.tk-task{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--accent-deep);margin-top:3px;min-width:0}
.tk-task span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tk-task svg{width:11px;height:11px;flex:0 0 11px}
.tk-acts{display:flex;gap:8px;margin:12px 0 2px}
.tk-acts .btn{flex:1}
.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none}
.tk-tasks{border:1px solid var(--line);border-radius:10px;padding:2px 10px;background:#fbfdfd}
/* ================= 标准流程设计 ================= */
.std-list{display:flex;flex-direction:column;gap:10px}
.std-trk{border:1px solid var(--line);border-radius:12px;background:#fbfdfd;padding:10px 11px 11px}
.std-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.std-n{display:inline-flex;align-items:center;gap:3px;flex:0 0 auto;padding:3px 6px;border-radius:6px;
  background:var(--bg-2);font-size:10.5px;font-weight:750;color:var(--text-3);letter-spacing:.2px;white-space:nowrap}
.std-n:hover{background:var(--accent-soft2);color:var(--accent-deep)}
.std-n .ce{display:flex;color:var(--text-4);transition:transform .16s}
.std-n .ce svg{width:11px;height:11px}
.std-n[aria-expanded="true"] .ce{transform:rotate(180deg)}
.std-body{display:block}
.std-tip{font-size:10.5px;color:var(--text-4);font-weight:600;margin:-2px 0 6px 2px}
#stdForm .ma{position:sticky;bottom:-22px;background:#fff;padding:10px 0 0;margin-top:12px;border-top:1px solid var(--line-soft);z-index:2}
#stdForm .ma.std-ma{align-items:center}
#stdForm .ma.std-ma .btn{flex:0 0 auto}
.std-nm{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;
  font-size:13px;font-weight:650;color:var(--text);letter-spacing:-.1px}
.std-nm:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,148,136,.1);outline:none}
.std-h .sr-mv,.std-h .sr-del{flex:0 0 26px;width:26px;height:26px}
.std-steps{margin-bottom:6px}
.std-add{width:100%;justify-content:center;margin-top:10px}
.std-note{display:flex;align-items:flex-start;gap:6px;font-size:11.5px;color:var(--text-3);line-height:1.6;
  background:var(--bg-2);border-radius:9px;padding:8px 10px;margin-top:10px}
.std-note svg{width:13px;height:13px;flex:0 0 13px;margin-top:2px;color:var(--text-4)}
.std-apply{display:flex;align-items:flex-start;gap:7px;font-size:12.3px;color:var(--text-2);line-height:1.5;
  cursor:pointer;margin-right:auto;max-width:54%}
.std-apply em{display:block;font-style:normal;font-size:11px;color:var(--text-4);line-height:1.45;margin-top:1px}
.std-apply input{width:auto;margin-top:2px;flex:0 0 auto;accent-color:var(--accent)}
/* ================= 顺延 ================= */
.sn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 6px}
.sn-opt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;
  border:1px solid var(--line);border-radius:10px;background:#fff;transition:.15s}
.sn-opt:hover{border-color:var(--accent);background:var(--accent-soft2)}
.sn-opt b{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-.1px}
.sn-opt span{font-size:10.5px;color:var(--text-4);font-weight:650}
.sn-cur{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);margin:0 0 12px}
.sn-cur b{color:var(--text);font-weight:700}
.sn-cur .bad{color:var(--danger);font-weight:700}
@media (max-width:520px){
  .std-n .std-c{display:none}
  #stdForm .ma{bottom:-18px}
  .std-apply{max-width:100%;width:100%;margin:0 0 8px}
  .std-ma{flex-wrap:wrap}
  .std-ma .btn{flex:1 1 auto}
  .sn-grid{grid-template-columns:1fr 1fr;gap:7px}
  .sn-opt{padding:11px 4px;min-height:52px}
}

/* ================= 期间问题处理 ================= */
.pi{margin-top:9px;border:1px solid var(--line-soft);border-radius:10px;background:var(--surface);overflow:hidden}
.pi-h{display:flex;align-items:center;gap:6px;padding:7px 9px;background:#fbfdfd;border-bottom:1px solid var(--line-soft)}
.pi-h b{font-size:12px;font-weight:700;letter-spacing:-.1px}
.pi-h .pi-ic{display:flex;color:var(--text-4)}
.pi-h .pi-ic svg{width:13px;height:13px}
.pi-n{margin-left:auto;font-size:10.5px;font-weight:750;color:var(--text-3);background:var(--bg-2);border-radius:20px;padding:1.5px 7px;white-space:nowrap}
.pi-n.hot{color:var(--danger);background:var(--danger-soft)}
.pi-add{font-size:11.5px;font-weight:700;color:var(--accent-deep);padding:3px 6px;border-radius:6px;flex:0 0 auto;transition:background .15s}
.pi-add:hover{background:var(--accent-soft2)}
.pi-row{display:flex;align-items:flex-start;gap:7px;padding:6px 9px;border-bottom:1px solid var(--line-soft)}
.pi-row:last-child{border-bottom:none}
.pi-ck{flex:0 0 15px;width:15px;height:15px;margin-top:1px;border-radius:50%;border:1.6px solid #cfdedd;
  display:flex;align-items:center;justify-content:center;color:#fff;background:#fff;transition:border-color .15s,background .15s}
.pi-ck svg{width:9px;height:9px;stroke-width:3.8}
.pi-ck:hover{border-color:var(--accent)}
.pi-row.is-done .pi-ck{background:var(--accent);border-color:var(--accent)}
.pi-ti{flex:1;min-width:0;text-align:left;font-size:12.3px;line-height:1.5;color:var(--text);word-break:break-word}
.pi-ti:hover{color:var(--accent-deep)}
.pi-row.is-done .pi-ti{color:var(--text-4);text-decoration:line-through}
.pi-meta{flex:0 0 auto;font-size:10.5px;color:var(--text-4);font-weight:650;padding-top:2px;max-width:46%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.pi-meta.over{color:var(--danger)}
.pi-empty{padding:9px 9px 10px;font-size:11.8px;color:var(--text-4);line-height:1.55}
.pi-more{display:block;width:100%;padding:5.5px 9px;font-size:11px;font-weight:650;color:var(--text-3);
  background:#fbfdfd;text-align:left;border-top:1px solid var(--line-soft);transition:background .15s,color .15s}
.pi-more:hover{color:var(--accent-deep);background:var(--accent-soft2)}
@media (max-width:860px){
  .pi-ti{font-size:13px}
  .pi-ck{flex:0 0 17px;width:17px;height:17px;margin-top:2px}
  .pi-row{padding:8px 9px;gap:8px}
  .pi-add{padding:5px 8px;font-size:12px}
  .pi-meta{font-size:11px}
}
.tk-taskrow{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;line-height:1.45}
.tk-taskrow:last-child{border-bottom:none}
.tk-taskrow svg{width:13px;height:13px;color:var(--accent);flex:0 0 13px}
.tk-taskrow span{flex:1;min-width:0;word-break:break-word}
.tk-taskrow em{font-style:normal;font-size:11px;color:var(--text-4);flex:0 0 auto}

/* ================= AI 入口 ================= */
.fab{
  position:fixed;right:18px;bottom:24px;z-index:80;
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(145deg,#12a89a 0%,var(--accent) 45%,#0b7fa0 100%);
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(11,127,116,.36),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .12s,box-shadow .2s;
}
.fab svg{width:24px;height:24px}
.fab:active{transform:scale(.94);box-shadow:0 4px 12px rgba(11,127,116,.34)}
.fab:hover{box-shadow:0 10px 26px rgba(11,127,116,.42),inset 0 1px 0 rgba(255,255,255,.25)}
@media (max-width:860px){
  .fab{right:14px;bottom:calc(72px + env(safe-area-inset-bottom));width:52px;height:52px}
}
.ai-bar{display:flex;gap:8px;margin-top:10px}
.ai-bar .btn{flex:1}
.ai-mic{background:var(--bg-2);border-color:var(--line);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ai-mic.listening{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger);animation:pulse 1.2s infinite}
.ai-mic.ime{background:var(--accent-soft);border-color:#bfe3dd;color:var(--accent-deep)}
.ai-mic-tip{margin-top:8px;font-size:11.5px;line-height:1.65;color:var(--text-2);background:var(--accent-soft2);border:1px solid #d9eeea;border-radius:9px;padding:7px 10px}
.ai-mic-tip b{color:var(--accent-deep)}
.ai-tip{font-size:11.5px;color:var(--text-4);margin-top:8px;line-height:1.6}
.ai-tip b{color:var(--text-2);font-weight:700}
.ai-out{margin-top:12px}
.ai-card{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fbfdfd}
.ai-row{display:flex;gap:10px;padding:4px 0;font-size:12.8px;align-items:baseline;line-height:1.5}
.ai-row span{flex:0 0 44px;color:var(--text-4);font-size:11px;font-weight:700;letter-spacing:.2px}
.ai-row b{flex:1;min-width:0;font-weight:600;word-break:break-word}
.ai-acts{display:flex;gap:8px;margin-top:10px}
.ai-acts .btn{flex:1}
.ai-msg{font-size:12.8px;color:var(--text-2);line-height:1.7;background:var(--bg-2);border-radius:10px;padding:10px 12px}
.ai-item{border:1px solid var(--line);border-radius:12px;padding:8px 11px;background:#fbfdfd;margin-bottom:8px}
.ai-item .ai-row{padding:3px 0}
.ai-item .ai-row span{flex:0 0 42px}
.ai-in{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.8px;font-family:inherit;background:#fff;color:var(--text);line-height:1.45}
.ai-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(11,127,116,.12)}
select.ai-in{-webkit-appearance:none;appearance:none;padding-right:6px}
.ai-flag{flex:0 0 auto;font-style:normal;font-size:10.5px;color:var(--text-4);background:var(--bg-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;white-space:nowrap}
.ai-hint{font-size:11.5px;color:var(--text-4);margin:6px 0;line-height:1.65}
.ai-fb{margin-top:9px}
.ai-fb .btn{width:100%}

/* ================= 学习板块 ================= */
.sub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (min-width:861px){ .sub-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px} }
@media (max-width:360px){ .sub-grid{grid-template-columns:1fr} }
.sub-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;cursor:pointer;transition:.18s;position:relative;overflow:hidden;font-family:inherit;display:block;width:100%}
.sub-card:hover{border-color:var(--sc);box-shadow:0 6px 20px rgba(10,50,46,.08)}
.sub-card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc)}
.sc-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sc-n{font-size:13.5px;font-weight:700;color:var(--sc)}

function parseD(s){ var a=String(s||'').slice(0,10).split('-'); if(a.length<3) return new Date(); return new Date(+a[0], +a[1]-1, +a[2]); }
function addDays(s,n){ var d=parseD(s); d.setDate(d.getDate()+n); return fmtD(d); }
function dayDiff(a,b){ return Math.round((parseD(a)-parseD(b))/86400000); }
function cnDate(s){
  var d=parseD(s), t=todayStr();
  var wd=['日','一','二','三','四','五','六'][d.getDay()];
  var diff=dayDiff(s,t);
  var pre = diff===0?'今天':diff===1?'明天':diff===2?'后天':diff===-1?'昨天':diff===-2?'前天':'';
  return (pre?pre+' · ':'')+(d.getMonth()+1)+'月'+d.getDate()+'日 周'+wd;

function upgradePresetTracks(p){
  var changed=false;
  tracksOf(p).forEach(function(t){
    var old=LEGACY_PRESET_NAMES[t.name];
    if(!old) return;
    if((Number(t.step)||0)>0) return;                 /* 已经推进过的不动 */
    var now=trackSteps(t).map(function(s){ return s.n; }).join('\n');
    if(now!==old.join('\n')) return;                   /* 自己改过的不动 */
    var pre=null;
    TRACK_PRESETS.forEach(function(x){ if(x.name===t.name) pre=x; });
    if(!pre) return;
    t.steps=pre.steps.map(stLine);
    changed=true;
  });

}
/* 把当前标准流程套到所有现有项目：同名线路保留进度与备注，多出来的线路删掉 */
function applyStdToProjects(){
  var std=stdTracks();
  S.projects.forEach(function(p){
    var old=tracksOf(p).slice();
    p.tracks=std.map(function(st){
      var same=null;
      for(var i=0;i<old.length;i++){ if(old[i].name===st.name){ same=old[i]; break; } }
      return {
        id: same ? same.id : uid(),
        name: st.name,
        steps: cloneSteps(st.steps),
        step: same ? Math.min(trackDone(same), st.steps.length) : 0,
        note: same ? String(same.note||'') : ''
      };
    });
    var alive={};
    p.tracks.forEach(function(t){ alive[t.id]=1; });
    S.tasks.forEach(function(x){ if(x.pid===p.id && x.tid && !alive[x.tid]) x.tid=''; });
  });
  return S.projects.length;
}
function tracksOf(p){
  if(!Array.isArray(p.tracks)) p.tracks=[];
  return p.tracks;
}
function findTrack(p, tid){
  if(!p || !Array.isArray(p.tracks)) return null;
  for(var i=0;i<p.tracks.length;i++){ if(p.tracks[i].id===tid) return p.tracks[i]; }
  return null;
}
function trackSteps(t){ return (t && Array.isArray(t.steps)) ? t.steps : []; }
function trackDone(t){
  var n=trackSteps(t).length, v=Number(t && t.step);
  if(!isFinite(v) || v<0) v=0;
  return Math.min(v, n);
}
function trackPct(t){
  var n=trackSteps(t).length;
  return n ? Math.round(trackDone(t)/n*100) : 0;
}
function trackSummary(p){
  var ts=tracksOf(p);
  if(!ts.length) return null;
  var sum=0, fin=0;
  ts.forEach(function(t){
    var n=trackSteps(t).length;
    sum += trackPct(t);
    if(n && trackDone(t)>=n) fin++;
  });
  return { n:ts.length, fin:fin, pct:Math.round(sum/ts.length) };
}
function trackOpenTasks(p, t){
  if(!p || !t) return [];
  return S.tasks.filter(function(x){ return !x.done && x.pid===p.id && x.tid===t.id; });
}

function migrateTracks(p){
  if(Array.isArray(p.tracks) && p.tracks.length){
    p.tracks.forEach(function(t){
      if(!t.id) t.id=uid();
      if(!Array.isArray(t.steps)) t.steps=parseSteps(t.stepsText||'');
    });
    upgradePresetTracks(p);
    return;
  }
  var arr=[];
  var f=flowOf(p.cat), oldStep=Number(p.step)||0;
  if(f && f.steps && f.steps.length && oldStep>0){
    arr.push({ id:uid(), name:f.name+'（原流程）',
      steps:f.steps.map(function(s){ return { n:s.n, d:s.d||'' }; }),
      step:Math.min(oldStep, f.steps.length) });
  }
  TRACK_PRESETS.forEach(function(pre){ arr.push(newTrackFrom(pre)); });
  p.tracks=arr;
}

  }else{
    fh+='<div class="focus clear"><div class="focus-h">'+ic('sparkle')+'<h2>今天没有卡点</h2><div class="sp"><span class="hint">保持节奏就好</span></div></div>'+
        '<div class="focus-b"><div class="allclear">'+ic('check')+'今天没有逾期或到期的任务'+(sn.length?'，接下来 3 天有 '+sn.length+' 条安排':'')+'</div></div></div>';
  }

  /* —— 接下来 3 天：只预告，不催办 —— */
  var soonHtml='';
  if(sn.length){
    soonHtml='<div class="card soon-card"><div class="card-h">'+ic('calendar')+'<h2>接下来 3 天</h2><span class="hint">提前知道就好，今天不用做</span></div><div class="card-b tight" style="padding-top:6px">';
    sn.forEach(function(t){
      var dd=dayDiff(t.due,t0);
      var md=(parseD(t.due).getMonth()+1)+'/'+parseD(t.due).getDate();
      soonHtml+='<div class="srow">'+
        '<div class="srow-t">'+esc(t.title)+'</div>'+
        '<div class="srow-m"><span class="pill gray">'+md+'</span><span class="pill amber">'+dd+' 天后</span></div>'+
      '</div>';
    });
    soonHtml+='</div></div>';
  }

  /* —— 筛选 —— */
  var f=S.ui.taskFilter;
  var segs=[['today','今天'],['open','未完成'],['done','已完成'],['all','全部']];
  var segHtml='<div class="seg">';
  segs.forEach(function(s){ segHtml+='<button class="'+(f===s[0]?'on':'')+'" data-act="taskFilter" data-v="'+s[0]+'" type="button">'+s[1]+'</button>'; });
  segHtml+='</div>';

  /* —— 列表分组 —— */
  var listHtml='';
  if(f==='today'){
    if(od.length) listHtml+=taskGroup('逾期未完成','需要尽快处理', od);
    if(td.length) listHtml+=taskGroup('今天','今天到期', td);
    var g={};
    sn.forEach(function(t){ if(!g[t.due]) g[t.due]=[]; g[t.due].push(t); });
    Object.keys(g).sort().forEach(function(d){
      var st=dayDiff(d,t0);
      listHtml+=taskGroup((parseD(d).getMonth()+1)+'月'+parseD(d).getDate()+'日', st+' 天后', g[d]);
    });
  }else if(f==='done'){
    var done=S.tasks.filter(function(t){ return t.done; }).sort(function(a,b){ return (b.doneAt||'')<(a.doneAt||'')?-1:1; });
    listHtml+=taskGroup('已完成','近期完成的项', done);
  }else{
    var arr = f==='open' ? S.tasks.filter(function(t){ return !t.done; }) : S.tasks.slice();
    var noDate=arr.filter(function(t){ return !t.due; });
    var withDate=arr.filter(function(t){ return t.due; }).sort(function(a,b){ return a.due<b.due?-1:1; });
    var g2={};
    withDate.forEach(function(t){ if(!g2[t.due]) g2[t.due]=[]; g2[t.due].push(t); });
    Object.keys(g2).sort().forEach(function(d){
      var st=dayDiff(d,t0);
      var sub = st<0?'逾期 '+Math.abs(st)+' 天' : st===0?'今天' : st===1?'明天' : st+' 天后';
      listHtml+=taskGroup(cnDate(d), sub, g2[d]);
    });
    listHtml+=taskGroup('未排期','建议补上截止日期', noDate);
  }
  if(!listHtml){
    listHtml='<div class="empty">'+ic('inbox')+'<b>'+(f==='done'?'还没有完成的任务':'这里还没有内容')+'</b>'+
      '<span>点右上角「新建待办」加一条，或从会议记录里一键生成</span></div>';
  }

  var total=S.tasks.length, doneN=S.tasks.filter(function(t){return t.done;}).length;
  var rate= total? Math.round(doneN/total*100):0;

  return '<div class="topbar"><div><h1>今日待办</h1>'+
      '<div class="sub">'+cnDate(t0)+' · 共 '+total+' 条，完成 '+doneN+' 条（'+rate+'%）'+
        (od.length?' · <b style="color:var(--danger)">'+od.length+' 条逾期</b>':'')+
        (td.length?' · <b style="color:var(--warn)">'+td.length+' 条今天到期</b>':'')+'</div></div>'+
      '<div class="topbar-act">'+
        '<button class="btn" data-act="syncNow" type="button">'+ic('refresh')+'立即同步</button>'+
        '<button class="btn btn-primary" data-act="addTask" type="button">'+ic('plus')+'新建待办</button></div></div>'+
    fh+ soonHtml +
    '<div class="card"><div class="card-h">'+ic('checksq')+'<h2>待办清单</h2><span class="hint">按截止日期分组，逾期自动置顶</span><div class="sp">'+segHtml+'</div></div>'+
      '<div class="card-b tight" style="padding-top:12px">'+listHtml+'</div></div>';
}

/* =========================================================
   模块二：项目总览
   ========================================================= */
function flowBlock(p){
  var steps=stepsOfProj(p), n=steps.length, f=flowOf(p.cat);
  if(!n) return '<div class="flow"><div class="flow-h">'+ic('flow')+'<b>未套用标准流程</b></div><div class="flow-note">编辑项目里选好类型即可套用</div></div>';
  var d=stepDone(p), pct=Math.round(d/n*100);
  var head='<div class="flow-h">'+ic('flow')+'<b>'+esc(f.name)+'</b><span style="margin-left:auto">'+d+' / '+n+'</span></div>';
  if(d>=n) return '<div class="flow">'+head+'<div class="flow-done">'+ic('check')+'流程已走完</div><div class="fl-bar"><i style="width:100%"></i></div></div>';
  var cur=steps[d];
  return '<div class="flow">'+head+
    '<div class="flow-cur"><i>第 '+(d+1)+' 步</i><span>'+esc(cur.n)+'</span></div>'+
    (cur.d?'<div class="flow-note">'+esc(cur.d)+'</div>':'')+
    '<div class="fl-bar"><i style="width:'+pct+'%"></i></div></div>';
}

function trackRow(p, t){
  var steps=trackSteps(t), n=steps.length, d=trackDone(t), pct=trackPct(t);
  var done = n>0 && d>=n;
  var cur = d<n ? steps[d] : null;
  var note = String(t.note||'').trim();
  var noteHtml = note ? '<div class="tk-note">'+ic('alert')+'<span>'+esc(note)+'</span></div>' : '';
  /* 展开后的节点列表：点一下就能推进 / 退回 */
  var open = n>0 && tkIsOpen(t.id);
  var chips='';
  if(open){
    chips='<div class="tk-steps">'+steps.map(function(s,i){
      var cls = i<d ? ' is-done' : (i===d ? ' is-cur' : '');
      var tip = i<d ? ('点这里退回，回到「'+s.n+'」之前') : (i===d ? ('点这里完成「'+s.n+'」') : ('点这里直接推进到「'+s.n+'」'));
      return '<button class="tk-st'+cls+'" data-act="trackStep" data-id="'+p.id+'" data-tid="'+t.id+'" data-i="'+i+'" type="button" title="'+esc(tip)+'">'+
        '<i>'+(i+1)+'</i><span>'+esc(s.n)+'</span></button>';
    }).join('')+'</div>';
  }
  var exp = n ? '<button class="tk-exp" data-act="tkToggle" data-id="'+p.id+'" data-tid="'+t.id+'" type="button" aria-expanded="'+(open?'true':'false')+'">'+
      ic('flow')+'<span>节点 <b>'+d+'</b> / '+n+'</span>'+
      (done?'<span class="tk-exp-tip">· 已走完</span>':'')+
      '<span class="ce">'+ic('chevron')+'</span></button>' : '';
  return '<div class="tk-wrap'+(done?' tk-done':'')+'">'+
    '<div class="tk">'+
      '<button class="tk-main" data-act="openTrack" data-id="'+p.id+'" data-tid="'+t.id+'" type="button" title="点开可编辑步骤">'+
        '<div class="tk-top"><b>'+esc(t.name||'未命名线路')+'</b><span class="tk-n">'+d+'/'+n+'</span></div>'+
        '<div class="tk-bar"><i style="width:'+pct+'%"></i></div>'+
        '<div class="tk-cur">'+(done ? (ic('check')+' 全部完成') : (cur ? '当前：'+esc(cur.n) : '还没有步骤'))+'</div>'+
        noteHtml +
      '</button>'+
      (cur ? '<button class="tk-go" data-act="trackNext" data-id="'+p.id+'" data-tid="'+t.id+'" type="button" aria-label="完成本步" title="完成本步">'+ic('check')+'</button>' : '')+
    '</div>'+
    exp + chips +
  '</div>';
}
/* 期间问题处理：本项目下所有待办（未完成在前，按截止日期） */
var _pi={ more:{}, done:{} };
function projIssuesOf(p){
  var arr=tasksOfProj(p.id).slice();
  arr.sort(function(a,b){
    if(!!a.done !== !!b.done) return a.done?1:-1;
    var ad=a.due||'9999-99-99', bd=b.due||'9999-99-99';
    if(ad!==bd) return ad<bd?-1:1;
    return String(a.title||'')<String(b.title||'')?-1:1;
  });
  return arr;
}
function issueRow(p, t){
  var over = !t.done && t.due && dayDiff(t.due, todayStr())<0;
  var meta=[];
  if(t.prio && t.prio!=='P2') meta.push(t.prio);
  if(t.due) meta.push((parseD(t.due).getMonth()+1)+'/'+parseD(t.due).getDate());
  var trk = t.tid ? findTrack(p, t.tid) : null;
  if(trk && meta.length<3) meta.push(trk.name);
  if(!meta.length) meta.push('未排期');
  return '<div class="pi-row'+(t.done?' is-done':'')+'">'+
    '<button class="pi-ck" data-act="toggleTask" data-id="'+t.id+'" type="button" aria-label="'+(t.done?'标记未完成':'标记完成')+'">'+(t.done?ic('check'):'')+'</button>'+
    '<button class="pi-ti" data-act="editTask" data-id="'+t.id+'" type="button">'+esc(t.title)+'</button>'+
    '<span class="pi-meta'+(over?' over':'')+'">'+(over ? ('逾期 '+Math.abs(dayDiff(t.due, todayStr()))+' 天') : esc(meta.join(' · ')))+'</span>'+
  '</div>';
}
function projIssues(p){
  var all=projIssuesOf(p);
  var und=all.filter(function(t){ return !t.done; });
  var don=all.filter(function(t){ return t.done; });
  var more=!!_pi.more[p.id], showDone=!!_pi.done[p.id];
  var show = more ? und : und.slice(0,3);
  var listHtml = show.map(function(t){ return issueRow(p,t); }).join('');
  if(!listHtml && !don.length){
    listHtml='<div class="pi-empty">还没有记录 · 发现一个问题就记一条，卡在哪、谁来跟都写清楚</div>';
  }
  var moreHtml = und.length>3
    ? '<button class="pi-more" data-act="piMore" data-id="'+p.id+'" type="button">'+(more?'收起未完成':'还有 '+(und.length-3)+' 条未完成')+'</button>'
    : '';
  var doneHtml = don.length
    ? '<button class="pi-more" data-act="piDone" data-id="'+p.id+'" type="button">'+(showDone?'收起已完成':'已完成 '+don.length+' 条')+'</button>'+
      (showDone ? don.map(function(t){ return issueRow(p,t); }).join('') : '')
    : '';
  return '<div class="pi">'+
    '<div class="pi-h">'+'<span class="pi-ic">'+ic('alert')+'</span><b>期间问题处理</b>'+
      '<span class="pi-n'+(und.length?' hot':'')+'">'+(und.length?und.length+' 条待办':'无待办')+'</span>'+
      '<button class="pi-add" data-act="addTaskToProj" data-id="'+p.id+'" type="button">+ 记一条</button>'+
    '</div>'+
    listHtml + moreHtml + doneHtml +
  '</div>';
}
function projCard(p){
  var st=statOf(p.status), c=catOf(p.cat), ph=phaseOf(p.phase);
  var pg=projProgress(p.id);
  var ts=tracksOf(p), sum=trackSummary(p);
  var goal='';
  if(p.goalDate){
    var dd=dayDiff(p.goalDate, todayStr());
    if(p.status!=='done'){
      goal = dd<0 ? '<span class="pill red">'+ic('alert')+' 超期 '+Math.abs(dd)+' 天</span>'
           : dd<=7 ? '<span class="pill amber">'+ic('clock')+' 剩 '+dd+' 天</span>'
           : '<span class="pill gray">'+ic('target')+' '+(parseD(p.goalDate).getMonth()+1)+'/'+parseD(p.goalDate).getDate()+' 目标</span>';
    }
  }
  var bar='';
  if(pg){
    bar='<div class="proj-bar"><div class="pb-t"><span>关联任务 '+pg.done+'/'+pg.total+'</span><span>'+pg.pct+'%</span></div><div class="pb"><i style="width:'+pg.pct+'%"></i></div></div>';
  }
  var nextLine = p.next ? '<div class="proj-row"><span class="k">备注</span><span>'+nl2br(p.next)+'</span></div>' : '';
  var trackHtml = '<div class="tks">'+ts.map(function(t){ return trackRow(p,t); }).join('')+'</div>';
  var trackFoot = '<div class="tk-foot"><span class="tk-sum">'+
      (sum ? (sum.n+' 条线路 · 完成 '+sum.fin+' 条 · 平均 '+sum.pct+'%') : '还没有线路')+
    '</span><button class="btn btn-sm tk-add" data-act="addTrack" data-id="'+p.id+'" type="button">'+ic('plus')+'添加线路</button></div>';
  return '<div class="proj">'+
    '<div class="proj-top"><div class="proj-name">'+esc(p.name)+'</div>'+
      '<span class="pill pill-sel '+ph.cls+'" title="点击修改阶段">'+
        '<select data-sel="projPhase" data-id="'+p.id+'" aria-label="项目阶段">'+
          PHASES.map(function(x){ return '<option value="'+x.key+'"'+(p.phase===x.key?' selected':'')+'>'+x.label+'</option>'; }).join('')+
        '</select></span></div>'+
    '<div class="proj-tags"><span class="cat-tag '+c.key+'">'+c.label+'</span>'+
      '<span class="pill pill-sel '+st.cls+'" title="点击修改状态">'+
        '<select data-sel="projStatus" data-id="'+p.id+'" aria-label="项目状态">'+
          ['active','blocked','done'].map(function(k){ return '<option value="'+k+'"'+(p.status===k?' selected':'')+'>'+PSTATUS[k].label+'</option>'; }).join('')+
        '</select></span></div>'+
    trackHtml + trackFoot +
    projIssues(p) +
    nextLine+
    (p.blocker?'<div class="proj-row blocker"><span class="k">卡点</span><span>'+nl2br(p.blocker)+'</span></div>':'')+
    bar+
    '<div class="proj-foot">'+goal+'<span style="margin-left:auto"></span>'+
      '<button class="ico-btn" data-act="addTaskToProj" data-id="'+p.id+'" type="button" title="加任务到本项目">'+ic('plus')+'</button>'+
      '<button class="ico-btn" data-act="export" data-scope="proj:'+p.id+'" type="button" title="导出本项目">'+ic('download')+'</button>'+
      '<button class="ico-btn" data-act="editProj" data-id="'+p.id+'" type="button" title="编辑">'+ic('pen')+'</button>'+
      '<button class="ico-btn red" data-act="delProj" data-id="'+p.id+'" type="button" title="删除">'+ic('trash')+'</button>'+
    '</div></div>';
}

function vProjects(){
  var f=S.ui.projFilter, cf=S.ui.projCat||'all';
  var segs=[['all','全部'],['pre','前期'],['plan','排产'],['supply','在供'],['close','收尾']];
  var segHtml='<div class="seg wrap">';
  segs.forEach(function(s){ segHtml+='<button class="'+(f===s[0]?'on':'')+'" data-act="projFilter" data-v="'+s[0]+'" type="button">'+s[1]+'</button>'; });
  segHtml+='</div>';
  var catSel='<select class="sel-sm" data-act="projCat" aria-label="按类型筛选">'+
    '<option value="all"'+(cf==='all'?' selected':'')+'>全部类型</option>'+
    CATS.map(function(c){ return '<option value="'+c.key+'"'+(cf===c.key?' selected':'')+'>'+c.label+'</option>'; }).join('')+
  '</select>';

  var arr=S.projects.filter(function(p){
    if(f!=='all' && p.phase!==f) return false;
    if(cf!=='all' && p.cat!==cf) return false;
    return true;
  });

  var grid='';
  if(arr.length){
    if(cf==='all'){
      CATS.forEach(function(cat){
        var list=arr.filter(function(p){ return p.cat===cat.key; });
        if(!list.length) return;
        grid+='<div class="grp"><div class="grp-h"><span class="cat-tag '+cat.key+'">'+cat.label+'</span><span class="n">'+list.length+'</span><i></i></div>'+
          '<div class="projs">'+list.map(projCard).join('')+'</div></div>';
      });
    }else{
      grid='<div class="projs">'+arr.map(projCard).join('')+'</div>';
    }
  }else{
    grid='<div class="empty" style="grid-column:1/-1">'+ic('folder')+'<b>'+(S.projects.length?'当前筛选下没有项目':'还没有项目')+'</b><span>建项目时选好类型和阶段，标准流程会自动套上来</span></div>';
  }

  var cnt={};
  PHASES.forEach(function(ph){ cnt[ph.key]=S.projects.filter(function(p){ return p.phase===ph.key; }).length; });
  return '<div class="topbar"><div><h1>项目总览</h1>'+
      '<div class="sub">共 '+S.projects.length+' 个项目 · 前期 '+cnt.pre+' · 排产 '+cnt.plan+' · 在供 '+cnt.supply+' · 收尾 '+cnt.close+'</div></div>'+
      '<div class="topbar-act">'+
      
      '<button class="btn" data-act="openFlows" type="button">'+ic('flow')+'标准流程</button>'+
      '<button class="btn btn-primary" data-act="addProj" type="button">'+ic('plus')+'新建项目</button></div></div>'+
    '<div class="card"><div class="card-h">'+ic('folder')+'<h2>项目列表</h2><span class="hint">多条线路并行推进，点右侧 √ 完成本步</span><div class="sp" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+catSel+segHtml+'</div></div>'+
    '<div class="card-b">'+grid+'</div></div>'+
    (blockedProj().length?'<div class="card"><div class="card-h">'+ic('alert')+'<h2>需要推动的卡点</h2><span class="hint">这些项目正卡着</span></div><div class="card-b">'+
      blockedProj().map(function(p){ return '<div class="proj-row blocker" style="display:block;margin-bottom:8px"><b style="display:block;font-size:11.5px;color:#9a4a10;margin-bottom:2px">'+esc(p.name)+'</b>'+nl2br(p.blocker||'未填写卡点')+'</div>'; }).join('')+
      '</div></div>':'');
}

/* =========================================================
   模块三：会议记录
   ========================================================= */
function todoLines(m){ return String(m.todos||'').split(/\n/).map(function(s){ return s.replace(/^[-*·\s]+/,'').trim(); }).filter(Boolean); }

function meetCard(m){
  var lines=todoLines(m);
  var todoHtml='';
  if(lines.length){
    todoHtml='<div class="mb todo"><b>后续待办（'+lines.length+'）</b>';
    lines.forEach(function(ln,i){
      todoHtml+='<div class="td">'+ic('arrow')+'<span>'+esc(ln)+'</span><button class="btn btn-sm" data-act="todoToTask" data-id="'+m.id+'" data-idx="'+i+'" type="button">转为待办</button></div>';
    });
    todoHtml+='</div>';
  }
  return '<div class="meet"><div class="meet-h"><div class="meet-t">'+esc(m.title)+'</div>'+
    '<div class="sp" style="display:flex;gap:4px">'+
      '<button class="ico-btn" data-act="editMeet" data-id="'+m.id+'" type="button" title="编辑">'+ic('pen')+'</button>'+
      '<button class="ico-btn red" data-act="delMeet" data-id="'+m.id+'" type="button" title="删除">'+ic('trash')+'</button></div></div>'+
    '<div class="meet-meta"><span class="pill teal">'+ic('calendar')+' '+esc(m.date||'未填日期')+'</span>'+
      (m.attendees?'<span class="pill gray">'+ic('users')+' '+esc(m.attendees)+'</span>':'')+
      (m.duration?'<span class="pill gray">'+ic('clock')+' '+m.duration+' 分钟</span>':'')+
      (projNameOf(m.pid)?'<span class="pill cyan">'+ic('folder')+' '+esc(projNameOf(m.pid))+'</span>':'')+
    '</div>'+
    '<div class="meet-body">'+
      (m.notes?'<div class="mb"><b>议题纪要</b>'+nl2br(m.notes)+'</div>':'')+
      (m.conclusion?'<div class="mb"><b>结论</b>'+nl2br(m.conclusion)+'</div>':'')+
      todoHtml+
    '</div></div>';
}

function vMeetings(){
  var month=todayStr().slice(0,7);
  var thisMonth=S.meetings.filter(function(m){ return String(m.date||'').slice(0,7)===month; });
  var mins=thisMonth.reduce(function(a,m){ return a+(Number(m.duration)||0); },0);
  var todoCount=S.meetings.reduce(function(a,m){ return a+todoLines(m).length; },0);
  var sorted=S.meetings.slice().sort(function(a,b){ return (b.date||'')<(a.date||'')?-1:1; });
  var body='';
  if(sorted.length){ sorted.forEach(function(m){ body+=meetCard(m); }); }
  else{ body='<div class="empty">'+ic('mic')+'<b>还没有会议记录</b><span>开完会花两分钟记下来，后续待办可以一键转成待办清单</span></div>'; }

  return '<div class="topbar"><div><h1>会议记录</h1>'+
      '<div class="sub">本月 '+thisMonth.length+' 场 · 共 '+Math.round(mins/6)/10+' 小时 · 沉淀 '+todoCount+' 条待办</div></div>'+
      '<div class="topbar-act">'+
      '<button class="btn btn-primary" data-act="addMeet" type="button">'+ic('plus')+'记录会议</button></div></div>'+
    '<div class="card"><div class="card-h">'+ic('mic')+'<h2>会议纪要</h2><span class="hint">按日期倒序 · 「后续待办」可一键转成待办</span></div>'+
    '<div class="card-b" style="padding-top:6px">'+body+'</div></div>';
}

/* =========================================================
   模块四：数据总览
   ========================================================= */
function svgTrend(data){
  var W=320,H=104,padX=10,padY=14;
  var max=1; data.forEach(function(d){ if(d.n>max) max=d.n; });
  var step=(W-padX*2)/(data.length-1||1);
  var pts=data.map(function(d,i){
    var x=padX+i*step, y=H-padY-(d.n/max)*(H-padY*2);
    return [x,y];
  });
  var line=pts.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
  var area=line+' L'+pts[pts.length-1][0].toFixed(1)+' '+(H-padY)+' L'+pts[0][0].toFixed(1)+' '+(H-padY)+' Z';
  var dots='', labels='';
  pts.forEach(function(p,i){
    dots+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2" fill="#fff" stroke="#0d9488" stroke-width="2"/>';
    var dt=parseD(data[i].date);
    labels+='<text x="'+p[0].toFixed(1)+'" y="'+(H-2)+'" text-anchor="middle" font-size="8.5" fill="#a9bebd">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</text>';
  });
  var grid='';
  for(var g=0;g<=2;g++){
    var gy=padY+(H-padY*2)*g/2;
    grid+='<line x1="'+padX+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padX)+'" y2="'+gy.toFixed(1)+'" stroke="#edf3f3" stroke-width="1"/>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:104px;overflow:visible">'+
    '<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d9488" stop-opacity=".18"/><stop offset="100%" stop-color="#0d9488" stop-opacity="0"/></linearGradient></defs>'+
    grid+'<path d="'+area+'" fill="url(#tg)"/><path d="'+line+'" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+labels+'</svg>';
}
function svgDonut(parts){
  var C=2*Math.PI*38, off=0, total=0;
  parts.forEach(function(p){ total+=p.value; });
  var segs='';
  if(!total){
    segs='<circle cx="50" cy="50" r="38" fill="none" stroke="#eef4f4" stroke-width="13"/>';
  }else{
    parts.forEach(function(p){
      if(!p.value) return;
      var len=C*p.value/total;
      segs+='<circle cx="50" cy="50" r="38" fill="none" stroke="'+p.color+'" stroke-width="13" stroke-dasharray="'+
        (len-2).toFixed(2)+' '+(C-len+2).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" stroke-linecap="butt"/>';
      off+=len;
    });
  }
  return '<svg viewBox="0 0 100 100" style="width:104px;height:104px;flex:0 0 104px;transform:rotate(-90deg)">'+segs+'</svg>';
}
function catMatrix(){

  var body=CATS.map(function(c){

      var n=S.projects.filter(function(p){ return p.cat===c.key && p.phase===ph.key; }).length;

  }).join('');
